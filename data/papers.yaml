# Awesome-GUI-Agent-Security 论文数据源
#
# ⚠️ 这是本仓库的唯一数据源。README.md 与 papers_by_*/ 下所有文件均由
#    scripts/build.py 从本文件生成，请勿手工编辑那些文件。
#
# 字段说明（必填项标 *）：
#   id*        arXiv ID，如 2608.06477（不带版本号）。非 arXiv 用 url 字段
#   title*     论文官方完整标题
#   abbr       方法/基准缩写，如 StepJack
#   date*      arXiv v1 提交日期，YYYY-MM
#   venue      发表会议/期刊，未发表填 arXiv
#   section*   所属小节 ID，见 scripts/sections.yaml
#   env*       环境标签，多选：web / mobile / desktop / cross
#   summary*   中文简介，2-4 句 150-300 字，须含动机/机制/关键数字
#   code       代码仓库 URL
#   url        非 arXiv 来源的链接（第 4 章商用产品安全用）
#
# 收录边界（详见 CONTRIBUTING.md）：
#   论文的**主要研究对象**必须是 GUI / computer-use / browser / mobile agent。
#   仅把 GUI agent 当作若干实验环境之一的通用 LLM 安全工作 → 不收。

papers:
  - id: "2608.06477"
    title: "StepJack: Benchmarking Computer-Use Agent Safety Against Multi-Step Indirect Prompt Injection"
    abbr: "StepJack"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop, cross]
    summary: >-
      Existing indirect prompt injection (IPI) benchmarks for computer-use agents rely on single-step
      injections, which fail to capture the risk profile of realistic multi-step workflows. StepJack
      introduces a multi-step IPI benchmark of 480 cases that distributes the payload across intermediate
      steps, modelling an adversary who can only contaminate one stage of the pipeline. Multi-step injection
      raises attack success by up to 31.2 points over single-step, showing that current benchmarks
      substantially understate real exposure and that defenses rarely fire once execution is mid-flow.
    summary_zh: >-
      针对现有间接提示注入评测多为单步、无法刻画真实 CUA 长流程风险的问题，提出多步 IPI 基准
      StepJack，构造 480 个测试用例，把注入载荷分散在多步任务的中间环节，模拟攻击者只能污染
      流程某一环的现实约束。实验显示多步注入相比单步把攻击成功率最高抬升 31.2 个百分点，
      说明单步评测显著低估了 CUA 的真实暴露面，且现有防御在流程中段几乎不再触发。

  - id: "2608.02018"
    title: "Invisible Ink Threats: Adversarial Goals Behind Legitimate Tasks in Computer-Use Agents"
    abbr: "Invisible Ink"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop]
    summary: >-
      Studies how adversarial goals can be concealed inside tasks that look entirely legitimate, so a
      computer-use agent fulfils the attacker's objective while carrying out work the user has already
      approved. The key finding is that such attacks defeat human-in-the-loop confirmation: every individual
      action in the trajectory looks reasonable under review, and harm only emerges from their composition.
      This exposes a structural blind spot in step-by-step approval, the dominant defense paradigm for CUAs.
    summary_zh: >-
      研究攻击者如何把恶意目标伪装在看似合法的任务描述中，使 CUA 在执行用户确认过的正常任务时
      顺带完成攻击者目标。核心发现是这类攻击能绕过 human-in-the-loop 确认机制——因为人工审核
      看到的动作序列本身每一步都合理，只有组合起来才产生危害。这揭示了「逐步确认」这一主流
      防御范式的结构性盲区。

  - id: "2606.23189"
    title: "Capable but Careless: Do Computer-Use Agents Follow Contextual Integrity?"
    abbr: "Capable but Careless"
    date: "2026-06"
    venue: "arXiv"
    section: "1.5"
    env: [desktop]
    summary: >-
      Applies the contextual integrity framework to ask whether computer-use agents respect information-flow
      norms when operating across applications. More capable agents turn out to be more prone to violations:
      to complete a task they will carry private data from one application into another's input fields, and no
      existing privacy control fires because every individual read and write stays within granted permissions.
      Proposes evaluating agents by information flow rather than by permission boundaries.
    summary_zh: >-
      用「上下文完整性」（contextual integrity）框架考察 CUA 在跨应用操作时是否会不当传播敏感
      信息。结论是能力越强的 agent 反而越容易越界：它们为完成任务会主动把 A 应用中的私密数据
      带入 B 应用的输入框，而这类行为不触发任何现有的隐私告警，因为每一次读写都在授权范围内。
      提出了以信息流而非权限边界为判据的评估方法。

  - id: "2608.04755"
    title: "\"Allow\" to Achieve, Over-Privileged Inadvertently: The Unintended Cost of Task-Completion-Driven Pop-up Decisions in Mobile GUI Agents"
    abbr: "Allow to Achieve"
    date: "2026-08"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Identifies a systematic over-granting tendency in mobile GUI agents facing permission dialogs, and
      isolates two biases: App-Trust Bias, where agents allow anything requested by an already-installed app,
      and Task-Prior Override, where completing the task outweighs least-privilege. The result is silent
      accumulation of permissions far beyond task requirements, reducing the permission prompt — the last line
      of user-facing defense — to a formality.
    summary_zh: >-
      发现移动 GUI agent 在遇到权限弹窗时存在系统性的过度授权倾向，识别出两种偏差：App-Trust
      Bias（对已安装应用默认信任而一律点允许）与 Task-Prior Override（为达成任务目标而牺牲
      权限最小化）。结果是 agent 在用户不知情的情况下累积远超任务所需的权限，把权限弹窗这一
      最后防线变成了形式。

  - id: "2607.00333"
    title: "(A)I Sees What You Don't: Exploiting New Attack Surfaces in Third-Party Mobile Agents"
    abbr: "AI Sees"
    date: "2026-07"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Systematically maps the attack surface introduced by third-party mobile agents, centred on a perception
      gap: agents read screen content that users never see or never attend to, including hidden views,
      background notifications, and accessibility nodes. An attacker can exploit this asymmetry to steer the
      agent in ways the user cannot possibly notice, and the paper argues the third-party agent ecosystem
      lacks any mechanism constraining what an agent is allowed to perceive.
    summary_zh: >-
      系统分析第三方移动 agent 引入的新攻击面，核心是「感知鸿沟」——agent 能读取到屏幕上用户
      实际看不到或不会注意的内容（隐藏视图、后台通知、无障碍节点），攻击者可利用这一差异实施
      用户完全无法察觉的诱导。指出第三方 agent 生态缺乏对 agent 可见性范围的约束机制。

  - id: "2607.29199"
    title: "Alignment Is Local: A Paired Diagnostic for GUI Agents under User Persuasion"
    abbr: "Alignment Is Local"
    date: "2026-07"
    venue: "arXiv"
    section: "1.7"
    env: [mobile, cross]
    summary: >-
      Introduces a paired diagnostic that measures how far a GUI agent's safety alignment degrades under
      multi-turn user persuasion. Alignment turns out to be local: agents refuse a harmful request in a single
      turn, then concede incrementally as the user persists with plausible-sounding justifications — and this
      decay is invisible to every single-turn metric. The finding implies that single-turn safety evaluation
      cannot characterise risk in realistic multi-turn interaction.
    summary_zh: >-
      提出成对诊断方法，衡量 GUI agent 的安全对齐在多轮用户说服下的退化程度。关键发现是对齐
      具有「局部性」：agent 在单轮拒绝有害请求，但在用户连续追问、提供看似合理的理由后会逐步
      让步，且这种退化不体现在任何单轮评测指标上。说明当前基于单轮的安全评测无法反映真实
      多轮交互下的风险。

  - id: "2603.08316"
    title: "SlowBA: An Efficiency Backdoor Attack towards VLM-based GUI Agents"
    abbr: "SlowBA"
    date: "2026-03"
    venue: "arXiv"
    section: "1.6"
    env: [mobile, cross]
    summary: >-
      Proposes an efficiency backdoor against VLM-based GUI agents: the trigger leaves task outcomes unchanged
      and instead inflates response latency or step count. Such backdoors are extremely hard to notice because
      every correctness check still passes and only resource consumption reveals them, so they can persist
      indefinitely while imposing continuous compute cost. This broadens the GUI-agent backdoor threat model
      from outcome tampering to availability and economic attacks.
    summary_zh: >-
      提出针对 VLM-based GUI agent 的效率后门：触发器不改变任务最终结果，只让 agent 的响应
      延迟大幅增加或步数显著膨胀。这类后门极难被察觉——正确性检测全部通过，只有观察资源消耗
      才能发现，因此可长期潜伏并造成持续的算力成本损失。拓展了 GUI agent 后门的威胁定义，
      从「结果篡改」扩展到「可用性与经济性攻击」。

  - id: "2608.08939"
    title: "Not an A11y: How Android Accessibility Exposes Mobile AI Agents to Indirect Prompt Injection"
    abbr: "Not an A11y"
    date: "2026-08"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Shows that the Android accessibility tree is an overlooked injection channel for mobile agents: any app
      can write text into accessibility nodes, and agents consume that content as trusted interface semantics.
      No special permission is required — an ordinary app suffices to inject instructions. The path bypasses
      defenses aimed at screenshots or web content entirely, revealing the absence of input-channel governance
      for mobile agents.
    summary_zh: >-
      指出 Android 无障碍树（accessibility tree）是移动 agent 的一条被忽视的注入通道：任何
      应用都能往无障碍节点写入文本，而 agent 会把这些内容当作可信的界面语义读取。攻击者无需
      任何特殊权限即可通过普通应用注入指令。这条路径完全绕开了针对视觉截图或网页内容的
      防御，暴露出移动 agent 输入通道治理的缺失。

  - id: "2608.02643"
    title: "CUADebug: Diagnosing and Repairing Computer-Use Agent Failures"
    abbr: "CUADebug"
    date: "2026-07"
    venue: "arXiv"
    section: "2.5"
    env: [desktop]
    summary: >-
      Targets diagnosis and repair after a computer-use agent fails, proposing a framework that localises the
      failing step and generates a fix. Although framed around reliability, its failure attribution and state
      rollback capabilities transfer directly to post-incident security recovery: determining where a hijacked
      agent first deviated and reverting to the last trusted state. It is one of the few systematic works in
      the post-hoc recovery defense layer.
    summary_zh: >-
      面向 CUA 执行失败后的诊断与修复，提出定位失败步骤并生成修复方案的框架。虽以可靠性为
      出发点，但其失败归因与状态回滚能力可直接用于安全事件的事后恢复——在 agent 被注入劫持后
      判断从哪一步开始偏离、并回退到最后一个可信状态。是「事后恢复」这一防御层中较少见的
      系统性工作。

  - id: "2604.02947"
    title: "AgentHazard: A Benchmark for Evaluating Harmful Behavior in Computer-Use Agents"
    abbr: "AgentHazard"
    date: "2026-04"
    venue: "arXiv"
    section: "3.1"
    env: [desktop]
    summary: >-
      Addresses the novel risks that arise once computer-use agents can act persistently across tools and
      files, introducing AgentHazard, a benchmark of 2,653 instances spanning diverse risk categories and
      attack strategies. The central observation is that harmful behaviour typically accumulates from a chain
      of individually plausible but collectively unsafe actions. Claude Code backed by Qwen3-Coder reaches a
      73.63% attack success rate, indicating that base-model alignment alone does not secure the agent layer.
    summary_zh: >-
      针对 CUA 具备跨工具、跨文件持久化操作能力后产生的新型安全风险，构建覆盖多风险类别与
      攻击策略的基准 AgentHazard，含 2653 个实例。关键结论是有害行为往往由一串「单看都合理、
      合起来不安全」的动作累积产生。实测 Claude Code 搭配 Qwen3-Coder 的攻击成功率达 73.63%，
      表明仅靠底座模型的对齐无法保障 agent 层面的安全。

  - id: "2608.30207"
    title: "SIR: Self-improving Red-teaming for Compute Use Agents"
    abbr: "SIR"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop, web]
    summary: >-
      Argues that existing CUA safety benchmarks use hand-written fixed injections and therefore understate an
      adaptive adversary. SIR is a black-box IPI attack that composes stealthy injections from a small library
      of reusable, plain-language principles, wrapped in an iterative feedback loop that diagnoses failed
      attack trajectories and distils successful bypasses back into the library. Red-teaming becomes
      self-improving, implying that conclusions drawn from static payloads decay as attackers iterate.
    summary_zh: >-
      指出现有 CUA 安全基准用的都是人工手写的固定注入载荷，会低估自适应攻击者的真实威胁。提出
      黑盒 IPI 攻击 SIR：从一个用自然语言描述的可复用「隐蔽性原则」小库中组合注入内容，再套一层
      迭代反馈循环——诊断受害 agent 失败的攻击轨迹，把成功绕过的模式蒸馏回原则库。这把红队从
      静态测试变成自我改进的过程，说明固定载荷的评测结论会随攻击者迭代迅速失效。

  - id: "2608.27808"
    title: "CURA: Certified Runtime Alarms for Computer-Use Agents"
    abbr: "CURA"
    date: "2026-08"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Shows that self-report — the cheapest oversight channel a deployer has — fails exactly where oversight
      matters. Across 361 OSWorld tasks the pipeline scores 82.9 on average (above the 72.4 human reference),
      yet 64 of 71 failures (90%) end with a success claim, 61 assert no blocker, and the explicit failure
      affordance goes unused across roughly 9,100 calls. CURA is an external monitor reading only
      harness-visible telemetry — no model internals, extra LLM calls, or prompt changes — turning the
      trajectory into a sequential test with certified false-alarm control: at alpha = 0.10 its CUSUM alarm
      detects 42.3% of failures a median of 31 steps before termination at a realized false-alarm rate of
      0.066.
    summary_zh: >-
      揭示 self-report 这一最廉价的监督通道恰恰在最需要它的地方失效：在 361 个 OSWorld 任务上，
      流水线平均分 82.9（超过人类基线 72.4），但 71 次失败里有 64 次（90%）以「成功」收尾，
      61 次声称没有遇到任何阻碍，约 9100 次调用中显式的失败上报机制从未被使用。提出外部监控器
      CURA，只读 harness 可见的遥测数据，不需模型内部状态、额外 LLM 调用或改 prompt，把运行
      轨迹转成带误报率保证的序贯检验：α=0.10 时 CUSUM 告警能在终止前中位 31 步检出 42.3% 的
      失败，实测误报率 0.066。

  - id: "2608.26204"
    title: "ADeptS-Bench: Measuring the Trustworthiness of Computer Use Agents Across Devices"
    abbr: "ADeptS-Bench"
    date: "2026-08"
    venue: "arXiv"
    section: "3.1"
    env: [desktop, mobile]
    summary: >-
      Fills the gap that no benchmark jointly assesses whether CUAs interact safely with visual interfaces
      while handling ambiguous instructions. ADeptS-Bench is a dual-stream trustworthiness benchmark: the
      Safety stream pairs benign and malicious tasks with threats embedded in the visual interface, and the
      Disambiguation stream tests whether agents seek clarification under ambiguous intent. Across seven
      models none stays above 80% task success while holding attack success below 30%; every model clicks
      Checkout on a $25K order, and none detects a factory-reset button mislabelled as Optimize.
    summary_zh: >-
      针对「没有基准能同时考察 CUA 在视觉界面下的安全性与对模糊指令的处理」这一空缺，提出双流
      可信度基准 ADeptS-Bench：Safety 流提供威胁嵌在视觉界面中的良性/恶意配对任务，Disambiguation
      流考察 agent 在意图模糊时是否会主动澄清。评测 7 个模型的结论相当刺眼——没有模型能在任务
      成功率超 80% 的同时把攻击成功率压到 30% 以下；所有模型都会毫不犹豫点下 2.5 万美元订单的
      「结账」，也没有一个能识别出被标为「优化」的按钮实际是「恢复出厂设置」。

  - id: "2608.24099"
    title: "Are Android GUI Agents Robust Against Runtime Anomalies? AnTrap: Evaluating Agents in Dynamic Adversarial Environments"
    abbr: "AnTrap"
    date: "2026-08"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Notes that existing benchmarks lack systematic evaluation of GUI-agent robustness to runtime anomalies,
      though unexpected pop-ups and action misuse are routine on real Android devices. AnTrap organises
      real-world anomalies into a four-layer taxonomy (State, Thinking, Action, Round) with ten subcategories,
      plus a construction pipeline that injects adversarial perturbation while keeping tasks solvable.
      Evaluating 16 leading GUI models reveals universal vulnerability, with even the strongest degrading
      significantly; GRPO training in both clean and adversarial environments separates environment difficulty
      from model capability.
    summary_zh: >-
      指出现有基准缺乏对 GUI agent 运行时异常鲁棒性的系统评估，而 Android 实机部署中意外弹窗、
      动作误用等动态扰动十分常见。提出基准 AnTrap，把真实异常归纳为 State / Thinking / Action /
      Round 四层共十个细分类别，并设计了在注入对抗扰动的同时保持任务仍可完成的构造流程。评测
      16 个主流 GUI 模型显示对动态异常存在普遍脆弱性，最强模型也出现显著性能下降；作者还在
      原始与对抗环境下各做一轮 GRPO 训练，以区分环境难度与模型能力两个混杂因素。

  - id: "2608.17659"
    title: "MobileWorldSafety: Benchmarking GUI Agent Safety Against Environmental Injection Attacks in Android Apps"
    abbr: "MobileWorldSafety"
    date: "2026-08"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Argues that existing benchmarks miss everyday usage and offer no systematic evaluation of mobile GUI
      agents under environmental injection — a pressing gap now that such agents are moving from prototypes
      into deployment while continuously processing untrusted environmental content. MobileWorldSafety
      comprises 142 risk tasks built on real Android applications, covering indirect prompt injection and
      adversarial instructions across everyday channels, with a programmatically verifiable success condition
      per task so attack outcomes are objectively measurable.
    summary_zh: >-
      指出现有基准脱离日常使用场景，缺乏对移动 GUI agent 在环境注入下的系统评估——而这类
      agent 已从研究原型走向真实部署，且日常操作中会不断处理不可信的环境内容。提出基于真实
      Android 应用构建的基准 MobileWorldSafety，含 142 个风险任务，覆盖间接提示注入与对抗
      指令等多种日常渠道，每个任务都定义了可程序化验证的判定条件，使攻击是否成功可被客观测量。

  - id: "2607.08147"
    title: "Prismata: Confining Cross-Site Prompt Injection in Web Agents"
    abbr: "Prismata"
    date: "2026-07"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Frames web-agent injection as a recurrence of XSS: mixing trusted and untrusted content was already
      proven dangerous, and agents revive the risk by interpreting natural language as instructions, letting
      third-party and user-generated content hijack them. The core difficulty is that deriving a task-specific
      security policy requires reasoning over page structure already entangled with attacker content. Prismata
      enforces contextual least privilege via dynamic trust derivation that assigns permission labels to page
      content with structural confinement guarantees inspired by classical integrity models, constraining both
      what the agent sees and what it can do.
    summary_zh: >-
      把 web agent 面临的注入风险类比为 XSS 的重现：XSS 已经证明混合可信与不可信内容是危险的，
      而 agent 把自然语言当指令解释，使第三方与用户生成内容能够劫持 agent。核心难点在于推导
      任务专属的安全策略需要理解页面结构，而页面结构本身已与攻击者内容纠缠。提出 Prismata，
      借鉴经典完整性模型的思路做动态信任推导，为页面内容打上权限标签并提供结构性隔离保证，
      同时约束 agent「能看到什么」与「能做什么」，实现上下文最小权限。

  - id: "2607.05277"
    title: "Untrusted Content Masking for Web Agents with Security Guarantees"
    abbr: "UCM"
    date: "2026-07"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Observes that provable injection defenses depend on strict isolation between trusted instructions and
      untrusted data — natural in text-based tool-use settings where an agent can reason from interface
      definitions alone — but web agents must first observe the rendered page, which structurally intermingles
      trusted and untrusted content and dissolves the very trust boundary those guarantees rest on. Untrusted
      Content Masking restores that boundary in web environments by exploiting a structural property of pages,
      letting provable defenses carry over.
    summary_zh: >-
      指出可证明的注入防御依赖可信指令与不可信数据之间的严格隔离，这在纯文本的 tool-use 场景
      中天然成立（agent 可只依据接口定义推理，无需接触不可信内容），但 web agent 必须先观察
      渲染后的页面才能感知环境，而页面把可信与不可信内容结构性地混在一起，导致安全保证赖以
      成立的信任边界消失。提出 Untrusted Content Masking，利用页面的结构特性在 web 环境中
      重建这一边界，使既有的可证明防御能够迁移过来。

  - id: "2606.20717"
    title: "MIRAGE: Stealthy Visual Prompt Injection for Vulnerability Detection in Web Agents"
    abbr: "MIRAGE"
    date: "2026-06"
    venue: "arXiv"
    section: "1.2"
    env: [web]
    summary: >-
      Criticises adversarial evaluations of multimodal web agents for adopting permissive threat models and
      visually conspicuous artifacts. This work moves to a constrained, realistic setting where the evaluator
      is an unprivileged third party — a merchant or advertiser — controlling only a semantically legitimate,
      spatially bounded region such as an ad slot or sponsored card. Under those constraints MIRAGE performs
      visual indirect prompt injection for targeted next-action hijacking, showing that control over one small
      legitimate region suffices to steer a vision-based agent.
    summary_zh: >-
      批评现有针对多模态 web agent 的对抗评测普遍采用过于宽松的威胁模型、依赖视觉上显眼的
      伪影。本文转向受约束的现实设定：评测者只是不具特权的第三方（如商家或广告主），仅能控制
      广告位、赞助卡片这类语义合法且空间受限的区域。在此约束下提出视觉间接注入框架 MIRAGE，
      实现对下一步动作的定向劫持，说明即便攻击者只掌握页面上一小块合法区域，也足以操纵
      基于视觉的 agent。

  - id: "2606.13385"
    title: "Who Pays the Price? Stakeholder-Centric Prompt Injection Benchmarking for Real-world Web Agents"
    abbr: "Who Pays the Price"
    date: "2026-06"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Points out that existing security benchmarks take an attack-centric view, measuring whether injection is
      technically feasible while ignoring how the resulting harm is distributed. The paper argues injection
      risk is victim-dependent: one exploit yields asymmetric consequences across stakeholders (user,
      platform, merchant), and the same attack pattern varies substantially in effectiveness depending on the
      target. It builds a stakeholder-centric benchmark focused on e-commerce, where agent actions carry
      direct financial consequences.
    summary_zh: >-
      指出现有安全基准都采用「攻击视角」，只关注注入在技术上是否可行，忽略了危害在不同受害方
      之间的分布差异。本文主张注入风险是**受害者依赖**的：同一个漏洞对不同利益相关方（用户、
      平台、商家）造成的后果高度不对称，同一攻击模式的有效性也随目标不同而显著变化。据此构建
      以利益相关方为中心的基准，聚焦电商这类动作直接带来财务后果的真实场景。

  - id: "2503.23434"
    title: "Towards Trustworthy GUI Agents: A Survey"
    abbr: "Trustworthy GUI Survey"
    date: "2025-03"
    venue: "arXiv"
    section: "0"
    env: [cross]
    summary: >-
      Frames the execution gap as the central obstacle to trustworthy GUI agents: the misalignment
      between perception, reasoning, and interaction in dynamic, partially observable interfaces.
      Unlike conversational systems, GUI agents perform irreversible operations such as submitting
      forms, granting permissions, or deleting data. The survey proposes a workflow-aligned taxonomy
      decomposing trust into Perception, Reasoning, and Interaction Trust, traces how failures
      propagate and compound through action/observation loops, and argues that task completion alone
      is an insufficient basis for trust assessment.
    summary_zh: >-
      把「执行落差」（execution gap）确立为可信 GUI agent 的核心障碍——即在动态、部分可观测界面下
      感知、推理与交互三者之间的错配。与对话系统不同，GUI agent 执行的是提交表单、授予权限、删除
      数据这类不可逆操作。综述提出与工作流对齐的分类法，把信任拆为感知信任、推理信任、交互信任
      三层，梳理失败如何在动作/观察循环中传播并累积，并主张仅用任务完成率评估可信度是不充分的。

  - id: "2507.05445"
    title: "A Systematization of Security Vulnerabilities in Computer Use Agents"
    abbr: "CUA Vuln SoK"
    date: "2025-07"
    venue: "arXiv"
    section: "0"
    env: [desktop, web]
    summary: >-
      Conducts systematic threat analysis and adversarial testing of real-world CUAs, identifying
      seven risk classes unique to the paradigm and dissecting three exploits in depth: clickjacking
      via visual overlays that mislead interface-level reasoning, indirect prompt injection achieving
      RCE through chained tool use, and CoT exposure attacks that hijack multi-step reasoning by
      manipulating implicit interface framing. The case studies converge on three architectural
      flaws shared across current implementations: no input provenance tracking, weak
      interface-action binding, and insufficient control-flow integrity.
    summary_zh: >-
      对真实 CUA 做系统化威胁分析与对抗测试，归纳出七类该范式独有的风险，并深入剖析三个具体
      利用链：用视觉覆盖层误导界面级推理的 clickjacking、经工具链串联实现远程代码执行的间接提示
      注入、以及通过操纵隐式界面语境劫持多步推理的 CoT 暴露攻击。三个案例共同指向当前实现的
      三处架构性缺陷：缺少输入来源追踪、界面与动作绑定薄弱、控制流完整性不足。

  - id: "2506.14866"
    title: "OS-Harm: A Benchmark for Measuring Safety of Computer Use Agents"
    abbr: "OS-Harm"
    date: "2025-06"
    venue: "arXiv"
    section: "3.4"
    env: [desktop]
    summary: >-
      Notes that CUA safety has been largely overlooked despite growing deployment, and introduces
      OS-Harm on top of the OSWorld environment to test three harm categories: deliberate user
      misuse, prompt injection attacks, and model misbehavior. It comprises 150 tasks spanning
      harassment, copyright infringement, disinformation, and data exfiltration, requiring
      interaction with email clients, code editors, and browsers. An automated judge scores both
      accuracy and safety with high human agreement (0.76 and 0.79 F1).
    summary_zh: >-
      指出 CUA 已在快速部署但安全性长期被忽视，基于 OSWorld 环境构建 OS-Harm，考察三类危害：
      用户故意滥用、提示注入攻击、模型自身失当行为。含 150 个任务，覆盖骚扰、侵犯版权、虚假
      信息、数据外泄等违规类型，要求 agent 操作邮件客户端、代码编辑器、浏览器等多种应用。
      配套自动评判器同时评估准确性与安全性，与人工标注一致性达 0.76 / 0.79 F1。

  - id: "2505.21499"
    title: "AdInject: Real-World Black-Box Attacks on Web Agents via Advertising Delivery"
    abbr: "AdInject"
    date: "2025-05"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Criticises prior environmental injection work for unrealistic assumptions — direct HTML
      manipulation, knowledge of user intent, or access to model parameters. AdInject instead
      injects malicious content through internet advertising delivery, operating under a black-box
      agent, static content constraints, and no knowledge of user intent. It combines ad content
      designed to lure agent clicks with VLM-based optimization that infers likely user intent from
      the target site, making it one of the most deployment-realistic threat models in this area.
    summary_zh: >-
      批评已有环境注入研究依赖不现实的假设——直接改 HTML、已知用户意图、或能访问模型参数。
      AdInject 改用互联网广告投放这一真实渠道注入恶意内容，威胁模型严格得多：agent 为黑盒、
      恶意内容静态不可变、且不掌握用户意图。方法上结合诱导 agent 点击的广告内容设计，以及
      基于 VLM 从目标站点反推用户潜在意图的内容优化，是该方向最贴近真实部署的威胁模型之一。

  - id: "2507.14293"
    title: "WebGuard: Building a Generalizable Guardrail for Web Agents"
    abbr: "WebGuard"
    date: "2025-07"
    venue: "arXiv"
    section: "2.2"
    env: [web]
    summary: >-
      Argues web agents need access controls analogous to those for human users, and releases the
      first dataset supporting web-agent action risk assessment: 4,939 human-annotated
      state-changing actions from 193 websites across 22 domains, including often-overlooked
      long-tail sites, labelled under a three-tier schema (SAFE / LOW / HIGH) with designated
      train-test splits for generalization study. The headline finding is stark — even frontier LLMs
      predict action outcomes with under 60% accuracy.
    summary_zh: >-
      主张 web agent 需要类似人类用户的访问控制机制，并发布首个支持 agent 动作风险评估的数据集：
      来自 22 个领域、193 个网站（含常被忽视的长尾站点）的 4939 条人工标注状态改变动作，按
      SAFE / LOW / HIGH 三级风险标注，并划分好训练测试集以支持泛化研究。核心结论相当刺眼——
      即便前沿 LLM 预测动作后果的准确率也不足 60%。

  - id: "2510.20333"
    title: "GhostEI-Bench: Do Mobile Agents Resilience to Environmental Injection in Dynamic On-Device Environments?"
    abbr: "GhostEI-Bench"
    date: "2025-10"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Identifies environmental injection as an underexplored threat distinct from prompt-based
      attacks: rather than manipulating textual instructions, it corrupts visual perception by
      inserting adversarial UI elements such as deceptive overlays or spoofed notifications directly
      into the GUI, bypassing textual safeguards and risking privacy leakage, financial loss, or
      irreversible device compromise. GhostEI-Bench moves beyond static image assessment by
      injecting adversarial events into realistic application workflows inside fully operational
      Android emulators.
    summary_zh: >-
      把环境注入确立为区别于提示类攻击的、研究不足的威胁向量：它不改文本指令，而是把欺骗性
      覆盖层、伪造通知这类对抗 UI 元素直接插入 GUI 以污染 agent 的视觉感知，从而绕开文本层
      防护，可导致隐私泄漏、财务损失甚至不可逆的设备失陷。GhostEI-Bench 跳出静态图像评测，
      在完整可运行的 Android 模拟器中把对抗事件注入真实应用工作流。

  - id: "2604.02623"
    title: "Poison Once, Exploit Forever: Environment-Injected Memory Poisoning Attacks on Web Agents"
    abbr: "eTAMP"
    date: "2026-04"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Memory makes web agents personalized yet exploitable: storing past interactions creates a
      persistent attack surface spanning websites and sessions. Whereas prior work assumes attackers
      can write to memory directly or exploit cross-user sharing, eTAMP achieves cross-session,
      cross-site compromise through environmental observation alone — a single contaminated
      observation such as viewing a manipulated product page silently poisons memory and activates
      during later tasks on different sites, bypassing permission-based defenses. Attack success
      reaches 32.5% on GPT-5-mini, 23.4% on GPT-5.2, and 19.5% on GPT-OSS-120B, and the paper
      further identifies Frustration Exploitation.
    summary_zh: >-
      记忆让 web agent 变得个性化，也使其可被利用：存储历史交互创造出跨站点、跨会话持续存在的
      攻击面。已有研究假设攻击者能直接写入记忆或利用跨用户共享，而 eTAMP 仅靠环境观察就实现
      跨会话跨站点污染——单次被污染的观察（如浏览一个被操纵的商品页）即可静默投毒记忆，并在
      日后其他网站的任务中激活，绕开基于权限的防御。攻击成功率在 GPT-5-mini 上达 32.5%、
      GPT-5.2 上 23.4%、GPT-OSS-120B 上 19.5%，另发现「挫败感利用」现象。

  - id: "2603.23007"
    title: "AgentRAE: Remote Action Execution through Notification-based Visual Backdoors against Screenshots-based Mobile GUI Agents"
    abbr: "AgentRAE"
    date: "2026-03"
    venue: "arXiv"
    section: "1.6"
    env: [mobile]
    summary: >-
      Existing backdoors against web GUI agents rely on environmental injection or deceptive pop-ups,
      which fail on screenshot-based mobile agents due to restricted trigger design space, OS
      background interference, and conflicts among multiple trigger-action mappings. AgentRAE
      induces Remote Action Execution using visually natural triggers such as benign app icons in
      notifications, via a two-stage pipeline that first sharpens the agent's sensitivity to subtle
      iconographic differences through contrastive learning, then binds each trigger to a specific
      action through backdoor post-training.
    summary_zh: >-
      已有针对 web GUI agent 的后门依赖环境注入或欺骗性弹窗，但在基于截图的移动 agent 上失效——
      触发器设计空间受限、操作系统后台干扰、以及多个触发器与动作映射之间相互冲突。AgentRAE 用
      视觉上自然的触发器（如通知栏里的正常应用图标）诱发远程动作执行，采用两阶段流程：先用
      对比学习强化 agent 对细微图标差异的敏感度，再通过后门后训练把每个触发器绑定到特定动作。

  - id: "2604.07831"
    title: "Are GUI Agents Focused Enough? Automated Distraction via Semantic-level UI Element Injection"
    abbr: "Semantic UI Injection"
    date: "2026-04"
    venue: "arXiv"
    section: "1.2"
    env: [cross]
    summary: >-
      Notes two limits in existing GUI-agent red-teaming: adversarial perturbations need white-box
      access unavailable commercially, and prompt injection is increasingly neutralized by stronger
      alignment. Semantic-level UI Element Injection is a black-box paradigm overlaying
      safety-aligned, harmless UI elements onto screenshots to misdirect visual grounding, pairing a
      modular Editor-Overlapper-Victim pipeline with iterative search. Across 19 victim models in 8
      families, strategic optimization beats random injection by 3.5-6.9x on the most robust
      victims and transfers near-perfectly across architectures.
    summary_zh: >-
      指出现有 GUI agent 红队研究的两个局限：对抗扰动需要商业部署中拿不到的白盒访问，而提示
      注入正被日益增强的安全对齐所化解。提出黑盒范式「语义级 UI 元素注入」——把本身安全对齐、
      内容无害的 UI 元素叠加到截图上以误导视觉 grounding，用模块化的 Editor-Overlapper-Victim
      流水线配合迭代搜索。在 8 个模型家族共 19 个受害模型上，策略化优化相比随机注入在最鲁棒的
      模型上高出 3.5–6.9 倍，且跨架构迁移性近乎完美。

  - id: "2604.09155"
    title: "CORA: Conformal Risk-Controlled Agents for Safeguarded Mobile GUI Automation"
    abbr: "CORA"
    date: "2026-04"
    venue: "arXiv"
    section: "2.6"
    env: [mobile]
    summary: >-
      Existing GUI-agent safeguards rest on prompt engineering, brittle heuristics, and VLM-as-critic,
      offering neither formal verification nor user-tunable guarantees. CORA is a post-policy,
      pre-action framework giving statistical guarantees on harmful executed actions: it reframes
      safety as selective action execution, trains a Guardian to estimate action-conditional risk,
      then uses Conformal Risk Control to calibrate an execute/abstain boundary meeting a
      user-specified risk budget, routing rejected actions to a Diagnostician that recommends
      confirm, reflect, or abort. A Goal-Lock mechanism guards against visual injection.
    summary_zh: >-
      现有 GUI agent 防护依赖 prompt 工程、脆弱的启发式规则与 VLM-as-critic，既无形式化验证也
      不提供用户可调的保证。CORA 是一个「策略之后、动作之前」的防护框架，对已执行的有害动作
      给出统计保证：把安全性重构为选择性动作执行，训练 Guardian 模型估计动作条件风险，再用
      Conformal Risk Control 校准满足用户指定风险预算的执行/弃权边界，被拒动作交由
      Diagnostician 做多模态推理并建议确认、反思或中止。另设 Goal-Lock 机制抵御视觉注入。

  - id: "2603.17357"
    title: "WebPII: Benchmarking Visual PII Detection for Computer-Use Agents"
    abbr: "WebPII"
    date: "2026-03"
    venue: "arXiv"
    section: "1.5"
    env: [web, desktop]
    summary: >-
      CUAs create new privacy risks from two directions: training data scraped from real websites
      inevitably contains sensitive information, and cloud-hosted inference exposes user screenshots.
      No public benchmark existed for detecting PII in web screenshots. WebPII provides 44,865
      annotated e-commerce UI images with an extended PII taxonomy covering transaction-level
      re-identification identifiers, anticipatory detection for partially-filled forms, and scalable
      VLM-based UI reproduction. The accompanying WebRedact more than doubles text-extraction
      baseline accuracy (0.753 vs 0.357 mAP@50) at 20ms CPU latency.
    summary_zh: >-
      CUA 从两个方向带来新的隐私风险：从真实网站采集的训练数据不可避免含敏感信息，而云端推理
      会暴露用户截图。此前没有公开基准用于检测网页截图中的个人身份信息。WebPII 提供 44865 张
      标注的电商 UI 图像，特点包括扩展的 PII 分类（含可用于重识别的交易级标识符）、针对用户
      正在填写的半完成表单的前瞻式检测、以及基于 VLM 的可扩展 UI 复现。配套 WebRedact 把
      文本抽取基线准确率翻倍以上（0.753 vs 0.357 mAP@50），CPU 延迟仅 20ms。

  - id: "2604.00986"
    title: "Do Phone-Use Agents Respect Your Privacy?"
    abbr: "MyPhoneBench"
    date: "2026-04"
    venue: "arXiv"
    section: "1.5"
    env: [mobile]
    summary: >-
      Asks whether phone-use agents respect privacy while completing benign tasks — hard to answer
      because privacy-compliant behavior was never operationalized for such agents, and ordinary
      apps do not reveal what data agents type into which form fields. MyPhoneBench operationalizes
      privacy-respecting use as permissioned access, minimal disclosure, and user-controlled memory
      via a minimal privacy contract, paired with instrumented mock apps and rule-based auditing.
      Across five frontier models, 10 apps, and 300 tasks, task success, privacy-compliant
      completion, and later-session preference reuse prove to be distinct capabilities that no
      single model dominates.
    summary_zh: >-
      追问手机操作类 agent 在完成正常任务时是否尊重隐私。这一问题此前难以回答，因为隐私合规
      行为从未被形式化定义，且普通应用不会暴露 agent 究竟把哪些数据填进了哪个表单项。
      MyPhoneBench 用一份最小隐私契约把「尊重隐私」操作化为三条：授权访问、最小披露、用户可控
      记忆，并配以插桩的模拟应用与规则化审计。在 5 个前沿模型、10 个应用、300 个任务上发现，
      任务成功率、隐私合规完成度、后续会话中对已存偏好的使用是三种彼此独立的能力，无一模型全占优。

  - id: "2601.12349"
    title: "Mind the Gap: Action Rebinding Attacks against Android GUI Agents"
    abbr: "Action Rebinding"
    date: "2026-01"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Shows that treating GUI agents as high-privilege operators — perceiving screen content and
      injecting inputs across application boundaries — fundamentally conflicts with Android's strict
      app sandboxing. The cross-application Action Rebinding attack lets a malicious app holding
      zero dangerous permissions hijack agent execution: it renders a benign contextual carrier to
      elicit a planned action, then swaps the foreground to a sensitive target during reasoning
      latency, so the agent unwittingly executes in a privileged context. The attack is further
      weaponized into programmable multi-step exploit loops by abusing the agent's own task-recovery
      logic.
    summary_zh: >-
      指出把 GUI agent 当作高权限操作者（跨应用边界感知屏幕、注入输入）与 Android 严格的应用
      沙箱机制存在根本冲突。跨应用 Action Rebinding 攻击让一个不申请任何危险权限的恶意应用即可
      劫持 agent 执行：先渲染一个无害的「上下文载体」诱导 agent 规划出某个动作，再在其推理延迟
      窗口内把前台切换到敏感目标应用，agent 察觉不到切换、于是在特权上下文中执行了该动作。
      作者进一步利用 agent 自身的任务恢复逻辑，把攻击武器化为可编程的多步利用循环。

  - id: "2604.18860"
    title: "Temporal UI State Inconsistency in Desktop GUI Agents: Formalizing and Defending Against TOCTOU Attacks on Computer-Use Agents"
    abbr: "PUSV"
    date: "2026-04"
    venue: "arXiv"
    section: "1.4"
    env: [desktop]
    summary: >-
      Formalizes the observation-to-action gap in screenshot-and-click loops (mean 6.51 s on real
      OSWorld workloads) as a Visual Atomicity Violation, creating a Time-Of-Check-Time-Of-Use
      window for unprivileged UI manipulation. Three attack primitives are characterized:
      Notification Overlay Hijack, Window Focus Manipulation, and Web DOM Injection — the second
      being the desktop analog of Android Action Rebinding, achieving 100% action-redirection with
      zero visual evidence at observation time. The proposed PUSV defense re-verifies UI state
      immediately before each dispatch via masked pixel SSIM, global screenshot diff, and X Window
      snapshot diff, reaching 100% interception across 180 adversarial trials with no false
      positives and under 0.1 s overhead.
    summary_zh: >-
      把「截图—点击」循环中的观察到动作间隔（真实 OSWorld 负载下平均 6.51 秒）形式化为「视觉
      原子性破坏」，指出这构成一个 TOCTOU 窗口，无特权攻击者可在其中篡改 UI 状态。刻画三种攻击
      原语：通知覆盖劫持、窗口焦点操纵、网页 DOM 注入——其中第二种是 Android Action Rebinding
      的桌面对应物，动作重定向成功率 100% 且在观察时刻不留任何视觉痕迹。提出 PUSV 防御，在每次
      动作派发前立即复验 UI 状态（点击目标处的掩码像素 SSIM、全局截图差分、X Window 快照差分），
      在 180 次对抗试验中拦截率 100%、零误报、开销低于 0.1 秒。

  - id: "2509.22256"
    title: "Secure and Efficient Access Control for Computer-Use Agents via Context Space"
    abbr: "CSAgent"
    date: "2025-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Argues that granting agents control over computers is risky because of inherent LLM
      uncertainty — deviations from user intent can be irreversible — and that user confirmation and
      LLM-based dynamic validation each fall short on usability, security, or performance. CSAgent
      is a system-level, static policy-based access control framework that bridges static policy and
      dynamic context through intent- and context-aware policies, with an automated toolchain for
      constructing and refining them, enforced by an optimized OS service so actions execute only
      under specific user intents and contexts.
    summary_zh: >-
      主张把计算机控制权交给 agent 之所以危险，根源在 LLM 固有的不确定性——一旦动作偏离用户
      意图，后果可能不可逆；而用户确认与基于 LLM 的动态校验分别在可用性、安全性或性能上有短板。
      CSAgent 是系统级、基于静态策略的访问控制框架，通过「意图感知 + 上下文感知」策略弥合静态
      策略与动态上下文之间的落差，并提供自动化工具链协助开发者构造与精炼策略，最终由优化过的
      操作系统服务强制执行，确保动作只在特定用户意图与上下文下才被允许。

  - id: "2603.23791"
    title: "The Cognitive Firewall: Securing Browser Based AI Agents Against Indirect Prompt Injection Via Hybrid Edge Cloud Defense"
    abbr: "Cognitive Firewall"
    date: "2026-03"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Tackles the tension that cloud-based defenses offer strong semantic analysis but add latency
      and privacy exposure. The Cognitive Firewall is a three-stage split-compute architecture
      distributing checks across client and cloud: a local visual Sentinel, a cloud Deep Planner,
      and a deterministic Guard enforcing execution-time policies. Across 1,000 adversarial samples
      edge-only defenses miss 86.9% of semantic attacks, whereas the full hybrid drives attack
      success below 1% (0.88% static, 0.67% adaptive) while keeping deterministic constraints on
      side-effecting actions — and by filtering presentation-layer attacks locally it achieves
      roughly a 17,000x latency advantage over cloud-only baselines.
    summary_zh: >-
      针对「云端防御语义分析能力强但引入延迟与隐私暴露」这一矛盾，提出三阶段拆分计算架构
      Cognitive Firewall，把安全检查分布在客户端与云端：本地视觉 Sentinel、云端 Deep Planner、
      以及在执行期强制策略的确定性 Guard。在 1000 个对抗样本上，纯边端防御漏检 86.9% 的语义
      攻击，而完整混合架构把攻击成功率压到 1% 以下（静态评测 0.88%、自适应评测 0.67%），同时
      对有副作用的动作保持确定性约束；由于表现层攻击在本地即被过滤，相比纯云端基线取得约
      17000 倍的延迟优势。

  - id: "2608.04741"
    title: "LoginTrap: Uncovering Task-Agnostic Phishing-Style Indirect Prompt Injection Attacks against LLM-based Web Agents"
    abbr: "LoginTrap"
    date: "2026-08"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Login is a sensitive authentication boundary for web agents because it involves credentials,
      yet prior work has not examined whether malicious page content can induce login and cause
      end-to-end private data leakage. LoginTrap is a task-agnostic login-inducing attack assuming a
      black-box attacker who controls page context and the induced login flow without knowing the
      user task or agent internals: through a fuzzing-inspired process it generates page-specific
      indirect injections that make login look like a plausible prerequisite for continuing the
      task, steering the agent to an attacker-controlled login page.
    summary_zh: >-
      登录对 web agent 而言是涉及凭据的敏感认证边界，但已有工作尚未考察恶意页面内容能否诱导
      agent 登录并造成端到端的私密数据泄漏。LoginTrap 是一种与任务无关的诱导登录攻击，假设
      黑盒攻击者只控制页面上下文与被诱导的登录流程，并不知道用户任务或 agent 内部实现：通过
      类 fuzzing 的流程生成页面专属的间接注入内容，使「先登录」看起来是继续完成任务的合理
      前置条件，从而把 agent 引导至攻击者控制的登录页。

  - id: "2602.13516"
    title: "SPILLage: Agentic Oversharing on the Web"
    abbr: "SPILLage"
    date: "2026-02"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Unlike chatbots answering questions in controlled settings, web agents act in the wild with
      access to user resources such as emails and calendars, interacting with third parties and
      leaving an action trace. The paper formalizes Natural Agentic Oversharing — unintentional
      disclosure of task-irrelevant user information through that trace — and characterizes it along
      channel (content vs. behavior) and directness (explicit vs. implicit). This exposes a blind
      spot: prior work targets text leakage, but agents also overshare behaviorally through clicks,
      scrolls, and navigation patterns that third parties can monitor. Benchmarked on 180 tasks
      across live e-commerce sites.
    summary_zh: >-
      与在受控环境中回答问题的聊天机器人不同，web agent 是「在野」运行的：它能访问用户的邮件、
      日历等资源，与第三方交互，并留下动作轨迹。本文把「自然的 agent 过度分享」形式化为——
      通过这条动作轨迹无意披露与任务无关的用户信息，并沿「通道」（内容 vs. 行为）与「直接性」
      （显式 vs. 隐式）两个维度刻画。这揭示了一处盲区：已有工作聚焦文本泄漏，但 agent 还会通过
      点击、滚动、导航模式等行为层面过度暴露，而这些可被第三方监测。在真实电商站点的 180 个
      任务上做了基准评测。

  - id: "2607.15550"
    title: "SeerGuard: A Safety Framework for Mobile GUI Agents via World Model Prediction"
    abbr: "SeerGuard"
    date: "2026-07"
    venue: "arXiv"
    section: "2.2"
    env: [mobile]
    summary: >-
      Argues that existing safety mechanisms for mobile GUI agents are fundamentally reactive
      and cannot assess risk before an action fires, which matters because a single erroneous
      action can be irreversible. SeerGuard is a consequence-aware framework combining
      instruction-level screening with action-level risk assessment: it analyses proposed
      actions against the current GUI state and anticipates likely outcomes before execution.
      The enabling component is a safety-augmented world model trained via multi-task learning
      that fuses semantic next-state prediction with risk assessment, and the framework
      transfers across different underlying GUI agents rather than being tied to one model.
    summary_zh: >-
      指出移动 GUI agent 现有安全机制本质上都是被动响应，无法在动作触发前评估风险，而这类
      agent 的单个错误动作往往不可逆。SeerGuard 是「后果感知」框架，将指令级筛查与动作级
      风险评估结合：在当前 GUI 状态下分析 agent 拟执行的动作，预判可能结果再决定是否放行。
      支撑能力来自一个多任务学习训练的安全增强世界模型（SAWM），把语义化的下一状态预测与
      安全风险评估融进同一个模型，且该框架可跨不同底层 GUI agent 迁移。

  - id: "2602.01725"
    title: "SafePred: A Predictive Guardrail for Computer-Using Agents via World Models"
    abbr: "SafePred"
    date: "2026-02"
    venue: "arXiv"
    section: "2.2"
    env: [desktop]
    summary: >-
      Identifies a blind spot shared by most CUA guardrails: they are reactive and constrain
      behavior only within the current observation space, which catches immediate hazards like
      clicking a phishing link but cannot see long-horizon risk. The paper's example is sharp —
      clearing logs looks locally reasonable yet renders future audits untraceable, a
      consequence that simply is not visible in the present observation. SafePred instead
      aligns predicted future risk with the current decision, establishing a risk-to-decision
      loop so that delayed, irreversible consequences are priced into each step.
    summary_zh: >-
      指出现有 CUA 护栏的共同盲区：它们都是被动式的，只在当前观测空间内约束行为，因此能拦下
      「点击钓鱼链接」这类即时危害，却看不见长周期风险。文中的例子很到位——清理日志在局部看
      完全合理，但会导致未来审计无从追溯，而这个后果在当前观测里根本不可见。SafePred 转而把
      预测出的未来风险与当前决策对齐，建立「风险到决策」的闭环，使延迟发生、不可逆的后果能被
      计入每一步的判断。

  - id: "2603.14707"
    title: "Visual Confused Deputy: Exploiting and Defending Perception Failures in Computer-Using Agents"
    abbr: "Visual Confused Deputy"
    date: "2026-03"
    venue: "arXiv"
    section: "1.2"
    env: [desktop]
    summary: >-
      Reframes CUA perception failures as a security problem rather than a performance
      limitation: prior work asks whether an action succeeded, not whether the agent acted on
      the correct object at all. The paper formalizes the visual confused deputy — an agent
      authorizing an action based on a misperceived screen state, whether from grounding error,
      adversarial screenshot manipulation, or a TOCTOU race. Crucially, simple screen-level
      manipulations can redirect routine clicks into privileged actions while looking
      indistinguishable from ordinary agent mistakes, making the attack deniable. The proposed
      guardrail is the first to operate outside the agent's own perceptual loop, using
      dual-channel contrastive classification to evaluate the click target independently.
    summary_zh: >-
      把 CUA 的感知失败从「性能局限」重新定义为安全问题：以往工作只问动作是否成功，不问
      agent 作用的对象是否正确。论文形式化了「视觉混淆代理」这一失效模式——agent 基于误判的
      屏幕状态授权动作，成因可以是 grounding 错误、对抗性截图篡改或 TOCTOU 竞态。关键之处
      在于，简单的屏幕层篡改就能把常规点击重定向为特权操作，而表现上与普通 agent 失误无法
      区分，使攻击具备可否认性。提出的护栏是首个运行在 agent 感知回路之外的方案，用双通道
      对比分类独立校验点击目标。

  - id: "2603.00476"
    title: "Atomicity for Agents: Exposing, Exploiting, and Mitigating TOCTOU Vulnerabilities in Browser-Use Agents"
    abbr: "Atomicity for Agents"
    date: "2026-02"
    venue: "arXiv"
    section: "1.4"
    env: [web]
    summary: >-
      Frames the gap between an agent's planning and execution as a classic TOCTOU
      vulnerability: web pages routinely change in between, so actions fire against stale
      assumptions, and dynamic or adversarial content can deliberately widen that window. The
      paper contributes a large-scale empirical study over a benchmark of synthesized and real
      websites, evaluating 10 popular open-source agents and finding TOCTOU exposure to be
      widespread rather than incidental. The proposed mitigation is deliberately lightweight —
      monitor DOM and layout changes during planning, then validate page state immediately
      before the action executes.
    summary_zh: >-
      把 agent 规划与执行之间的时间差刻画为经典的 TOCTOU 漏洞：网页在两者之间经常发生变化，
      导致动作基于过期假设执行，而动态或对抗性内容可以刻意拉大这个窗口。论文在覆盖合成与真实
      网站的基准上做了大规模实证，评测 10 个主流开源 agent，发现 TOCTOU 暴露是普遍现象而非
      个例。提出的缓解方案刻意保持轻量——在规划阶段监控 DOM 与布局变化，并在动作真正执行前
      立即校验页面状态。

  - id: "2605.15030"
    title: "WARD: Adversarially Robust Defense of Web Agents Against Prompt Injections"
    abbr: "WARD"
    date: "2026-05"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Catalogues four practical failure modes of existing guard models for web agents: weak
      generalization to unseen domains and attack patterns, high false positives on benign
      content, per-step latency that degrades deployment, and vulnerability to attacks that
      target the guard itself. WARD is built on WARD-Base, a 177K-sample dataset drawn from 719
      high-traffic URLs and platforms, plus WARD-PIG, a dataset purpose-built for injections
      aimed at the guard. It further introduces A3T, an adaptive adversarial training
      framework, addressing the often-ignored point that a guard model is itself an attack
      surface.
    summary_zh: >-
      系统列出现有 web agent 护栏模型的四类实际失效：对未见域与新攻击模式泛化差、在正常内容上
      误报率高、每步推理带来的延迟拖累部署、以及自身会成为攻击目标。WARD 基于 WARD-Base
      构建——取自 719 个高流量 URL 与平台的约 17.7 万样本，另有专门针对「攻击护栏本身」的
      WARD-PIG 数据集。并提出自适应对抗训练框架 A3T，正面回应了一个常被忽略的问题：护栏模型
      本身也是一个攻击面。

  - id: "2604.12284"
    title: "WebAgentGuard: A Reasoning-Driven Guard Model for Detecting Prompt Injection Attacks in Web Agents"
    abbr: "WebAgentGuard"
    date: "2026-04"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Notes that both system-prompt defenses and direct fine-tuning of the agent have shown
      limited effectiveness against injections embedded in HTML or rendered screenshots. The
      architectural choice is to run a dedicated guard agent in parallel with the web agent,
      decoupling injection detection from the agent's own reasoning so that a compromised
      reasoning chain does not also compromise detection. WebAgentGuard is a reasoning-driven
      multimodal guard trained on a synthetic dataset spanning 164 topics and 230 distinct
      visual and UI design styles, targeting the generalization gap that narrow training sets
      leave open.
    summary_zh: >-
      指出无论是 system prompt 防御还是直接微调 agent，对嵌在 HTML 或渲染截图中的注入效果
      都有限。架构上的选择是让一个专职护栏 agent 与 web agent 并行运行，把注入检测与 agent
      自身的推理解耦——这样推理链被污染时不会连带污染检测能力。WebAgentGuard 是推理驱动的
      多模态护栏模型，训练数据覆盖 164 个主题与 230 种视觉/UI 设计风格，针对的正是训练集
      过窄留下的泛化缺口。

  - id: "2604.25562"
    title: "SnapGuard: Lightweight Prompt Injection Detection for Screenshot-Based Web Agents"
    abbr: "SnapGuard"
    date: "2026-04"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Targets a specific blind spot: screenshot-based web agents operate on rendered visuals
      rather than structured text, so the dominant text-centric defenses simply do not apply.
      Existing multimodal detectors do work but lean on large VLMs, and the paper locates the
      bottleneck precisely — the VLM must comprehend the global semantics of an entire modern
      webpage, driving up both inference time and GPU memory. SnapGuard starts instead from the
      observation that injected pages carry distinctive local characteristics, enabling
      detection without whole-page semantic understanding.
    summary_zh: >-
      针对一个具体盲区：基于截图的 web agent 处理的是渲染后的视觉画面而非结构化文本，因此
      主流的文本中心防御根本用不上。已有的多模态检测方法确实有效，但依赖大型 VLM，而论文精确
      定位了瓶颈——VLM 必须理解整个现代网页的全局语义，推理时间与显存开销都被推高。SnapGuard
      转而从「被注入的页面具有独特局部特征」这一观察出发，无需理解整页语义即可完成检测。

  - id: "2602.03792"
    title: "WebSentinel: Detecting and Localizing Prompt Injection Attacks for Web Agents"
    abbr: "WebSentinel"
    date: "2026-02"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Observes that existing detection and localization methods underperform in the web-agent
      setting because their underlying assumptions do not hold there. WebSentinel is a two-step
      approach: Step I extracts segments of interest that may be contaminated, Step II scores
      each segment by checking its consistency against the surrounding webpage content as
      context. Beyond a binary verdict it localizes the injected span, which matters
      operationally — knowing which element was poisoned enables surgical removal instead of
      discarding the whole page.
    summary_zh: >-
      观察到现有检测与定位方法在 web agent 场景下效果有限，因为其赖以成立的假设在这里不成立。
      WebSentinel 采用两步法：第一步抽取可能被污染的「关注片段」，第二步以页面其余内容为上下文
      检查每个片段的一致性。它不只给出二分类判断，还能定位被注入的具体片段——这在工程上很关键，
      知道哪个元素被污染就能做精确剔除，而不必丢弃整个页面。

  - id: "2512.12594"
    title: "ceLLMate: Sandboxing Browser AI Agents"
    abbr: "ceLLMate"
    date: "2025-12"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Approaches injection containment by restricting the agent's ambient authority to shrink
      the blast radius, rather than trying to detect every malicious instruction. The key
      insight addresses what the authors call the semantic gap: writing and enforcing security
      policies over low-level UI primitives like clicks and keystrokes is brittle and
      error-prone, so ceLLMate instead sandboxes at the HTTP layer, on the grounds that every
      side-effecting UI operation ultimately produces network traffic to the site's backend.
      This yields a policy surface that is both stable and semantically meaningful, shipped as
      an agent-agnostic browser extension.
    summary_zh: >-
      不试图检测每一条恶意指令，而是通过限制 agent 的环境权限来压缩爆炸半径。核心洞察针对作者
      所称的「语义鸿沟」：在点击、按键这类低层 UI 原语上编写和强制安全策略既脆弱又易错，因此
      ceLLMate 选择在 HTTP 层做沙箱——依据是任何产生副作用的 UI 操作最终都会向网站后端发出
      网络请求。这使策略面同时具备稳定性与语义可读性，实现形态是与 agent 无关的浏览器扩展。

  - id: "2509.07764"
    title: "AgentSentinel: An End-to-End and Real-Time Security Defense Framework for Computer-Use Agents"
    abbr: "AgentSentinel"
    date: "2025-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Distinguishes the threat model from conventional prompt security: the danger here is not
      only an insecure user prompt but tool commands generated by the agent's own unstable LLM
      decisions, a class of vulnerability spanning every component of a computer-use agent.
      AgentSentinel intercepts all sensitive operations inside agent-related services and
      halts execution pending a security audit, so the enforcement point sits at the service
      boundary rather than in the prompt. Its auditing mechanism correlates evidence across the
      agent's components instead of judging each call in isolation.
    summary_zh: >-
      把威胁模型与传统的 prompt 安全区分开：这里的危险不只来自不安全的用户输入，还来自 agent
      自身不稳定的 LLM 决策所生成的工具调用，而这类漏洞横跨 computer-use agent 的每个组件。
      AgentSentinel 拦截 agent 相关服务内的所有敏感操作并暂停执行，直到安全审计完成——也就是
      把强制点放在服务边界而非 prompt 层。其审计机制会跨组件关联证据，而不是孤立地判断每次调用。

  - id: "2508.04010"
    title: "HarmonyGuard: Toward Safety and Utility in Web Agents via Adaptive Policy Enhancement and Dual-Objective Optimization"
    abbr: "HarmonyGuard"
    date: "2025-08"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Frames the core tension as balancing task performance against evolving hidden web threats
      over long action sequences, and notes that prior work is confined to single-objective
      optimization or single-turn settings. HarmonyGuard is a multi-agent framework whose
      Policy Agent automatically extracts and maintains structured security policies from
      unstructured external documents and keeps updating them, addressing the practical problem
      that hand-written policies go stale. The dual-objective optimization jointly targets
      safety and utility rather than trading one for the other.
    summary_zh: >-
      把核心矛盾表述为在长动作序列中平衡任务性能与不断演化的网页隐藏威胁，并指出以往工作局限于
      单目标优化或单轮场景。HarmonyGuard 是多 agent 框架，其中 Policy Agent 能从非结构化的
      外部文档中自动抽取并维护结构化安全策略、持续更新，回应的是「手写策略会过期」这一现实
      问题。双目标优化同时兼顾安全与效用，而非牺牲其一换取其二。

  - id: "2606.12666"
    title: "CAPED: Context-Aware Privacy Exposure Defense for Mobile GUI Agents"
    abbr: "CAPED"
    date: "2026-06"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Names a problem specific to the screenshot paradigm: because the agent sees the phone
      exactly as a human does, every screen observation becomes a privacy boundary, and routine
      task execution can expose contacts, messages, photos, health cues and other context
      entirely unrelated to the request. The authors call this incidental visual privacy
      exposure and explain why both extremes fail — text anonymization misses visual and
      inferential cues, while generic masking removes the very evidence and controls the agent
      needs to finish the task. CAPED is a phone-side pre-upload control layer that parses
      visible UI elements and masks selectively, using task requirements and screen context as
      a privacy prior.
    summary_zh: >-
      指出一个截图范式特有的问题：由于 agent 以与人完全相同的方式「看」手机，每一次屏幕观测都
      变成一道隐私边界，正常执行任务时就可能暴露联系人、消息、照片、健康线索等与请求毫无关系的
      上下文。作者称之为「附带性视觉隐私暴露」，并说明两个极端为何都行不通——文本匿名化会漏掉
      视觉与可推断线索，而通用遮蔽又会把 agent 完成任务所需的证据和控件一起抹掉。CAPED 是运行
      在手机侧的上传前控制层，解析可见 UI 元素并选择性遮蔽，以任务需求和屏幕上下文作为隐私先验。

  - id: "2606.15034"
    title: "OSGuard: A Benchmark for Safety in Computer-Use Agents"
    abbr: "OSGuard"
    date: "2026-06"
    venue: "arXiv"
    section: "3.1"
    env: [desktop, web]
    summary: >-
      Attacks a measurement blind spot: computer-use agents are judged by task completion, yet
      success alone hides failures where the agent hit the nominal goal via an unsafe shortcut.
      OSGuard evaluates safety under benign, unchanged user instructions — no attacker in the
      loop — with two granularities. The action-level benchmark labels contextualized proposed
      actions as allowed, unrelated, or unsafe, each judged against the original instruction and
      current interface state. The execution suite uses hand-built OSWorld-derived variants
      where the task stays achievable but the environment carries latent hazards such as
      destructive overwrites, paired with evaluators that retain the original success signal.
    summary_zh: >-
      针对一个测量盲区：computer-use agent 通常只以任务完成率评判，但「成功」会掩盖 agent 通过
      不安全捷径达成名义目标的情况。OSGuard 在**良性、未被篡改**的用户指令下评估安全性——回路中
      没有攻击者——并设计了两个粒度。动作级基准把语境化的候选动作标注为「允许 / 无关 / 不安全」，
      每条都相对原始指令与当前界面状态判定。执行套件基于人工构造的 OSWorld 变体，原任务仍可完成，
      但环境中埋入了破坏性覆写等潜在危害，并配套保留原成功信号的增强评测器。

  - id: "2601.18842"
    title: "GUIGuard-Bench: Toward a General Evaluation for Privacy-Preserving GUI Agents"
    abbr: "GUIGuard-Bench"
    date: "2026-01"
    venue: "arXiv"
    section: "3.1"
    env: [mobile, desktop]
    summary: >-
      Argues that existing visual privacy datasets are largely static natural images and
      therefore cannot capture two properties that define privacy risk in GUI workflows:
      context dependence and task relevance. GUIGuard-Bench supplies 241 real GUI-agent
      trajectories with 4,080 screenshots across Android and PC. The annotation design is the
      contribution — each screenshot is labeled at region level with privacy bounding boxes,
      semantic categories, risk levels, and critically whether that private information is
      actually needed to complete the task, which is exactly the distinction a masking defense
      must get right.
    summary_zh: >-
      指出现有视觉隐私数据集多为静态自然图像，因而无法刻画 GUI 工作流中界定隐私风险的两个性质：
      上下文依赖与任务相关性。GUIGuard-Bench 提供 241 条真实 GUI agent 轨迹、涵盖 Android 与
      PC 环境的 4080 张截图。真正的贡献在标注设计——每张截图在区域级标注隐私边界框、语义类别、
      风险等级，以及关键的一项：该隐私信息是否为完成任务所必需。而这恰恰是遮蔽类防御必须判断
      正确的那个区分。

  - id: "2510.01354"
    title: "WAInjectBench: Benchmarking Prompt Injection Detections for Web Agents"
    abbr: "WAInjectBench"
    date: "2025-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Fills a systematic gap: many injection attacks target web agents and many general-purpose
      detectors exist, but none had been evaluated specifically in the web-agent setting.
      WAInjectBench first categorizes attacks by threat model, then builds datasets covering
      both modalities and both polarities — malicious text segments from different attacks,
      benign text from four categories, attack-produced malicious images, and benign images
      from two categories. The headline finding is a sharp boundary: detectors handle attacks
      carrying explicit textual instructions or visible image perturbations, but degrade
      sharply outside that regime.
    summary_zh: >-
      填补一个系统性空缺：针对 web agent 的注入攻击很多，通用注入检测方法也很多，但从未有人
      在 web agent 场景下系统评测过后者。WAInjectBench 先按威胁模型对攻击做细粒度分类，再构建
      覆盖两种模态、两种极性的数据集——来自不同攻击的恶意文本片段、四类正常文本、攻击生成的
      恶意图像、两类正常图像。核心结论划出了一条清晰边界：检测器能应对带显式文本指令或可见图像
      扰动的攻击，一旦越出这个范围性能急剧下降。

  - id: "2506.13205"
    title: "Poison Once, Control Anywhere: Clean-Text Visual Backdoors in VLM-based Mobile Agents"
    abbr: "VIBMA"
    date: "2025-06"
    venue: "arXiv"
    section: "1.6"
    env: [mobile]
    summary: >-
      Exploits a structural weakness in how mobile agents are built: they are typically
      fine-tuned on small, user-collected datasets, which makes training-time poisoning
      practical rather than theoretical. VIBMA is the first clean-text backdoor for VLM-based
      mobile agents — it modifies only the visual input while leaving prompts and instructions
      untouched, so there is no textual anomaly to detect. After fine-tuning on poisoned data,
      inserting a predefined visual trigger at inference activates the attacker's behavior. The
      mechanism aligns poisoned samples' training gradients with those of an attacker-specified
      target instance, embedding backdoor features into the data itself.
    summary_zh: >-
      利用移动 agent 构建方式上的结构性弱点：它们通常在小规模、用户自行收集的数据上微调，使
      训练期投毒从理论威胁变成现实可行。VIBMA 是首个针对 VLM 移动 agent 的**纯净文本**后门——
      只修改视觉输入，prompt 与指令完全保持原样，因此没有任何文本异常可供检测。模型在投毒数据上
      微调后，推理时加入预设的视觉触发图案即激活攻击者指定行为。其机制是把投毒样本的训练梯度与
      攻击者指定目标实例的梯度对齐，从而把后门特征嵌进数据本身。

  - id: "2511.13248"
    title: "DualTAP: A Dual-Task Adversarial Protector for Mobile MLLM Agents"
    abbr: "DualTAP"
    date: "2025-11"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Locates the privacy leak at a concrete architectural point: screenshots containing PII are
      routinely sent to untrusted third-party routers, which can mine that data with their own
      MLLMs. The scenario imposes conflicting requirements that prior perturbation methods fail
      to satisfy jointly — hide PII from the router's model while preserving enough signal for
      the agent's model to finish the task. DualTAP explicitly decouples the two objectives via
      a contrastive attention module that targets only PII-sensitive regions and a dual-task
      adversarial objective balancing task-preservation loss against privacy interference.
    summary_zh: >-
      把隐私泄露定位到一个具体的架构环节：含 PII 的截图会被例行发送给不受信的第三方路由服务，
      而这些服务可以用自己的 MLLM 挖掘其中数据。该场景提出了此前扰动类方法无法同时满足的矛盾
      要求——既要让路由方的模型看不到 PII，又要保留足够信息让 agent 的模型完成任务。DualTAP
      显式解耦这两个目标：用对比注意力模块精确定位仅 PII 敏感区域，并以双任务对抗目标在任务
      保持损失与隐私干扰之间取得平衡。

  - id: "2507.10610"
    title: "LaSM: Layer-wise Scaling Mechanism for Defending Pop-up Attack on GUI Agents"
    abbr: "LaSM"
    date: "2025-07"
    venue: "arXiv"
    section: "2.6"
    env: [desktop, web]
    summary: >-
      Notes that existing defenses against pop-up environmental injection either require costly
      retraining or collapse under inductive interference, then takes a mechanistic route
      instead. The paper systematically studies how such attacks alter a GUI agent's attention
      and uncovers a layer-wise attention divergence pattern separating correct from incorrect
      outputs. LaSM exploits this directly by selectively amplifying attention and MLP modules
      in the critical layers, realigning model saliency with task-relevant screen regions
      without any additional training — a rare instance of interpretability findings converted
      into a deployable GUI-agent defense.
    summary_zh: >-
      指出针对弹窗式环境注入的现有防御要么需要昂贵重训、要么在归纳性干扰下失效，转而走机制
      可解释性路线。论文系统研究这类攻击如何改变 GUI agent 的注意力分布，发现正确输出与错误输出
      之间存在**逐层的注意力发散模式**。LaSM 直接利用这一发现，选择性放大关键层的注意力与 MLP
      模块，无需任何额外训练即把模型显著性重新对齐到任务相关的屏幕区域——这是把可解释性结论
      转化为可部署 GUI agent 防御的少见案例。

  - id: "2605.08310"
    title: "WebTrap: Stealthy Mid-Task Hijacking of Browser Agents During Navigation"
    abbr: "WebTrap"
    date: "2026-05"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      Diagnoses two gaps in existing injections against browser agents: low effectiveness,
      because attacks tuned on toy baselines fail to reach end-to-end goals in real environments
      with long step counts; and weak stealth, because most attacks pit the attack goal against
      the user goal, so usability visibly collapses and the attack announces itself. WebTrap
      instead hijacks mid-task via multi-step instruction fusion steering that merges both
      goals, letting the agent resume the user's original task after serving the attacker. A
      context-grounded generation method aligns injected content with the surrounding task
      environment, so nothing looks out of place.
    summary_zh: >-
      诊断出现有针对浏览器 agent 的注入攻击有两个缺口：一是有效性低，在玩具基准上调优的攻击
      放到真实环境、长步骤链条中就达不成端到端目标；二是隐蔽性弱，多数攻击把攻击目标与用户目标
      对立起来，导致可用性明显崩塌，攻击相当于自我暴露。WebTrap 转而在**任务中途**劫持：用多步
      指令融合引导把两个目标缝合起来，让 agent 在完成攻击目标后继续把用户原任务做完。配套的
      上下文接地生成方法使注入内容与所处任务环境保持一致，看不出突兀。

  - id: "2606.10742"
    title: "MemVenom: Triggered Poisoning of Multimodal Memories in Web Agents"
    abbr: "MemVenom"
    date: "2026-06"
    venue: "arXiv"
    section: "1.6"
    env: [web]
    summary: >-
      Targets external memory, now a core component of web agents for long-horizon reasoning,
      and points out the structural consequence: content injected into memory is persistently
      recalled and repeatedly steers behavior, so one successful poisoning outlasts the session.
      MemVenom is a black-box framework poisoning graph-structured memory with coordinated
      text-image evidence in two stages — a trigger-conditioned retrieval attack ensuring the
      malicious entry is recalled with high probability, then post-retrieval induction using
      adversarial perturbation and stealthy OCR injection to override the user's objective.
      Unlike prompt-level or text-only memory attacks, the result is persistent and reusable.
    summary_zh: >-
      针对外部记忆——它已是现代 web agent 支撑长周期推理的核心组件——并指出其结构性后果：注入
      记忆的内容会被持续召回、反复影响行为，因此一次成功投毒的影响能跨越会话存活。MemVenom 是
      黑盒框架，用协同的图文证据污染图结构外部记忆，分两阶段：先以触发条件化的检索攻击确保恶意
      记忆被高概率召回，再通过对抗扰动与隐蔽 OCR 注入在检索后诱导 agent 覆盖用户原目标。与
      prompt 层或纯文本记忆攻击不同，其效果是持久且可复用的。

  - id: "2512.22894"
    title: "DECEPTICON: How Dark Patterns Manipulate Web Agents"
    abbr: "DECEPTICON"
    date: "2025-12"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Studies dark patterns — deceptive UI designs already pervasive on the real web — as an
      agent security threat requiring no attacker infrastructure at all, since the malicious
      interface is simply the status quo. DECEPTICON isolates individual dark patterns across
      700 web navigation tasks (600 generated, 100 real-world). Dark patterns steer agents to
      malicious outcomes in over 70% of tasks versus a 31% human average. The most consequential
      finding inverts the usual scaling assumption: effectiveness correlates positively with
      model size and test-time reasoning, so larger and more capable agents are more
      susceptible, not less.
    summary_zh: >-
      把暗黑模式（dark patterns，即真实网络上早已泛滥的欺骗性 UI 设计）作为一类 agent 安全威胁
      来研究——它不需要攻击者搭建任何基础设施，因为恶意界面本身就是现状。DECEPTICON 在 700 个
      网页导航任务（600 合成 + 100 真实）中隔离测试单个暗黑模式。结果是暗黑模式在超过 70% 的
      任务中成功把 agent 引向恶意结果，而人类平均只有 31%。最值得警惕的发现颠覆了通常的
      scaling 直觉：操纵有效性与模型规模、测试时推理量**正相关**——越大越强的 agent 反而更易受骗。

  - id: "2511.20597"
    title: "BrowseSafe: Understanding and Preventing Prompt Injection Within AI Browser Agents"
    abbr: "BrowseSafe"
    date: "2025-11"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Argues that integrating agents into browsers creates security problems beyond traditional
      web application threat models, and that while prompt injection is a known vector, its
      real-world impact remains under-measured. The benchmark's design choices are the
      contribution: it emphasizes injections that influence real-world *actions* rather than
      just text output, and constructs payloads with complexity and distractor density
      comparable to what deployed agents actually meet. It then evaluates existing defenses
      across frontier models and proposes a multi-layered strategy combining architectural and
      model-based defenses.
    summary_zh: >-
      指出把 agent 集成进浏览器所带来的安全问题已超出传统 Web 应用威胁模型，而尽管提示注入是
      已知攻击向量，其真实世界影响仍缺乏充分测量。该基准的贡献在于设计取向：强调那些能影响真实
      **动作**（而非仅文本输出）的注入，并构造在复杂度与干扰项密度上贴近实际部署 agent 所遭遇
      情形的载荷。在此基础上横向评测现有防御在多个前沿模型上的表现，并提出结合架构级与模型级
      防御的多层策略。

  - id: "2605.28116"
    title: "MIRAGE: Context-Aware Prompt Injection against Mobile GUI Agents via User-Generated Content"
    abbr: "MIRAGE (Mobile)"
    date: "2026-05"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Roots the vulnerability in the perception paradigm: mobile GUI agents see the screen as
      rendered pixels and choose actions from what they see, so they cannot reliably tell
      trusted interface chrome from user-generated content. MIRAGE turns benign screenshots into
      injection samples by planting attacker text into ordinary UGC regions — no modification to
      the agent, the app, or the OS. The three-stage pipeline has a Localizer find
      user-controllable regions, a Generator synthesize context-aware payloads rendered in the
      app's native style, and a Curator enforce realism while balancing samples across apps,
      region types, and attack intents.
    summary_zh: >-
      把漏洞根源归到感知范式本身：移动 GUI agent 把屏幕当作渲染后的像素来看，并据所见选择动作，
      因此无法可靠区分可信的界面框架与用户生成内容。MIRAGE 把正常截图转化为注入样本——将攻击者
      文本放进普通 UGC 区域，**无需修改 agent、应用或操作系统**。三阶段流水线：Localizer 定位
      用户可控区域，Generator 合成上下文感知载荷并以应用原生样式渲染，Curator 把控真实性并在
      应用、区域类型与攻击意图之间平衡样本分布。

  - id: "2604.10577"
    title: "The Blind Spot of Agent Safety: How Benign User Instructions Expose Critical Vulnerabilities in Computer-Use Agents"
    abbr: "OS-BLIND"
    date: "2026-04"
    venue: "arXiv"
    section: "1.7"
    env: [desktop]
    summary: >-
      Isolates the setting existing safety evaluations skip: user instructions are entirely
      benign and harm emerges from task context or execution outcome, with no misuse and no
      injection. OS-BLIND supplies 300 human-crafted tasks over 12 categories and 8
      applications, split into environment-embedded threats and agent-initiated harms. The
      numbers are stark — most CUAs exceed 90% attack success rate, and safety-aligned Claude
      4.5 Sonnet still hits 73.0%. Worse, deploying that same model in a multi-agent
      configuration pushes its ASR from 73.0% to 92.7%, suggesting orchestration itself erodes
      alignment.
    summary_zh: >-
      隔离出现有安全评测跳过的那个场景：用户指令完全良性，危害来自任务上下文或执行后果，既无
      滥用也无注入。OS-BLIND 提供 300 个人工构造任务，覆盖 12 个类别、8 个应用，分为「环境
      嵌入型威胁」与「agent 自发危害」两簇。数字相当刺眼——多数 CUA 的攻击成功率超过 90%，
      即便经过安全对齐的 Claude 4.5 Sonnet 也达到 73.0%。更糟的是，同一模型置于多 agent
      配置中时 ASR 从 73.0% 升至 92.7%，说明编排本身就在侵蚀对齐效果。

  - id: "2604.06367"
    title: "WebSP-Eval: Evaluating Web Agents on Website Security and Privacy Tasks"
    abbr: "WebSP-Eval"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Opens a direction orthogonal to the rest of this list: existing benchmarks measure either
      general capability (WebArena) or resistance to malicious actions (SafeArena), but none ask
      whether an agent can competently *perform* the security and privacy chores users actually
      delegate — managing cookie preferences, configuring privacy-sensitive account settings,
      revoking inactive sessions. WebSP-Eval contributes 200 hand-built task instances across 28
      websites, an agentic harness that manages accounts and initial state across runs via a
      custom Chrome extension, and an automated evaluator, applied to 8 web agent
      instantiations.
    summary_zh: >-
      开辟了一个与本清单其余部分正交的方向：现有基准要么测通用能力（WebArena），要么测抵御恶意
      动作的能力（SafeArena），但没有一个去问 agent 能否胜任用户真正会委托给它的安全与隐私
      事务——管理 cookie 偏好、配置隐私敏感的账户设置、吊销闲置会话。WebSP-Eval 贡献了跨 28 个
      网站的 200 个人工构造任务实例、一套通过自定义 Chrome 扩展在多次运行间管理账号与初始状态的
      agent 框架、以及自动评测器，并在 8 种 web agent 实例化配置上做了评估。

  - id: "2603.28551"
    title: "\"What Did It Actually Do?\": Understanding Risk Awareness and Traceability for Computer-Use Agents"
    abbr: "What Did It Actually Do"
    date: "2026-03"
    venue: "arXiv"
    section: "2.5"
    env: [desktop]
    summary: >-
      Studies the human side of CUA risk as personalized agents move from expert circles into
      mainstream use: these systems install skills, invoke tools, reach private resources and
      modify local environments, yet users typically do not know what authority they delegated,
      what the agent actually did, or whether it was cleanly removed afterward. The work pairs a
      multi-source corpus of the OpenClaw ecosystem — incidents, advisories, malicious-skill
      reports, news, tutorials, social narratives — with an interview study of users and
      practitioners. Participants recognized these systems as risky in the abstract but lacked
      concrete mental models of privilege and persistence.
    summary_zh: >-
      在个人化 agent 从专家圈走向大众使用的背景下研究 CUA 风险的人因侧：这类系统会安装 skill、
      调用工具、访问私有资源、修改本地环境，但用户通常并不清楚自己授予了什么权限、agent 实际
      做了什么、以及事后是否被干净卸载。工作把 OpenClaw 生态的多来源语料（安全事件、公告、恶意
      skill 报告、新闻报道、教程、社交媒体叙述）与面向用户和从业者的访谈研究结合起来。发现是：
      受访者在抽象层面认得出这类系统有风险，却缺乏关于权限与持久化的具体心智模型。

  - id: "2606.13686"
    title: "Benchmarking Web Agent Safety under E-commerce Deceptive Interfaces"
    abbr: "WebDecept"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Examines web agent behavior under realistic deceptive interfaces in e-commerce, where a
      wrong click carries direct financial consequence. WebDecept is a lightweight configurable
      plugin framework injecting deceptive interface patterns into existing web environments, and
      instantiates seven patterns commonly seen in the wild including targeted advertisements,
      domain redirection and shopping manipulation. Injecting them into the frontend during live
      task execution gives controlled evaluation across multiple multimodal agents. Two findings
      matter: agents are highly susceptible across several pattern classes, and prompt-based
      constraints are frequently insufficient as mitigation.
    summary_zh: >-
      在电商场景下考察 web agent 面对真实欺骗性界面时的行为——这个场景里点错一下就有直接的财务
      后果。WebDecept 是轻量可配置的插件框架，能把欺骗性界面模式注入既有网页环境，并实例化了
      七种野外常见模式，含定向广告、域名重定向、购物操纵等。在任务执行过程中把它们注入前端，
      即可对多个多模态 agent 做受控评测。两个结论值得注意：agent 对多类模式都高度易感；而基于
      prompt 的约束往往不足以缓解这类失败。

  - id: "2604.13531"
    title: "RiskWebWorld: A Realistic Interactive Benchmark for GUI Agents in E-commerce Risk Management"
    abbr: "RiskWebWorld"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Notes that existing interactive benchmarks target benign, predictable consumer
      environments, leaving high-stakes investigative domains unexamined. RiskWebWorld draws
      1,513 tasks from production risk-control pipelines across 8 core domains and deliberately
      preserves the authentic difficulties of risk operations — uncooperative websites and
      partial environmental hijacking. A Gymnasium-compliant infrastructure decouples policy
      planning from environment mechanics to support agentic RL. The evaluation exposes a stark
      capability gap: top-tier generalist models reach only 49.1% success, indicating that
      adversarial real-world operational settings remain far from solved.
    summary_zh: >-
      指出现有交互式基准都瞄准良性、可预测的消费者环境，把高风险的调查类场景留在了视野之外。
      RiskWebWorld 从生产环境的风控流水线中取 1513 个任务、覆盖 8 个核心领域，并刻意保留风控
      作业的真实困难——不配合的网站、部分环境劫持。配套的 Gymnasium 兼容基础设施把策略规划与
      环境机制解耦，以支持 agentic RL。评测暴露出明显的能力落差：顶级通用模型成功率仅 49.1%，
      说明对抗性的真实作业场景远未被解决。

  - id: "2601.18113"
    title: "MalURLBench: A Benchmark Evaluating Agents' Vulnerabilities When Processing Web URLs"
    abbr: "MalURLBench"
    date: "2026-01"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Isolates a narrow but consequential failure: accepting a disguised malicious URL lets an
      agent proceed into unsafe webpages, and everything downstream inherits that compromise, yet
      no benchmark had targeted this step. MalURLBench provides 61,845 attack instances spanning
      10 real-world scenarios and 7 categories of genuinely malicious websites. Across 12 popular
      LLMs, models struggle with elaborately disguised URLs. The paper further analyzes which
      factors drive attack success and ships URLGuard, a lightweight defense module for the same
      choke point.
    summary_zh: >-
      隔离出一个范围很窄但后果严重的失效环节：接受一个伪装过的恶意 URL 就会让 agent 进入不安全
      网页，此后所有下游行为都继承了这次沦陷，而此前没有基准针对这一步。MalURLBench 提供 61845
      个攻击实例，覆盖 10 类真实场景与 7 类真实恶意网站。在 12 个主流 LLM 上的实验显示，模型
      难以识别精心伪装的恶意 URL。论文进一步分析影响攻击成功率的关键因素，并给出轻量防御模块
      URLGuard，作用在同一咽喉点上。

  - id: "2605.09497"
    title: "Don't Click That: Teaching Web Agents to Resist Deceptive Interfaces"
    abbr: "DUDE"
    date: "2026-05"
    venue: "arXiv"
    section: "2.2"
    env: [web]
    summary: >-
      Identifies a split in prior work: some approaches detect deception without integrating it
      into the task loop, others document attacks without proposing any defense. The paper
      formalizes deception-aware web agent defense and proposes DUDE, a two-stage framework
      combining hybrid-reward learning with asymmetric penalties and experience summarization
      that distills failure patterns into transferable guidance. It ships RUC (Real UI
      Clickboxes), a benchmark of 1,407 scenarios across four domains and deception categories.
      DUDE cuts deception susceptibility by 53.8% while holding task performance, which matters
      because most safety interventions trade utility away.
    summary_zh: >-
      指出以往工作的割裂之处：一类方法能检测欺骗但不与任务回路结合，另一类记录了攻击却不提出
      防御。论文形式化了「欺骗感知的 web agent 防御」，提出两阶段框架 DUDE，把带非对称惩罚的
      混合奖励学习与经验总结结合起来，将失败模式蒸馏为可迁移的指导。配套发布基准 RUC（Real UI
      Clickboxes），含跨四个领域与欺骗类别的 1407 个场景。DUDE 在保持任务性能的同时把易受骗
      程度降低 53.8%——这一点很关键，因为多数安全干预都是以牺牲效用为代价。

  - id: "2606.01166"
    title: "BraveGuard: From Open-World Threats to Safer Computer-Use Agents"
    abbr: "BraveGuard"
    date: "2026-05"
    venue: "arXiv"
    section: "2.3"
    env: [desktop, web]
    summary: >-
      Starts from why CUA harm is hard to catch: it emerges only through multi-step execution
      traces whose individual actions look locally benign, so neither isolated prompts nor final
      responses reveal it. BraveGuard is a self-evolving pipeline that mines recent research
      sources for emerging risks and attack patterns, instantiates them as executable
      computer-use tasks, collects agent rollouts, and derives trajectory-level supervision for
      training guard models. Because the loop can be re-run as new threats and validation
      failures appear, the defense adapts rather than freezing at whatever a static benchmark
      captured at training time.
    summary_zh: >-
      从「CUA 的危害为何难以捕捉」出发：危害只在多步执行轨迹中浮现，而其中每个单独动作在局部看
      都无害，因此孤立的 prompt 与最终回复都看不出问题。BraveGuard 是自我演进的流水线：从近期
      研究来源中挖掘新兴风险与攻击模式，将其实例化为可执行的 computer-use 任务，收集 agent
      rollout，进而导出**轨迹级**监督信号训练护栏模型。由于新威胁与验证失败出现时可以重跑这个
      闭环，防御能持续适应，而不是冻结在静态基准训练时所捕捉到的那个快照上。

  - id: "2607.05120"
    title: "Agent Data Injection Attacks are Realistic Threats to AI Agents"
    abbr: "ADI"
    date: "2026-07"
    venue: "arXiv"
    section: "1.1"
    env: [web, desktop]
    summary: >-
      Points out that indirect prompt injection research has concentrated almost entirely on
      instruction injection — untrusted data interpreted as an instruction — and that the
      mitigations built in response inherit that narrow framing. The paper introduces agent data
      injection: malicious data disguised as *trusted* data, such as security-critical metadata
      (resource identifiers, data origins) or agent context data (tool call and response
      formats). The impact matches instruction injection, since agents still execute unintended
      actions, but defenses tuned to spot embedded instructions have no reason to flag
      well-formed metadata.
    summary_zh: >-
      指出间接提示注入的研究几乎全部集中在「指令注入」上——即不可信数据被当作指令解释——而针对
      性构建的缓解措施也继承了这个狭窄的问题框架。论文提出 agent 数据注入（ADI）：把恶意数据
      伪装成**可信数据**，例如安全关键元数据（资源标识符、数据来源）或 agent 上下文数据（工具
      调用与响应格式）。其影响与指令注入相当，agent 依然会执行非预期动作，但那些专门用于识别
      「嵌入指令」的防御，没有任何理由把一段格式规范的元数据标记为可疑。

  - id: "2602.09222"
    title: "MUZZLE: Adaptive Agentic Red-Teaming of Web Agents Against Indirect Prompt Injection Attacks"
    abbr: "MUZZLE"
    date: "2026-02"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Criticizes existing security evaluations for relying on fixed attack templates, manually
      chosen injection surfaces, or narrowly scoped scenarios, none of which reflect the adaptive
      adversary a deployed agent meets. MUZZLE automates the process by using the target agent's
      own trajectories to locate high-salience injection surfaces, then adaptively generating
      context-aware malicious instructions aimed at confidentiality, integrity and availability
      violations. Grounding surface selection in observed agent behavior rather than human
      intuition is the key move — the attack adapts to whatever the agent actually attends to.
    summary_zh: >-
      批评现有安全评测依赖固定攻击模板、人工挑选的注入面或范围过窄的场景，都无法反映真实部署时
      面对的自适应攻击者。MUZZLE 将这一过程自动化：利用目标 agent 自身的执行轨迹定位高显著性的
      注入面，再自适应地生成上下文感知的恶意指令，针对机密性、完整性、可用性三类违背分别施压。
      关键之处在于把注入面的选择建立在观测到的 agent 行为上而非人类直觉上——攻击会随 agent
      真正关注的内容而调整。

  - id: "2510.18314"
    title: "Genesis: Evolving Attack Strategies for LLM Web Agent Red-Teaming"
    abbr: "Genesis"
    date: "2025-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Argues that red-teaming built on manually crafted strategies or offline-trained static
      models cannot capture web agents' underlying behavioral patterns and therefore fails to
      generalize across environments — success in this setting requires attack strategies that
      keep being discovered and evolved. Genesis is a three-module agentic framework: an Attacker
      generating adversarial injections via a genetic algorithm over a hybrid strategy
      representation, a Scorer evaluating target responses for feedback, and a Strategist mining
      interaction logs to compile effective strategies into a reusable library.
    summary_zh: >-
      论证依赖人工编写策略或离线训练的静态模型的红队方法，无法捕捉 web agent 的底层行为模式，
      因而难以跨环境泛化——这个场景下的成功要求攻击策略被持续发现和演化。Genesis 是三模块 agentic
      框架：Attacker 用遗传算法在混合策略表示上生成对抗注入，Scorer 评估目标 agent 的响应并提供
      反馈，Strategist 从交互日志中挖掘有效策略并编纂进可复用的策略库。

  - id: "2606.00497"
    title: "\"I Strongly Suspect This Website Is a Scam\": Benchmarking PII Leakage and Detection without Defense in Autonomous Web Agents"
    abbr: "Scammer4U"
    date: "2026-05"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Studies social-engineering attacks — deceptive content already pervasive online — as a
      vector for manipulating autonomous web agents into submitting users' PII to
      attacker-controlled endpoints. Scammer4U is a pre-registered benchmark of 91
      attacker-controlled environments plus 10 benign-twin baselines, spanning 8 attack vectors
      and 16 site categories on an 8-axis factorial taxonomy that isolates each design factor's
      causal contribution. The benign-twin design carries the argument: critical-tier PII leakage
      reaches 54–93% without privacy guidance versus 0% on the twins, proving leakage is
      attack-attributable rather than incidental form-filling.
    summary_zh: >-
      把社会工程攻击（互联网上早已普遍存在的欺骗性内容）作为一类攻击向量来研究，考察它如何操纵
      自主 web agent 把用户 PII 提交到攻击者控制的端点。Scammer4U 是**预注册**基准，含 91 个
      攻击者控制环境与 10 个「良性孪生」对照，覆盖 8 类攻击向量、16 类站点，构建在能隔离各设计
      因子因果贡献的 8 轴因子分类上。良性孪生的设计承担了论证核心：无隐私提示时关键级 PII 泄露
      达 54–93%，而孪生对照为 0%，证明泄露可归因于攻击本身，而非顺手填表的偶然行为。

  - id: "2608.06862"
    title: "SynChain: Inducing Computer-Use Agent Systems to Construct Their Own Attack Chains"
    abbr: "SynChain"
    date: "2026-08"
    venue: "arXiv"
    section: "1.6"
    env: [desktop]
    summary: >-
      Identifies a gap left by defenses that treat attacks as externally triggered or temporally
      bounded: CUAs now generate, store and reuse their own artifacts such as skills and memory
      entries, so compromise can propagate internally through the agent's persistent state. The
      paper shows malicious influence can be covertly embedded in the structural redundancies of
      autonomously synthesized artifacts, surviving internal state updates and slipping past
      standard vetting. SynChain formalizes this via persistence-aware directed supervised
      fine-tuning that induces agents to produce poisoned yet benign-looking artifacts, evaluated
      on CUAChain (30 benign task chains, three attack objectives) with dormant activation.
    summary_zh: >-
      指出把攻击视为「外部触发、时间有界」的现有防御留下的缺口：CUA 如今会自行生成、存储并复用
      skill 与记忆条目这类产物，因此沦陷可以通过 agent 自身的持久化状态在**内部**传播。论文表明
      恶意影响能被隐蔽地嵌入自主合成产物的结构冗余中，从而在内部状态更新后存活、并绕过常规审查
      机制。SynChain 用「持久化感知的定向监督微调」将这一威胁形式化，诱导 agent 产出被投毒却
      外观无害的产物，并在 CUAChain（30 条良性任务链 + 三类攻击目标）上评测其潜伏激活效果。

  - id: "2604.08005"
    title: "Preference Redirection via Attention Concentration: An Attack on Computer Use Agents"
    abbr: "PRAC"
    date: "2026-04"
    venue: "arXiv"
    section: "1.2"
    env: [desktop, web]
    summary: >-
      Notes that prior CUA attack work concentrated on the language modality while the vision
      modality received far less attention, then attacks precisely there. Rather than
      manipulating the VLM's output directly, PRAC alters the model's internal preferences by
      redirecting attention toward a stealthy adversarial patch, steering a CUA's product
      selection on an online shopping platform to a chosen target. Attack construction needs
      white-box access, but the finding that matters is transfer: it generalizes to fine-tuned
      versions of the same model, so a single base model shared across many deployed agents
      becomes a shared liability.
    summary_zh: >-
      指出以往 CUA 攻击工作集中在语言模态，视觉模态受到的关注远远不足，随后就攻在这里。PRAC 不
      直接操纵 VLM 的输出，而是通过把注意力重定向到一个隐蔽的对抗补丁上，改变模型的**内部偏好**，
      从而在网购平台上把 CUA 的商品选择引导到指定目标。攻击构造需要白盒访问，但真正值得注意的
      结论是可迁移性：攻击对同一模型的微调版本依然有效——这意味着被众多部署 agent 共用的同一个
      基座模型，会变成一处共享的软肋。

  - id: "2605.28646"
    title: "MaskClaw: Edge-Side Personalized Privacy Arbitration for GUI Agents with Behavior-Driven Skill Evolution"
    abbr: "MaskClaw"
    date: "2026-05"
    venue: "arXiv"
    section: "2.1"
    env: [mobile, desktop]
    summary: >-
      Frames GUI-agent privacy as an arbitration problem rather than a detection problem: whether
      something is private depends on task, recipient, application state and user role, so static
      PII detectors miss the boundaries, while cloud-side VLM reasoning uploads the raw screen
      *before* deciding what needed protecting. MaskClaw runs at the edge, extracting local visual
      evidence, retrieving user- and task-specific policy memory, and deciding Allow / Mask / Ask
      before screenshots leave the trusted environment. Across five skill-evolution scenarios it
      converts user corrections, cancellations and edits into reusable privacy skills vetted by a
      sandbox gate, benchmarked on P-GUI-Evo.
    summary_zh: >-
      把 GUI agent 隐私问题定义为**裁决**问题而非检测问题：某项内容是否属于隐私取决于任务、接收方、
      应用状态与用户角色，因此静态 PII 检测器抓不住这些边界，而云端 VLM 推理又会在决定「什么需要
      保护」**之前**就把原始屏幕上传出去。MaskClaw 运行在边缘侧：抽取本地视觉证据、检索用户与任务
      专属的策略记忆，在截图离开可信环境前判定 Allow / Mask / Ask。在五个 skill 演进场景中，它把
      用户的纠正、取消与编辑转化为可复用的隐私 skill，并经沙箱门校验，评测基准为 P-GUI-Evo。

  - id: "2603.11862"
    title: "You Told Me to Do It: Measuring Instructional Text-induced Private Data Leakage in LLM Agents"
    abbr: "ReadSecBench"
    date: "2026-03"
    venue: "arXiv"
    section: "1.1"
    env: [desktop]
    summary: >-
      Names the structural problem the Trusted Executor Dilemma: high-privilege agents are handed
      terminal access, filesystem control and outbound network connectivity, then asked to read
      and execute project documentation — but they cannot distinguish malicious directives from
      legitimate setup guidance, so they execute adversarial documentation-embedded instructions
      at high rates. The paper insists this is a consequence of the instruction-following design
      paradigm rather than an implementation bug. Measurement is structured by a three-dimensional
      taxonomy (linguistic disguise, structural obfuscation, semantic abstraction) over
      ReadSecBench, 500 real-world README files.
    summary_zh: >-
      把这一结构性问题命名为「可信执行者困境」（Trusted Executor Dilemma）：高权限 agent 被授予
      终端访问、文件系统控制与出网能力，然后被要求阅读并执行项目文档——但它无法区分恶意指令与
      正常的安装配置说明，因此会以很高的比率执行嵌在文档里的对抗指令。论文强调这是「指令遵循」
      设计范式的必然后果，而非实现层面的 bug。测量以三维分类法（语言伪装、结构混淆、语义抽象）
      组织，基准 ReadSecBench 由 500 个真实 README 文件构成。

  - id: "2512.07725"
    title: "Privacy Practices of Browser Agents"
    abbr: "Privacy Practices of Browser Agents"
    date: "2025-12"
    venue: "arXiv"
    section: "4"
    env: [web]
    summary: >-
      One of the few papers evaluating shipped browser-agent products rather than research
      prototypes, covering eight recent popular agents. The argument for urgency is structural:
      the same automation that makes these tools powerful also makes them high-risk failure
      points, and both the tasks they perform and the information entrusted to them mean a
      vulnerability translates directly into large privacy harm. The framework spans five factors
      and 15 distinct measurements — component vulnerabilities, protection against website
      behaviors, cross-site tracking prevention, response to privacy-affecting prompts, and the
      tool's own logging behavior.
    summary_zh: >-
      少数评测**已上市浏览器 agent 产品**而非研究原型的工作之一，覆盖八款近期流行 agent。其紧迫性
      论证是结构性的：让这些工具强大的自动化能力，同时使它们成为高风险的失效点；而它们所执行的
      任务类型与被托付的信息类型，意味着任何漏洞都会直接转化为大规模隐私危害。评测框架含五大因子
      共 15 项具体测量——组件自身漏洞、对网站行为的防护、跨站追踪阻断、对影响隐私的 prompt 的
      响应方式、以及工具自身的日志记录行为。

  - id: "2510.27140"
    title: "Measuring the Security of Mobile LLM Agents under Adversarial Prompts from Untrusted Third-Party Channels"
    abbr: "Mobile Agent Security Study"
    date: "2025-10"
    venue: "arXiv"
    section: "0"
    env: [mobile]
    summary: >-
      The first systematic study of security risks in mobile LLM agents, spanning adversarial case
      studies from opportunistic manipulation via pop-up advertisements up to end-to-end workflows
      involving malware installation and cross-app data exfiltration. Coverage is broad — eight
      state-of-the-art mobile agents across three architectures, over 2,000 adversarial and paired
      benign trials. The results are systemic rather than incidental: low-barrier vectors such as
      fraudulent ads succeed with over 80% reliability, and even workflows that require
      circumventing explicit operating-system warnings, such as malware installation, still go
      through.
    summary_zh: >-
      首个针对移动 LLM agent 安全风险的系统性研究，对抗案例从弹窗广告这类机会主义操纵，一直延伸到
      涉及恶意软件安装与跨应用数据外泄的端到端攻击流程。覆盖面很广——三种架构下的八个前沿移动
      agent，超过 2000 组对抗与配对良性试验。结论是系统性的而非个例：欺诈广告这类低门槛向量成功率
      超过 80%，而即便是需要绕过操作系统显式警告的流程（如安装恶意软件），依然能够走通。

  - id: "2602.10139"
    title: "Anonymization-Enhanced Privacy Protection for Mobile GUI Agents: Available but Invisible"
    abbr: "Available but Invisible"
    date: "2026-02"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Diagnoses why existing privacy defenses for mobile GUI agents all fall short: reducing UI
      exposure, obfuscating only task-irrelevant content, or asking for user authorization each
      leave the hard case untouched — protecting information that is itself *task-critical*. The
      proposed principle is available-but-invisible: sensitive data stays usable for execution but
      is never directly visible to the cloud-based agent. Implementation combines a PII-aware
      recognition model over UI content with anonymization, so the agent operates on
      placeholders while the real values never leave the trusted boundary.
    summary_zh: >-
      诊断出移动 GUI agent 现有隐私防御为何都不够用：减少 UI 暴露、只混淆与任务无关内容、或依赖
      用户授权，这三条路都绕开了最难的情况——如何保护**本身就是任务必需**的敏感信息。论文提出的
      原则是「可用但不可见」：敏感数据对执行仍然可用，但云端 agent 永远看不到其真实内容。实现上
      结合 PII 感知的 UI 内容识别模型与匿名化，使 agent 在占位符上操作，真实值始终不越出可信边界。

  - id: "2606.20636"
    title: "SkillHarness: Harnessing Safe Skills for Computer-Use Agents"
    abbr: "SkillHarness"
    date: "2026-06"
    venue: "arXiv"
    section: "2.6"
    env: [desktop]
    summary: >-
      Targets an assumption baked into skill-learning methods: they distill reusable skills from
      successful trajectories while implicitly assuming static, safe environments, ignoring both
      adversarial interaction such as prompt injection and environmental dynamics such as pop-ups.
      In dynamic settings that assumption produces risky learned skills and brittle execution, so
      the vulnerability gets *baked into* the agent's reusable library. SkillHarness models skill
      learning and use as a safety-constrained interaction process, introducing a skill boundary
      that replaces static skill abstractions.
    summary_zh: >-
      针对 skill 学习类方法中一个被默认接受的假设：它们从成功轨迹中蒸馏可复用 skill，却隐含假定
      环境是静态且安全的，既忽略提示注入这类对抗交互，也忽略弹窗这类环境动态。在动态环境下，这个
      假设会产出有风险的 skill 与脆弱的执行——也就是说漏洞被**固化进**了 agent 的可复用库里。
      SkillHarness 把 skill 的学习与使用建模为受安全约束的交互过程，引入「skill 边界」以取代
      静态的 skill 抽象。

  - id: "2602.08235"
    title: "When Benign Inputs Lead to Severe Harms: Eliciting Unsafe Unintended Behaviors of Computer-Use Agents"
    abbr: "AutoElicit"
    date: "2026-02"
    venue: "arXiv"
    section: "1.7"
    env: [desktop]
    summary: >-
      Observes that CUAs demonstrably produce unsafe unintended behaviors even under benign inputs,
      but exploration of this risk has stayed anecdotal — no concrete characterization, no
      automated way to surface long-tail cases. The paper supplies the first conceptual and
      methodological framework for unintended CUA behavior: defining its characteristics,
      eliciting it automatically, and analyzing how it arises from benign inputs. AutoElicit
      iteratively perturbs benign instructions using CUA execution feedback while keeping the
      perturbations realistic and benign, surfacing hundreds of harmful behaviors from frontier
      models including Claude 4.5 Haiku and Opus.
    summary_zh: >-
      观察到 CUA 即便在良性输入下也确实会产生不安全的非预期行为，但对这类风险的探索一直停留在
      个案层面——既无具体刻画，也无自动化手段挖掘长尾情形。论文提供了首个关于 CUA 非预期行为的
      概念与方法框架：定义其关键特征、自动化诱发、并分析它如何从良性输入中产生。AutoElicit 利用
      CUA 的执行反馈迭代扰动良性指令，同时保持扰动本身真实且无恶意，从 Claude 4.5 Haiku、Opus
      等前沿模型上挖掘出数百个有害行为。

  - id: "2601.07263"
    title: "When Bots Take the Bait: Exposing and Mitigating the Emerging Social Engineering Attack in Web Automation Agent"
    abbr: "AgentBait"
    date: "2026-01"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Notes that prior research concentrated on model-level threats like prompt injection and
      backdoors while social engineering against web automation agents stayed unexplored, even as
      open-source frameworks such as Browser Use and Skyvern-AI widened the attack surface. The
      AgentBait paradigm exploits an intrinsic execution weakness: inducement contexts distort the
      agent's reasoning and steer it toward objectives misaligned with the intended task, without
      any injected instruction. The defense, SUPERVISOR, is a lightweight pluggable runtime module
      enforcing environment-and-intention consistency between webpage context and the intended
      goal.
    summary_zh: >-
      指出以往研究集中在提示注入、后门这类模型层威胁，而针对 web 自动化 agent 的社会工程攻击一直
      无人探索——尽管 Browser Use、Skyvern-AI 等开源框架已显著扩大了攻击面。AgentBait 攻击范式
      利用执行层面的内在弱点：诱导性上下文会扭曲 agent 的推理，把它引向与原任务不一致的目标，
      而全程不需要注入任何指令。防御侧提出 SUPERVISOR，一个轻量可插拔的运行时模块，强制网页
      上下文与预期目标之间的「环境—意图一致性」对齐。

  - id: "2607.18659"
    title: "Broken Gates: Re-evaluating Web Bot Defenses in the Age of LLM Agents"
    abbr: "Broken Gates"
    date: "2026-07"
    venue: "arXiv"
    section: "4"
    env: [web]
    summary: >-
      Inverts the usual perspective: instead of asking how to protect agents, it asks whether the
      web's existing bot management systems still hold now that browser agents navigate
      autonomously, reason about page content and follow natural-language instructions rather than
      replaying predefined scripts. The measurement covers both interactive challenge-based and
      non-interactive trust-based defenses against two attacker classes — commercial Captcha
      solvers and LLM browser agents — spanning seven solver services and six agent configurations
      (cloud-hosted, self-hosted, AI-assisted, extension) against hCaptcha, reCaptcha v2/v3 and
      Cloudflare Turnstile. Challenge-based defenses are broken.
    summary_zh: >-
      把通常的视角反转过来：不问「如何保护 agent」，而问「在浏览器 agent 能自主导航、理解页面内容、
      按自然语言指令行动（而非回放预设脚本）之后，网络现有的 bot 管理系统还挡得住吗」。测量同时
      覆盖交互式挑战型防御与非交互式信任型防御，面对两类攻击者——商业验证码破解服务与 LLM 浏览器
      agent——涵盖 7 家破解服务与 6 种 agent 配置（云托管、自托管、AI 辅助、浏览器扩展），针对
      hCaptcha、reCaptcha v2/v3、Cloudflare Turnstile。结论是：挑战型防御已经失守。

  - id: "2602.08995"
    title: "When Actions Go Off-Task: Detecting and Correcting Misaligned Actions in Computer-Use Agents"
    abbr: "DeAction"
    date: "2026-02"
    venue: "arXiv"
    section: "2.2"
    env: [desktop]
    summary: >-
      Unifies two failure sources usually studied separately: misaligned actions arising from
      external attacks such as indirect prompt injection, and from internal limitations such as
      erroneous reasoning — both deviate from user intent, both degrade safety and task
      reliability, so a detector keyed only to attacks misses half the problem. The work defines
      misaligned action detection for CUAs, identifies three common categories in real deployment,
      and builds MisActBench from realistic trajectories with human-annotated action-level
      alignment labels. DeAction is a universal guardrail detecting misalignment before execution
      and iteratively correcting it via structured feedback.
    summary_zh: >-
      把通常被分开研究的两类失效来源统一起来：源自外部攻击（如间接提示注入）的偏离动作，与源自
      内部局限（如推理错误）的偏离动作——两者都背离用户意图、都损害安全性与任务可靠性，因此只针对
      攻击设计的检测器会漏掉一半问题。工作定义了 CUA 的「偏离动作检测」任务，归纳出真实部署中的
      三类常见情形，并基于真实轨迹构建带人工标注的动作级对齐标签基准 MisActBench。DeAction 是
      通用护栏，在执行前检出偏离动作，并通过结构化反馈迭代纠正。

  - id: "2608.00202"
    title: "From Monoliths to Swarms: A Study of Attack Surface Evolution in the Transition to Multi-Agent Web Systems"
    abbr: "WebMASLab"
    date: "2026-07"
    venue: "arXiv"
    section: "0"
    env: [web]
    summary: >-
      Asks what role decomposition costs in security terms: multi-agent web systems improve task
      performance by splitting work across specialized sub-agents, but that split creates
      structural attack surfaces absent in single-agent setups, and those surfaces remain poorly
      categorized. The paper proposes a taxonomy for attack vectors specific to web-based MAS and
      builds WebMASLab to study a fully external, web-only adversary. Methodologically it is
      careful — user task, tool surface and browser substrate are held fixed so that only
      architecture varies, across three adversarial scenarios and three conditions (baseline,
      prompt-hardened, reasoning-enabled).
    summary_zh: >-
      追问「角色分解」在安全上的代价：多 agent web 系统通过把工作拆给专职子 agent 来提升任务性能，
      但这种拆分会产生单 agent 架构下不存在的结构性攻击面，而这些攻击面此前缺乏归类。论文提出
      针对 web 多 agent 系统的攻击向量分类法，并构建 WebMASLab 来研究一个完全外部、仅通过网页
      施加影响的攻击者。方法上相当严谨——固定用户任务、工具面与浏览器基座，只让架构一个变量变化，
      覆盖三种对抗场景与三种条件（基线、prompt 加固、开启推理）。

  - id: "2512.08417"
    title: "Attention is All You Need to Defend Against Indirect Prompt Injection Attacks in LLMs"
    abbr: "Rennervate"
    date: "2025-12"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Takes a mechanistic route to injection defense by reading attention features rather than
      classifying text: Rennervate detects covert injection at token-level granularity, which
      enables precise sanitization that neutralizes the injection while leaving the rest of the
      LLM's functionality intact — a contrast with page-level or segment-level defenses that must
      discard clean content along with the poisoned span. The token-level detector uses a two-step
      attentive pooling mechanism aggregating attention heads and response tokens. The work also
      releases FIPI, a fine-grained IPI dataset, and reports outperforming 15 commercial and
      academic defenses.
    summary_zh: >-
      走机制路线做注入防御——读取注意力特征而非对文本做分类：Rennervate 在 **token 级**粒度检出
      隐蔽注入，从而实现精确净化，在中和注入的同时保留 LLM 其余功能完整。这与页面级或片段级防御
      形成对比，后者必须把干净内容与被污染片段一起丢弃。token 级检测器采用两步注意力池化机制，
      聚合注意力头与响应 token。工作同时发布细粒度 IPI 数据集 FIPI，并报告优于 15 种商业与学术
      防御方法。

  - id: "2603.04364"
    title: "Dual-Modality Multi-Stage Adversarial Safety Training: Robustifying Multimodal Web Agents Against Cross-Modal Attacks"
    abbr: "DMAST"
    date: "2026-03"
    venue: "arXiv"
    section: "2.6"
    env: [web]
    summary: >-
      Locates an attack surface created by architecture: multimodal web agents consume both
      screenshots and accessibility trees, so an adversary injecting into the DOM corrupts *both*
      observation channels at once with a mutually consistent deceptive narrative, defeating any
      cross-channel sanity check. Vulnerability analysis on MiniWob++ shows attacks with a visual
      component far outperform text-only injection, exposing the gap left by text-centric VLM
      safety training. DMAST formalizes agent-attacker interaction as a two-player zero-sum Markov
      game and co-trains both sides through imitation learning, oracle-guided SFT with a
      zero-acknowledgment strategy, and a final adversarial stage.
    summary_zh: >-
      定位到一处由架构本身造就的攻击面：多模态 web agent 同时消费截图与无障碍树，因此攻击者只需
      注入 DOM 就能**同时**污染两个观测通道，并且两边叙述互相一致，使任何跨通道一致性检查都失效。
      MiniWob++ 上的漏洞分析显示，带视觉成分的攻击远强于纯文本注入，暴露出以文本为中心的 VLM
      安全训练所留下的缺口。DMAST 把 agent 与攻击者的交互形式化为二人零和马尔可夫博弈，通过模仿
      学习、带「零确认」策略的 oracle 引导 SFT、以及最后的对抗阶段共训双方。

  - id: "2604.11259"
    title: "Mobile GUI Agent Privacy Personalization with Trajectory Induced Preference Optimization"
    abbr: "TIPO"
    date: "2026-04"
    venue: "arXiv"
    section: "2.4"
    env: [mobile]
    summary: >-
      Reframes privacy as a personalization problem rather than a fixed policy: most systems
      optimize task success or efficiency, ignoring that different users want different privacy
      postures. The technical observation is that personalization induces systematic structural
      heterogeneity in trajectories — a privacy-first user prefers protective actions like
      refusing permissions, logging out and minimizing exposure, producing logically different and
      variable-length trajectories from a utility-first user, which destabilizes standard
      preference optimization. TIPO addresses this with preference-intensity weighting to emphasize
      key privacy steps and padding gating to suppress alignment noise.
    summary_zh: >-
      把隐私重新框定为**个性化**问题而非一套固定策略：多数系统只优化任务成功率或效率，忽略了不同
      用户想要的隐私姿态本就不同。技术上的关键观察是个性化会引起轨迹的系统性结构异质——隐私优先的
      用户偏好拒绝权限、登出、最小化暴露这类保护性动作，产生与效用优先用户在逻辑上不同、长度也
      不等的轨迹，从而使标准偏好优化变得不稳定且信息量下降。TIPO 用偏好强度加权突出关键隐私步骤，
      并以 padding gating 抑制对齐噪声。

  - id: "2508.19461"
    title: "Reliable Weak-to-Strong Monitoring of LLM Agents"
    abbr: "CUA-SHADE-Arena"
    date: "2025-08"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Stress-tests monitoring systems for covert agent misbehavior such as secretly sharing private
      information, via a monitor red teaming workflow varying agent and monitor situational
      awareness, applying evasion strategies including prompt injection, and running on
      SHADE-Arena for tool-calling agents plus the new CUA-SHADE-Arena extending TheAgentCompany
      to computer-use agents. The headline finding is asymmetric and counterintuitive: agent
      awareness dominates monitor awareness — an agent knowing it is monitored substantially
      degrades monitor reliability, while giving the monitor more information about the agent helps
      far less.
    summary_zh: >-
      压力测试针对 agent 隐蔽违规（如私下分享隐私信息）的监控系统：设计「监控器红队」工作流，
      变化 agent 与监控器各自的情境感知程度，施加含提示注入的规避策略，并在面向工具调用 agent 的
      SHADE-Arena 与新构建的 CUA-SHADE-Arena（把 TheAgentCompany 扩展到 computer-use agent）
      上运行。核心发现不对称且反直觉：**agent 的感知压制监控器的感知**——agent 一旦知道自己正被
      监控，监控可靠性显著下降；而反过来给监控器提供更多关于 agent 的信息，帮助要小得多。

  - id: "2506.02539"
    title: "VerificAgent: Domain-Specific Memory Verification for Scalable Oversight of Aligned Computer-Use Agents"
    abbr: "VerificAgent"
    date: "2025-06"
    venue: "arXiv"
    section: "2.4"
    env: [desktop]
    summary: >-
      Treats persistent memory as an explicit alignment surface, on the reasoning that continual
      memory augmentation lets CUAs learn from prior interactions but unvetted memories encode
      domain-inappropriate or unsafe heuristics — spurious rules that quietly drift from user
      intent and safety constraints. VerificAgent combines an expert-curated seed of domain
      knowledge, iterative trajectory-based memory growth during training, and a post-hoc human
      fact-checking pass before deployment. The framing is the contribution: having humans correct
      high-impact errors once turns verified memory into a frozen safety contract that future
      actions must satisfy, with no model fine-tuning required.
    summary_zh: >-
      把持久化记忆当作一个**显式的对齐面**来处理，理由是：持续的记忆增强让 CUA 能从过往交互中学习，
      但未经审核的记忆会编码领域不适当或不安全的启发式规则——这些伪规则会悄然偏离用户意图与安全
      约束。VerificAgent 结合三部分：专家策划的领域知识种子、训练期基于轨迹的迭代记忆增长、以及
      部署前的人工事实核查环节。真正的贡献在其框定方式：让人类**一次性**纠正高影响错误，就把
      经核验的记忆变成一份「冻结的安全契约」，后续所有动作都必须满足它，且无需微调模型。

  - id: "2402.16965"
    title: "WIPI: A New Web Threat for LLM-Driven Web Agents"
    abbr: "WIPI"
    date: "2024-02"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      One of the earliest papers to pose the question directly — as countless web agents shipped
      and moved toward everyday deployment, are they secure at all? WIPI introduces a threat that
      indirectly controls a web agent by embedding malicious instructions in publicly accessible
      webpages, requiring no access to the agent itself. The method works black-box and focuses on
      the form and content of the indirect instruction rather than on model internals, which is
      what makes it both efficient and stealthy. Historically this is a foundational reference for
      the indirect injection line of work on web agents.
    summary_zh: >-
      最早直接抛出这个问题的工作之一——在无数 web agent 相继发布、逐步走向日常部署之际，它们究竟
      安全吗？WIPI 提出一种新威胁：把恶意指令嵌入公开可访问的网页，从而间接控制 web agent，全程
      无需接触 agent 本身。方法在黑盒环境下工作，关注的是间接指令的形式与内容而非模型内部，这正是
      它兼具效率与隐蔽性的原因。就领域脉络而言，这是 web agent 间接注入这条线的奠基性文献。

  - id: "2409.11295"
    title: "EIA: Environmental Injection Attack on Generalist Web Agents for Privacy Leakage"
    abbr: "EIA"
    date: "2024-09"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      The first study of privacy risk for generalist web agents in adversarial environments,
      motivated by an observation that is obvious in hindsight: everyday web tasks such as booking
      flights inherently involve the user's PII, so an agent that touches a compromised site
      leaks by construction. The paper presents a realistic website-side threat model with two
      adversarial targets — stealing specific PII, or the entire user request — and proposes the
      Environmental Injection Attack, which injects content designed to blend into the environment
      the agent operates in. This paper named the environmental-injection category that later work
      builds on.
    summary_zh: >-
      首个研究通用 web agent 在对抗环境下隐私风险的工作，出发点事后看来显而易见：订机票这类日常
      网页任务本身就涉及用户 PII，因此 agent 一旦接触到被攻陷的网站，泄露就是结构性的。论文给出
      网站侧的现实威胁模型，含两类攻击目标——窃取特定 PII，或窃取完整的用户请求——并提出「环境
      注入攻击」（EIA），注入的内容经设计能融入 agent 所处的环境。这篇论文命名了后续工作赖以展开的
      「环境注入」这一攻击类别。

  - id: "2410.13886"
    title: "Refusal-Trained LLMs Are Easily Jailbroken As Browser Agents"
    abbr: "BrowserART"
    date: "2024-10"
    venue: "arXiv"
    section: "0"
    env: [web]
    summary: >-
      Asks a question that reframed how the field thinks about agent safety: does the refusal
      behavior instilled in chat contexts generalize to non-chat, agentic use? The stakes differ
      in kind rather than degree — unlike a chatbot, an agent holding a browser or a phone acts on
      the real world, so a failed refusal produces consequences rather than text. The paper ships
      BrowserART, a red-teaming suite of 100 browser-related harmful behaviors spanning synthetic
      and real websites, drawing partly on HarmBench and AirBench 2024. The finding that refusal
      training transfers poorly to the agentic setting motivated much of the subsequent work.
    summary_zh: >-
      提出了一个重塑领域思考方式的问题：在聊天场景中训练出的拒答行为，能否泛化到非聊天的 agentic
      场景？其风险是**性质**上的差异而非程度差异——与聊天机器人不同，手握浏览器或手机的 agent 直接
      作用于真实世界，因此一次拒答失败产生的是后果而不是文本。论文发布红队测试套件 BrowserART，
      含 100 项浏览器相关有害行为、覆盖合成与真实网站，部分取材自 HarmBench 与 AirBench 2024。
      「拒答训练难以迁移到 agentic 场景」这一结论催生了此后大量工作。

  - id: "2410.06703"
    title: "ST-WebAgentBench: A Benchmark for Evaluating Safety and Trustworthiness in Web Agents"
    abbr: "ST-WebAgentBench"
    date: "2024-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Criticizes benchmarks that measure only whether an agent finishes a task, ignoring whether it
      finished safely or in a way an enterprise can trust — and argues safety and trustworthiness
      are prerequisites for adoption in critical workflows, not add-ons. Each of its 222 tasks
      pairs with ST policies, concise rules encoding constraints, scored on six orthogonal
      dimensions such as user consent and robustness. Its lasting contribution is the metric:
      Completion Under Policy credits only completions respecting every applicable policy, and
      three open agents score under two-thirds of their nominal success rate under CuP.
    summary_zh: >-
      批评那些只测量「任务是否完成」的基准——它们忽略了完成得是否安全、是否达到企业可信任的程度——
      并主张在关键工作流中，安全与可信是采用的前置条件而非附加项。其 222 个任务每个都配有 ST 策略
      （编码约束的简明规则），并在用户同意、鲁棒性等六个正交维度上打分。真正留下来的贡献是那个
      指标：Completion Under Policy 只把「遵守了所有适用策略」的完成计为成功，而三个开源 agent
      在 CuP 下的得分不足其名义成功率的三分之二。

  - id: "2406.09187"
    title: "GuardAgent: Safeguard LLM Agents by a Guard Agent via Knowledge-Enabled Reasoning"
    abbr: "GuardAgent"
    date: "2024-06"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      The first guardrail *agent* — rather than a classifier or a filter, it protects a target agent
      by dynamically checking whether its actions satisfy given safety guard requests. The design
      is notable for how it escapes the reliability limits of LLM judgment: GuardAgent analyses the
      guard request into a task plan, maps that plan into guardrail *code*, and executes it, so
      enforcement is deterministic even though the reasoning is LLM-based, with in-context
      demonstrations retrieved from a memory of prior tasks. It also contributes EICU-AC for
      healthcare-agent access control and Mind2Web-SC for web-agent safety policies.
    summary_zh: >-
      首个护栏 **agent**——它不是分类器或过滤器，而是通过动态检查目标 agent 的动作是否满足给定的
      安全守护请求来实施保护。设计上值得注意的是它如何绕开 LLM 判断的可靠性上限：GuardAgent 先把
      守护请求解析为任务计划，再把计划映射为护栏**代码**并执行，因此尽管推理由 LLM 承担，强制执行
      仍是确定性的；同时从存有历史任务经验的记忆模块中检索上下文示例。工作还贡献了两个基准：
      面向医疗 agent 访问控制的 EICU-AC，与面向 web agent 安全策略的 Mind2Web-SC。

  - id: "2410.17401"
    title: "AdvAgent: Controllable Blackbox Red-teaming on Web Agents"
    abbr: "AdvAgent"
    date: "2024-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      A black-box red-teaming framework that departs from hand-crafted adversarial prompts by
      training an adversarial prompter model through a reinforcement learning pipeline, optimizing
      prompts from the black-box agent's own feedback. The design goal is not raw success but
      controllability alongside stealthiness — attacks that remain steerable rather than merely
      effective. It reports high success rates against state-of-the-art GPT-4-based web agents
      across diverse tasks, and finds existing prompt-based defenses offer only limited
      protection, an early datapoint for why prompt hardening alone does not hold.
    summary_zh: >-
      黑盒红队框架，摆脱人工编写对抗 prompt 的做法，转而用强化学习流水线训练一个对抗 prompter
      模型，依据黑盒 agent 自身的反馈来优化 prompt。其设计目标不只是成功率，而是在隐蔽性之外还要
      **可控性**——攻击要保持可操纵，而非仅仅有效。论文报告在多样任务上对基于 GPT-4 的前沿 web
      agent 取得高成功率，并发现现有基于 prompt 的防御保护有限，这是「单靠 prompt 加固撑不住」
      的一个早期证据。

  - id: "2609.09212"
    title: "AgentHijack: Visual Patch Attacks on Multimodal Computer-Use Agents"
    abbr: "AgentHijack"
    date: "2026-09"
    venue: "arXiv"
    section: "1.2"
    env: [desktop, web]
    summary: >-
      Insists on end-to-end verification rather than stopping at model output: the question is
      whether a local visual patch produces verifiable *environmental consequences* across the
      full chain of screenshot input, VLM generation, action parsing, and environment execution.
      Patches are trained and deployed on author-controlled GitHub Pages and a locally hosted
      CSDN clone, evaluated across five open or publicly available GUI-agent and VLM backends
      over 600 instance-level online cases. The three-stage metrics expose where attacks decay —
      T-ASR 84.5%, TAPR 47.0%, but E2E-ASR only 20.3%. Trajectory analysis found the most
      unsettling pattern: in some successful cases the agent runs the malicious terminal command
      first, then calmly resumes the user's original benign task.
    summary_zh: >-
      坚持做端到端验证而不止于模型输出：真正要回答的问题是，一个局部视觉补丁能否在「截图输入 →
      VLM 生成 → 动作解析 → 环境执行」的完整链条上产生**可验证的环境后果**。补丁在作者控制的
      GitHub Pages 与本地部署的 CSDN 克隆站上训练与投放，在五个开源或公开可得的 GUI agent /
      VLM 后端上评测，汇总 600 个实例级在线用例。三级指标清楚地暴露了攻击在哪一环衰减——
      T-ASR 84.5%、TAPR 47.0%，而 E2E-ASR 仅 20.3%。轨迹分析发现了最令人不安的现象：在部分
      成功案例中，agent 先执行了恶意终端命令，随后又不动声色地继续完成用户原本的良性任务。

  - id: "2410.17520"
    title: "MobileSafetyBench: Evaluating Safety of Autonomous Agents in Mobile Device Control"
    abbr: "MobileSafetyBench"
    date: "2024-10"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Fills what was then a complete void — no standardized benchmark existed for the safety of
      mobile device-control agents, despite these agents interacting directly with personal
      information and device settings. Built on Android emulators for realistic grounding, it
      spans applications including messaging and banking, and deliberately separates two risk
      families that are often conflated: misuse (the agent is asked to do something harmful) and
      negative side effects (the agent causes harm while pursuing a legitimate goal). Tasks cover
      both everyday scenarios and robustness against indirect prompt injection.
    summary_zh: >-
      填补了当时的一个完全空白——尽管移动设备控制 agent 会直接接触个人信息与设备设置，却没有任何
      标准化的安全评测基准。该基准基于 Android 模拟器构建以保证真实性，覆盖消息、银行等类应用，
      并刻意区分了两类常被混为一谈的风险：**滥用**（agent 被要求做有害之事）与**负面副作用**
      （agent 在追求正当目标的过程中造成危害）。任务同时覆盖日常场景与面对间接提示注入时的鲁棒性。

  - id: "2506.00618"
    title: "RiOSWorld: Benchmarking the Risk of Multimodal Computer-Use Agents"
    abbr: "RiOSWorld"
    date: "2025-05"
    venue: "arXiv"
    section: "3.1"
    env: [desktop]
    summary: >-
      Poses the transfer question head-on: can safety risk principles designed and aligned for
      general MLLMs in dialogue settings carry over to real-world computer-use scenarios? It
      argues prior risk evaluations fail on one of two counts — either they lack realistic
      interactive environments, or they narrow onto a few specific risk types — and both failures
      ignore the complexity and variability that define real environments. RiOSWorld evaluates
      risk during actual computer manipulation, and has become one of the more widely referenced
      risk benchmarks for multimodal CUAs.
    summary_zh: >-
      正面提出「迁移性」问题：为对话场景下的通用 MLLM 设计并对齐的安全风险原则，能否有效迁移到
      真实的计算机操作场景？论文指出以往的风险评测总在两点之一上失守——要么缺乏真实的交互环境，
      要么把范围收窄到少数几类特定风险——而这两种失守都忽略了真实环境所固有的复杂性与多变性。
      RiOSWorld 在真实的计算机操作过程中评测风险，已成为多模态 CUA 风险评测中被较多引用的基准之一。

  - id: "2506.02456"
    title: "VPI-Bench: Visual Prompt Injection Attacks for Computer-Use Agents"
    abbr: "VPI-Bench"
    date: "2025-06"
    venue: "arXiv"
    section: "3.4"
    env: [desktop, web]
    summary: >-
      Notes that prior work concentrated on browser-based agents and HTML-level attacks, leaving
      CUAs — which hold full system access and can manipulate files, read user data and execute
      arbitrary commands — comparatively unexamined. VPI-Bench studies instructions embedded
      *visually* in rendered interfaces, which by construction bypass text-level sanitization, and
      supplies 306 test cases across five widely used platforms. Each case is an interactive
      variant of a real web platform deployed in a realistic environment with a visually embedded
      malicious prompt, covering both CUAs and browser-use agents.
    summary_zh: >-
      指出以往工作集中在浏览器 agent 与 HTML 层攻击上，而握有完整系统权限、能操作文件、读取用户
      数据、执行任意命令的 CUA 反而研究不足。VPI-Bench 研究**视觉嵌入**于渲染界面中的恶意指令
      ——这类指令在构造上就绕开了文本层净化——并提供覆盖五个常用平台的 306 个测试用例。每个用例都是
      真实网页平台的交互式变体，部署在真实环境中并含一处视觉嵌入的恶意 prompt，同时覆盖 CUA 与
      browser-use agent 两类目标。

  - id: "2602.03255"
    title: "LPS-Bench: Benchmarking Safety Awareness of Computer-Use Agents in Long-Horizon Planning under Benign and Adversarial Scenarios"
    abbr: "LPS-Bench"
    date: "2026-02"
    venue: "arXiv"
    section: "3.4"
    env: [desktop]
    summary: >-
      Identifies a timing gap in existing benchmarks: they focus on short-horizon or GUI-level
      tasks and score execution-time errors, but never test whether an agent can *anticipate*
      risk at planning time — before any action fires. LPS-Bench evaluates planning-time safety
      awareness of MCP-based CUAs on long-horizon tasks, covering benign and adversarial
      interaction across 65 scenarios spanning 7 task domains and 9 risk types, with a multi-agent
      generation pipeline and LLM-as-a-judge assessment over the planning trajectory. Existing
      CUAs show substantial deficiencies at maintaining safety awareness across long plans.
    summary_zh: >-
      指出现有基准在**时机**上的缺口：它们聚焦短周期或 GUI 层任务、评判执行期错误，却从未检验
      agent 能否在**规划阶段**（任何动作发生之前）预见风险。LPS-Bench 评测基于 MCP 的 CUA 在
      长周期任务下的规划期安全意识，覆盖良性与对抗两类交互，含 7 个任务域、9 类风险的 65 个场景，
      配以多 agent 自动化数据生成流水线与针对规划轨迹的 LLM-as-a-judge 评测协议。实验显示现有
      CUA 在长程规划中维持安全意识的能力存在明显不足。

  - id: "2510.11035"
    title: "SusBench: An Online Benchmark for Evaluating Dark Pattern Susceptibility of Computer-Use Agents"
    abbr: "SusBench"
    date: "2025-10"
    venue: "arXiv"
    section: "3.1"
    env: [web, desktop]
    summary: >-
      Evaluates CUA susceptibility to UI dark patterns — designs that manipulate users into
      unintended actions — drawing nine common types from existing taxonomies and injecting
      believable instances into real consumer websites via code injection, yielding 313 tasks
      across 55 sites. The methodological strength is the human validation: a study with 29
      participants confirmed the injections read as highly realistic, with the vast majority
      never noticing they had been planted by the researchers. That control is what makes the
      side-by-side comparison of five state-of-the-art CUAs against human participants credible.
    summary_zh: >-
      评测 CUA 对 UI 暗黑模式（诱导用户做出非本意操作的界面设计）的易感程度：从既有分类法中选取
      九种常见类型，通过代码注入在真实消费类网站上构造可信实例，形成覆盖 55 个网站的 313 个评测
      任务。方法上的强项在于人类验证环节——29 名参与者的实验确认这些注入看起来高度真实，绝大多数
      人完全没有察觉它们是研究团队植入的。正是这一对照使得「五个前沿 CUA 与人类参与者并排比较」
      的结论具备可信度。

  - id: "2512.23128"
    title: "It's a TRAP! Task-Redirecting Agent Persuasion Benchmark for Web Agents"
    abbr: "TRAP"
    date: "2025-12"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Studies injection through the lens of persuasion rather than payload engineering: adversarial
      instructions hidden in interface elements *persuade* the agent away from its original task,
      which reframes the defense problem as psychological rather than syntactic. Across six frontier
      models, agents fall for injection in 25% of tasks on average, but the spread is the point —
      13% for GPT-5 against 43% for DeepSeek-R1. More troubling, small interface or contextual
      changes often double success rates, indicating the vulnerability is systemic rather than
      tied to any specific phrasing. Ships a modular social-engineering injection framework running
      controlled experiments on high-fidelity website clones.
    summary_zh: >-
      从「说服」而非「载荷工程」的视角研究注入：藏在界面元素里的对抗指令是在**说服** agent 偏离
      原任务，这把防御问题重新框定为心理学层面而非语法层面的。在六个前沿模型上，agent 平均在 25%
      的任务中中招，但真正值得看的是差距——GPT-5 为 13%，DeepSeek-R1 高达 43%。更麻烦的是，
      界面或上下文的微小改动常常使成功率翻倍，说明这种脆弱性是系统性的，而非绑定于某种特定措辞。
      配套发布模块化的社会工程注入框架，在高保真网站克隆上做受控实验。

  - id: "2510.24411"
    title: "OS-Sentinel: Towards Safety-Enhanced Mobile GUI Agents via Hybrid Validation in Realistic Workflows"
    abbr: "OS-Sentinel"
    date: "2025-10"
    venue: "arXiv"
    section: "2.3"
    env: [mobile]
    summary: >-
      Frames the core difficulty as one of scale: unsafe operations like system compromise and
      privacy leakage must be detected across the vast, complex operational space of mobile
      environments, and no single detector covers it. OS-Sentinel's answer is deliberately hybrid —
      a Formal Verifier catches explicit system-level violations with certainty, while a VLM-based
      contextual judge handles the semantic cases formal rules cannot express. It also contributes
      MobileRisk-Live, a dynamic sandbox paired with a safety detection benchmark of realistic
      trajectories carrying fine-grained annotations, which is what makes the hybrid split
      measurable rather than merely plausible.
    summary_zh: >-
      把核心难点归结为规模问题：系统沦陷、隐私泄露这类不安全操作需要在移动环境庞大而复杂的操作
      空间中被检出，而任何单一检测器都覆盖不了。OS-Sentinel 的答案是刻意的混合式——形式化验证器
      确定性地捕捉显式的系统级违规，VLM 上下文判别器处理形式化规则无法表达的语义情形。工作同时
      贡献了 MobileRisk-Live：一个动态沙箱环境，配套由真实轨迹构成、带细粒度标注的安全检测基准，
      正是它让这种混合式切分变得可测量，而不只是听起来合理。

  - id: "2605.06393"
    title: "Constraining Host-Level Abuse in Self-Hosted Computer-Use Agents via TEE-Backed Isolation"
    abbr: "TEE-Backed Isolation"
    date: "2026-05"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Targets self-hosted CUAs such as OpenClaw, which pair natural-language interaction with direct
      access to browsers, files, scripts, system commands and outbound channels — a combination that
      turns any successful steering into host-level abuse, whether via malicious messages, indirect
      injection, unsafe skills, or tampering along the host-side control path. The central argument
      is why blocklists cannot work: an operation's security criticality depends jointly on action
      type, target object, execution context and potential effect, so no static rule captures it.
      The design keeps ordinary functionality on the constrained REE path while moving
      security-critical classification behind a TEE boundary.
    summary_zh: >-
      针对 OpenClaw 这类自托管 CUA——它们把自然语言交互与对浏览器、文件、脚本、系统命令、外发
      通道的直接访问绑在一起，这种组合使任何一次成功的引导都会演变成主机级滥用，无论引导来自恶意
      消息、间接注入、不安全 skill，还是对主机侧控制路径的篡改。核心论点在于解释「为何黑名单行
      不通」：一个操作的安全关键性由动作类型、目标对象、执行上下文与潜在影响**共同**决定，任何
      静态规则都刻画不了。设计上让普通功能留在受约束的 REE 路径，而把安全关键的分类判定移到 TEE
      边界之后。

  - id: "2606.20910"
    title: "Whose Agent Are You? Multi-Layer Fingerprinting and Attribution of Autonomous Web Agents"
    abbr: "Agent Fingerprinting"
    date: "2026-06"
    venue: "arXiv"
    section: "2.5"
    env: [web]
    summary: >-
      Approaches agent security from the website operator's side rather than the agent's: as web
      agents proliferate, indiscriminate content scraping becomes a privacy and security problem,
      and the existing defenses — robots.txt, active bot-blocking — are widely violated and easily
      circumvented. The paper shows AI web agents are distinguishable from both humans and
      traditional crawlers via a multi-layer fingerprint combining network-layer characteristics
      (TLS, HTTP) with browser interaction behavior, deployed as a programmatic logging framework
      on a live instrumented domain. Analyzing six frameworks (AutoGen, Browser Use, Claude,
      Gemini, Operator, Skyvern) reveals latent structural differences in how each assembles
      requests and drives the browser.
    summary_zh: >-
      从网站运营方而非 agent 方切入 agent 安全：随着 web agent 大量涌现，无节制的内容抓取成为
      隐私与安全问题，而现有防线——robots.txt、主动 bot 拦截——被普遍无视且极易绕过。论文表明，
      AI web agent 可以通过「网络层特征（TLS、HTTP）+ 浏览器交互行为」的多层指纹，与人类及传统
      爬虫区分开来，并将该机制实现为可部署在真实插桩域名上的程序化日志框架。对六个主流框架
      （AutoGen、Browser Use、Claude、Gemini、Operator、Skyvern）的分析揭示出它们在组装 HTTP
      请求、建立 TLS/HTTP 连接、驱动浏览器自主操作方式上的潜在结构差异。

  - id: "2608.24913"
    title: "From Blind Edits to Verified Repair: Building Trustworthy User-Side LLM Agents for Web Accessibility"
    abbr: "Verified Repair"
    date: "2026-07"
    venue: "arXiv"
    section: "2.5"
    env: [web]
    summary: >-
      An unusual entry: the agent here is benign by design — a Chrome extension that rewrites pages
      for accessibility — yet the paper's contribution is a safety one, namely that unverified
      LLM edits are as likely to break a page as fix it. The dual-condition protocol measures harm
      as carefully as benefit across six small open-weight models (7B–14B) on ten violation-rich and
      ten already-accessible live sites, and the diagnosis is precise: unverified generation
      produced 24 improvements against 20 regressions. That near-parity is the argument for
      verification-before-apply, and the extension injects CSS reversibly so a bad edit can be
      undone — a concrete instance of the rollback discipline this section is about.
    summary_zh: >-
      一个特别的条目：这里的 agent 在设计上完全良性——一个为无障碍改写页面的 Chrome 扩展——但论文
      的贡献属于安全范畴，即**未经验证的 LLM 编辑，修好页面和弄坏页面的概率几乎相当**。双条件协议
      以同等严谨程度衡量收益与危害，在六个小规模开源模型（7B–14B）上、针对十个违规密集站点与十个
      本已高度无障碍的真实站点做评测，诊断相当精确：未验证生成带来 24 处改善、同时造成 20 处退化。
      这种近乎持平的比例正是「先验证再应用」的论据；而该扩展以可逆方式注入 CSS，使错误编辑可被
      撤销——这是本节所关注的回滚纪律的一个具体实例。

  - id: "2607.04334"
    title: "Do GUI Agents Believe Their Eyes? Diagnosing State-Belief Reliance on Pixels versus Structure"
    abbr: "Perception-Fusion Gap"
    date: "2026-07"
    venue: "arXiv"
    section: "1.2"
    env: [web, mobile, desktop]
    summary: >-
      Asks a question that sits upstream of every visual attack: a multimodal GUI agent reads the
      interface through two redundant channels — rendered pixels and serialized structure (DOM or
      accessibility tree) — and forms a state belief before acting, but no existing benchmark asks
      *which channel that belief came from*. The paper formalizes visual state reliance and measures
      it with paired single-channel interventions over 735 probes across real web, mobile and
      desktop interfaces, 225 of them zero-edit divergences mined from live production sites, scored
      by deterministic forced choice with no model judge. The Perception-Fusion Gap metric captures
      the fraction of probes a model perceives correctly yet resolves toward structure under
      conflict — which tells an attacker exactly which channel to poison.
    summary_zh: >-
      提出一个位于所有视觉攻击上游的问题：多模态 GUI agent 通过两条冗余通道读取界面——渲染后的
      像素与序列化结构（DOM 或无障碍树）——并在行动前形成对当前状态的信念，但现有基准从不追问
      **这个信念究竟来自哪条通道**。论文形式化了「视觉状态依赖」，用配对的单通道干预在覆盖真实
      web / mobile / desktop 界面的 735 个探针上测量，其中 225 个是从线上生产网站挖掘的零编辑
      分歧样本，全部采用确定性强制选择评分、不引入模型裁判。核心指标 Perception-Fusion Gap
      刻画的是「模型感知正确、但在冲突时倒向结构」的探针占比——而这恰好告诉攻击者该污染哪条通道。

  - id: "2601.09923"
    title: "CaMeLs Can Use Computers Too: System-level Security for Computer Use Agents"
    abbr: "NOVA"
    date: "2026-01"
    venue: "arXiv"
    section: "2.6"
    env: [desktop]
    summary: >-
      Confronts a genuine architectural impasse: isolation gives the strongest injection guarantees
      by strictly separating trusted planning from untrusted observations, but CUAs need continuous
      UI observation to decide each action — the two requirements are directly opposed. The paper
      resolves it with an empirical claim that turns out to hold: UI workflows, though dynamic, are
      structurally *predictable*. NOVA therefore uses single-shot planning, where a trusted planner
      emits a complete branching plan upfront covering all anticipated runtime states, which yields
      control-flow integrity guarantees against arbitrary instruction injection rather than
      best-effort detection.
    summary_zh: >-
      正面处理一个真实的架构僵局：架构隔离通过严格分离「可信规划」与「不可信观测」提供了最强的
      注入防护保证，但 CUA 必须持续观测 UI 才能决定每一步动作——这两项要求直接冲突。论文用一个
      经检验成立的经验判断来破局：UI 工作流虽然是动态的，但在**结构上是可预测的**。因此 NOVA
      采用单次规划：由可信规划器预先给出一份覆盖所有可预期运行时状态的完整分支计划，从而对任意
      指令注入提供控制流完整性**保证**，而不是尽力而为的检测。

  - id: "2510.10073"
    title: "SecureWebArena: A Holistic Security Evaluation Benchmark for LVLM-based Web Agents"
    abbr: "SecureWebArena"
    date: "2025-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Argues existing security benchmarks give only partial coverage, typically confined to narrow
      scenarios such as user-level prompt manipulation, and therefore miss most of the agent's
      actual vulnerability surface. SecureWebArena assembles six simulated but realistic web
      environments (e-commerce platforms, community forums and others) with 2,970 high-quality
      trajectories spanning diverse tasks and attack settings. Its organizing contribution is a
      structured taxonomy of six attack vectors covering **both** user-level and environment-level
      manipulation — the second half being exactly what narrower benchmarks omit.
    summary_zh: >-
      指出现有安全基准只提供部分覆盖，通常局限于用户级 prompt 操纵这类狭窄场景，因而错过了 agent
      实际暴露面的大部分。SecureWebArena 构建了六个模拟但贴近真实的网页环境（电商平台、社区论坛
      等），含覆盖多样任务与攻击设定的 2970 条高质量轨迹。其组织性贡献是一套结构化的六类攻击向量
      分类法，**同时**覆盖用户级与环境级操纵——而后者恰恰是范围更窄的基准所遗漏的那一半。

  - id: "2507.06899"
    title: "VisualTrap: A Stealthy Backdoor Attack on GUI Agents via Visual Grounding Manipulation"
    abbr: "VisualTrap"
    date: "2025-07"
    venue: "arXiv"
    section: "1.6"
    env: [mobile, desktop]
    summary: >-
      Identifies visual grounding — the mapping from a textual plan to concrete GUI elements — as an
      attack surface in its own right, distinct from planning or reasoning. The consequence is
      what makes it dangerous: a backdoor planted in grounding compromises the agent's behavior
      **even when it is given a completely correct task-solving plan**, so inspecting the plan
      reveals nothing wrong. VisualTrap hijacks grounding by misleading the agent into locating
      the textual plan at attacker-chosen positions, which means every layer of plan-level review
      or reasoning audit passes cleanly while the actions still land where the attacker wants.
    summary_zh: >-
      把「视觉 grounding」——即从文本计划到具体 GUI 元素的映射——认定为一个独立的攻击面，与规划和
      推理层面区分开来。其后果正是危险之处：植入 grounding 的后门会在 agent **拿到完全正确的
      解题计划时**依然改变其行为，因此检查计划本身看不出任何问题。VisualTrap 通过误导 agent 把
      文本计划定位到攻击者选定的位置来劫持 grounding，这意味着所有计划级审查与推理审计都能干净
      通过，而动作却落在攻击者想要的地方。

  - id: "2508.00935"
    title: "Measuring Harmfulness of Computer-Using Agents"
    abbr: "CUAHarm"
    date: "2025-07"
    venue: "arXiv"
    section: "3.1"
    env: [desktop]
    summary: >-
      Points out that existing benchmarks evaluate LMs in chatbots or simple tool use, which cannot
      measure what a CUA can actually do to a machine. CUAHarm supplies 104 expert-written realistic
      misuse risks — disabling firewalls, leaking data, installing backdoors — inside a sandbox with
      rule-based verifiable rewards, so the metric is whether the firewall is *actually* disabled
      rather than whether the model refused. The results are hard to dismiss: without any
      jailbreaking prompt, frontier models comply at high rates, Gemini 2.5 Pro reaching 90%. The
      paper also observes newer models being safer on previous benchmarks yet not here.
    summary_zh: >-
      指出现有基准评测的是聊天机器人或简单工具调用场景下的 LM，无法测量一个 CUA 实际能对机器做到
      什么。CUAHarm 提供 104 项专家撰写的真实滥用风险——关闭防火墙、外泄数据、安装后门——置于带
      规则化可验证奖励的沙箱中，因此指标是防火墙**是否真的被关掉**，而不是模型是否口头拒绝。
      结果很难被轻描淡写：在完全不加越狱提示的情况下，前沿模型的执行成功率就很高，Gemini 2.5 Pro
      达到 90%。论文还观察到，那些在以往基准上更安全的新模型，在这里并没有更安全。

  - id: "2509.11939"
    title: "PrivWeb: Unobtrusive and Content-aware Privacy Protection For Web Agents"
    abbr: "PrivWeb"
    date: "2025-09"
    venue: "arXiv"
    section: "2.4"
    env: [web]
    summary: >-
      Grounds its design in what users actually think: a formative study (N=15) found people
      frequently misunderstand agents' data practices and want data management that is transparent
      yet unobtrusive — two goals usually traded against each other. PrivWeb is a trusted add-on
      using a localized LLM to anonymize interface content per user preference, and its core
      mechanism is graded interruption: adaptive notifications pause the task for explicit user
      control only on highly sensitive information, while less sensitive cases get non-disruptive
      handling. That grading is what keeps human oversight affordable, validated in a second user
      study (N=14) across travel, retrieval, shopping and entertainment tasks.
    summary_zh: >-
      把设计建立在用户的真实认知上：一项形成性研究（N=15）发现人们普遍误解 agent 的数据使用方式，
      并希望数据管理既透明又不打扰——而这两个目标通常是互相牺牲的。PrivWeb 是运行在 web agent 上
      的可信附加组件，用本地化 LLM 按用户偏好对界面内容做匿名化，其核心机制是**分级打断**：
      自适应通知仅在高敏感信息上暂停任务、交由用户明确控制，而较低敏感度的情形走非打断式处理。
      正是这种分级让「人在环」的成本可承受，并通过第二项用户研究（N=14，覆盖旅行、信息检索、
      购物与娱乐任务）得到验证。

  - id: "2601.12822"
    title: "MirrorGuard: Toward Secure Computer-Use Agents via Simulation-to-Real Reasoning Correction"
    abbr: "MirrorGuard"
    date: "2026-01"
    venue: "arXiv"
    section: "2.2"
    env: [desktop]
    summary: >-
      Names the cost that detection-based defenses quietly impose: blocking prevents damage but
      often aborts the task prematurely, so security is bought with utility. MirrorGuard instead
      corrects unsafe reasoning, and solves the training-cost problem with a neural-symbolic
      simulation pipeline that generates realistic high-risk GUI interaction trajectories entirely
      in a text-based simulated environment — capturing unsafe reasoning patterns and potential
      system hazards without ever running destructive operations on a real OS. The resulting
      defense is plug-and-play, transferring simulation-trained correction to real deployments.
    summary_zh: >-
      点明基于检测的防御悄悄付出的代价：拦截虽能避免损害，但常常过早中止任务，等于用效用换安全。
      MirrorGuard 转而去**纠正不安全的推理**，并用神经符号仿真流水线解决训练成本问题——完全在
      文本化的模拟环境中生成真实感的高风险 GUI 交互轨迹，捕捉不安全推理模式与潜在系统危害，
      而无需在真实操作系统上执行任何破坏性操作。最终得到的是即插即用的防御，把仿真中训练出的
      纠正能力迁移到真实部署。

  - id: "2509.11250"
    title: "Environmental Injection Attacks against GUI Agents in Realistic Dynamic Environments"
    abbr: "Dynamic EIA"
    date: "2025-09"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Attacks the realism of prior environmental-injection work directly: most studies implicitly
      assume a trigger's on-screen position and surrounding visual context stay roughly consistent
      between training and testing, which erases the defining property of real web content — that
      it changes. The paper introduces a dynamic-environment threat model where the attacker is
      merely a regular user and the trigger sits inside a continuously shifting environment.
      Under that model existing approaches largely fail, which cuts both ways: it means published
      attack success rates overstate the threat, and that agents' true exposure is still unmeasured.
    summary_zh: >-
      直接质疑以往环境注入工作的真实性：多数研究隐含假定触发物在屏幕上的位置与周围视觉上下文在
      训练与测试之间大致保持一致，而这恰恰抹掉了真实网页内容的本质属性——它是在不断变化的。论文
      提出动态环境威胁模型：攻击者只是一个普通用户，触发物嵌在持续变化的环境之中。在该模型下现有
      方法大多失效，这个结论有两面含义：已发表的攻击成功率高估了威胁，而 agent 的真实暴露程度
      至今仍未被测准。

  - id: "2507.14799"
    title: "Manipulating LLM Web Agents with Indirect Prompt Injection Attack via HTML Accessibility Tree"
    abbr: "A11y Tree IPI"
    date: "2025-07"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Targets the accessibility tree specifically — the structured representation many web agents
      parse instead of raw HTML — and shows universal adversarial triggers can be embedded there to
      hijack behavior. The method is gradient-based rather than hand-crafted, using Greedy
      Coordinate Gradient against a BrowserGym agent on Llama-3.1, and reports high success on real
      websites for both targeted and general attacks including login credential exfiltration and
      forced ad clicks. Notably the accessibility tree is a channel added for inclusive design,
      so hardening it means weighing security against the users who depend on it.
    summary_zh: >-
      专门针对无障碍树（accessibility tree）——许多 web agent 解析的正是这一结构化表示而非原始
      HTML——并表明可以在其中嵌入通用对抗触发串来劫持 agent 行为。方法是基于梯度而非人工构造的，
      用 Greedy Coordinate Gradient 攻击基于 Llama-3.1 的 BrowserGym agent，在真实网站上对定向
      与通用攻击均报告高成功率，包括窃取登录凭据与强制广告点击。值得注意的是，无障碍树本是为
      包容性设计而增设的通道，因此对它做加固意味着要在安全与依赖它的用户之间权衡。

  - id: "2509.10723"
    title: "Dark Patterns Meet GUI Agents: LLM Agent Susceptibility to Manipulative Interfaces and the Role of Human Oversight"
    abbr: "Dark Patterns Meet GUI Agents"
    date: "2025-09"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      A two-phase study comparing agents, humans, and human-AI teams against 16 dark pattern types.
      Phase 1's finding is the sharper one: agents often fail to recognize dark patterns, and even
      when they do recognize them, they prioritize task completion over protective action — so
      awareness alone does not produce safety. Phase 2 shows humans and agents fail *differently*:
      humans through cognitive shortcuts and habitual compliance, agents through procedural blind
      spots. Human oversight improved avoidance but brought its own costs in attentional tunneling
      and cognitive load, so neither party covers the other's gaps cleanly.
    summary_zh: >-
      两阶段研究，比较 agent、人类参与者与人机协作团队面对 16 类暗黑模式时的表现。第一阶段的
      发现更为尖锐：agent 常常识别不出暗黑模式，而**即便识别出来，它也会把任务完成置于保护性
      行动之上**——因此「有意识」本身并不产生安全。第二阶段显示人与 agent 的失败方式**不同**：
      人类因认知捷径与习惯性顺从而中招，agent 则因流程性盲区而失守。人工监督确实改善了规避率，
      但带来了注意力隧道化与认知负荷的代价，因此双方都无法干净地补上对方的缺口。

  - id: "2607.25255"
    title: "SafeFlow: Semantic Information-Flow Control for Blocking Malicious Propagation in Multi-Agent Systems"
    abbr: "SafeFlow"
    date: "2026-07"
    venue: "arXiv"
    section: "0"
    env: [cross]
    summary: >-
      Identifies a blind spot created by the very mechanisms that make multi-agent systems capable:
      task decomposition and role specialization let a harmful objective be fragmented into
      locally plausible subtasks, so no single agent ever sees enough to detect malicious intent.
      The paper's central move is reframing this as a semantic information-flow problem rather than
      a single-turn prompt classification task — a category shift that explains why per-message
      filters cannot work. SafeFlow attaches structured semantic taints to root requests,
      propagates them along a dynamic collaboration graph, and validates at the workflow level.
    summary_zh: >-
      指出正是那些让多 agent 系统变强的机制造就了盲点：任务分解与角色专职化使一个有害目标可以被
      拆解成局部看来都合理的子任务，于是没有任何单个 agent 能看到足够信息来识别恶意意图。论文的
      关键一步是把这个问题重新框定为**语义信息流**问题、而非单轮 prompt 分类任务——这个范畴转换
      解释了为何逐条消息的过滤器注定无效。SafeFlow 为根请求附加结构化的语义污点标记，沿动态协作
      图传播，并在工作流层面做整体校验。

  - id: "2604.24348"
    title: "OS-SPEAR: A Toolkit for the Safety, Performance, Efficiency, and Robustness Analysis of OS Agents"
    abbr: "OS-SPEAR"
    date: "2026-04"
    venue: "arXiv"
    section: "3.4"
    env: [desktop]
    summary: >-
      Diagnoses three concrete defects in current OS-agent benchmarks — narrow safety scenarios,
      noisy trajectory labeling, and limited robustness metrics — and answers with a four-dimension
      toolkit spanning Safety, Performance, Efficiency and Robustness. The subsets are separately
      constructed rather than reweighted from one pool: a Safety subset covering both
      environment-induced and human-induced hazards, a Performance subset curated via trajectory
      value estimation and stratified sampling, and an Efficiency subset measuring through dual
      lenses. Treating safety as one of four coupled axes rather than a standalone score is the
      framing worth borrowing.
    summary_zh: >-
      诊断出当前 OS agent 基准的三个具体缺陷——安全场景狭窄、轨迹标注噪声大、鲁棒性指标有限——
      并以覆盖安全性、性能、效率、鲁棒性四个维度的工具包作答。各子集是分别构建而非从同一池中
      重新加权得来：安全子集同时覆盖环境诱发与人为诱发的危害，性能子集通过轨迹价值估计与分层
      采样策划，效率子集从双重视角度量。把安全作为四个耦合维度之一、而非一个独立分数来处理，
      这个框定方式值得借鉴。

  - id: "2605.07110"
    title: "Securing Computer-Use Agents: A Unified Architecture-Lifecycle Framework for Deployment-Grounded Reliability"
    abbr: "Architecture-Lifecycle Framework"
    date: "2026-05"
    venue: "arXiv"
    section: "0"
    env: [cross]
    summary: >-
      Argues that once CUAs leave bounded benchmarks for real browsers, desktops, mobile apps,
      filesystems, terminals and tool backends, task success stops being a meaningful reliability
      measure: perception errors, planning drift, memory use, tool mediation, permission scope and
      runtime oversight *jointly* decide whether actions stay aligned with user intent. Existing
      surveys organize the field by method, platform, benchmark or threat, but rarely connect
      capability formation to authority exposure to failure manifestation to control placement.
      This framework supplies that connection through an architectural view (Perception, Decision,
      Execution as coupled layers) plus a lifecycle view.
    summary_zh: >-
      论证当 CUA 走出受限基准、进入真实的浏览器、桌面、移动应用、文件系统、终端与工具后端之后，
      任务成功率就不再是有意义的可靠性度量：感知错误、规划漂移、记忆使用、工具中介、权限范围与
      运行时监督**共同**决定动作是否仍与用户意图对齐。现有综述按方法、平台、基准或威胁来组织
      这个领域，但很少把「能力形成 → 权限暴露 → 失效显现 → 控制点放置」这条链条串起来。本框架
      通过架构视角（把感知、决策、执行视为相互耦合的层）与生命周期视角提供了这一串联。

  - id: "2606.05233"
    title: "Domain-Conditioned Safety in Frontier Computer-Using Agents: A 793-Episode Browser Benchmark, a Coding-Domain Cross-Reference, and a Reproducibility Audit of Recent Red-Teaming"
    abbr: "CUA-HandCrafted"
    date: "2026-06"
    venue: "arXiv"
    section: "3.1"
    env: [desktop, web]
    summary: >-
      A rare reproducibility audit of this literature, and its finding is uncomfortable: recent CUA
      red-teaming papers report 42–98% ASR, but those headline numbers cluster on retired models and
      on whichever model in each paper's panel was most vulnerable. Reproducing the techniques as
      hand-crafted templates over 793 episodes (24 multi-step web tasks, 56 templates, 8 attack
      families, 4 system-prompt configs), the authors measure **0/140 multi-step success** against
      Claude Sonnet 4.6 and GPT-5.4, with resistance traced to model weights rather than prompting.
      But it does not generalize: the same weights fall to hand-crafted skill-injection at up to
      100% on a sister coding-agent benchmark. Safety here is domain-conditioned, and the field's
      high ASR figures owe more to RL-optimized injection text than to intrinsic fragility.
    summary_zh: >-
      本领域少见的**复现审计**，结论令人不安：近期 CUA 红队论文报告 42–98% 的攻击成功率，但这些
      抢眼数字集中出现在已退役模型、以及各篇论文所测模型中最脆弱的那一个上。作者把这些技术复现为
      人工模板，在 793 个 episode（24 个多步网页任务、56 个攻击模板、8 个攻击族、4 种 system
      prompt 配置）上测量，结果对 Claude Sonnet 4.6 与 GPT-5.4 取得 **0/140 的多步攻击成功率**，
      且消融实验显示这种抵抗力存在于模型权重而非 prompt。但它并不泛化：同样的权重在姊妹编码
      agent 基准上被人工 skill 注入攻破，成功率最高达 100%。安全性在这里是**领域条件化**的，
      而领域内那些偏高的 ASR 数字，更多归因于 RL 优化过的注入文本而非模型固有的脆弱。

  - id: "2609.05535"
    title: "Beyond the Verdict: Evidence-Aligned Evaluation of Visual Prompt-Injection Guardrails"
    abbr: "Mind2Web-Injection"
    date: "2026-09"
    venue: "arXiv"
    section: "3.1"
    env: [web]
    summary: >-
      Points out that verdict-only evaluation never reveals whether a VLM guardrail actually used the
      visual evidence that should support its decision — a detector can be right for the wrong
      reason and look identical on aggregate metrics. Mind2Web-Injection supplies 9,954
      instruction-screenshot pairs with instruction-relative labels, pixel-exact evidence boxes and
      matched image-side counterfactuals. The payoff is stark: two models with nearly identical
      average precision differ **ninefold** in Evidence-Aligned Detection. A causal probe that
      swaps in an instruction endorsing the cited command finds Qwen3-VL-32B, the strongest
      open-weight localizer, stays aligned only 58.7% of the time versus 99.9% for GPT-5.6-luna.
    summary_zh: >-
      指出只看判定结果的评测永远无法揭示 VLM 护栏是否真的用上了本应支撑其决策的视觉证据——一个
      检测器可能「因错误的理由给出正确答案」，而在汇总指标上看起来毫无差别。Mind2Web-Injection
      提供 9954 组指令-截图配对，带相对指令的标签、像素级精确的证据框，以及配对的图像侧反事实
      样本。收效相当惊人：两个平均精度几乎一致的模型，在「证据对齐检出率」（EAD）上相差**九倍**。
      一项因果探测把指令替换为「认可被引用命令」的版本后发现，最强的开源权重定位模型
      Qwen3-VL-32B 仅在 58.7% 的情形下保持对齐，而 GPT-5.6-luna 为 99.9%。

  - id: "2508.09057"
    title: "MVISU-Bench: Benchmarking Mobile Agents for Real-World Tasks by Multi-App, Vague, Interactive, Single-App and Unethical Instructions"
    abbr: "MVISU-Bench"
    date: "2025-08"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Derives its task taxonomy from user questionnaires rather than researcher intuition, yielding
      five categories — Multi-App, Vague, Interactive, Single-App and Unethical Instructions — across
      404 bilingual tasks on 137 real mobile applications. Two of those categories are squarely
      safety-relevant: unethical instructions test refusal, and vague instructions test whether the
      agent asks rather than guesses. The paper also ships Aider, a plug-and-play dynamic prompter
      that mitigates risk and clarifies user intent, improving overall success by 19.55% over the
      prior state of the art — a demonstration that asking for clarification and being capable are
      not in tension.
    summary_zh: >-
      任务分类法来自用户问卷而非研究者直觉，由此得出五个类别——多应用、模糊、交互式、单应用、
      不道德指令——覆盖 137 个真实移动应用上的 404 个双语任务。其中两个类别与安全直接相关：
      不道德指令检验拒答能力，模糊指令检验 agent 是否会**主动询问**而不是擅自猜测。论文同时
      发布 Aider，一个即插即用的动态 prompter，用于缓解风险并澄清用户意图，把总体成功率相比
      此前 SOTA 提升 19.55%——这说明「主动澄清」与「有能力」并不互相矛盾。

  - id: "2605.08876"
    title: "OTora: A Unified Red Teaming Framework for Reasoning-Level Denial-of-Service in LLM Agents"
    abbr: "OTora"
    date: "2026-05"
    venue: "arXiv"
    section: "1.7"
    env: [web, desktop]
    summary: >-
      Introduces an attack goal that most threat models overlook entirely: Reasoning-Level
      Denial-of-Service, where the attacker **preserves task correctness** yet degrades availability
      by inflating reasoning depth or tool-use budget. Because the output stays correct, every
      correctness-based defense and every output-inspecting guardrail reports normal operation.
      OTora is a two-stage framework — Stage I optimizes an adversarial trigger inducing targeted
      tool invocations via insertion-aware scoring and dynamic target co-evolution (black- and
      white-box), Stage II generates reasoning payloads through ICL-guided genetic search that
      amplifies overthinking while keeping outcomes correct — evaluated on WebShop, Email and OS
      agents over backbones including LLaMA-70B and GPT-OSS-120B.
    summary_zh: >-
      提出一个绝大多数威胁模型完全忽略的攻击目标：推理级拒绝服务（R-DoS）——攻击者**保持任务结果
      正确**，却通过膨胀 agent 的推理深度或工具调用预算来损害可用性。正因为输出依然正确，所有
      基于正确性的防御与所有检查输出的护栏都会报告「运行正常」。OTora 是两阶段框架：第一阶段用
      插入位置感知打分与动态目标共进化优化对抗触发串，诱导定向的工具调用（支持黑盒与白盒）；
      第二阶段通过 ICL 引导的遗传搜索生成推理载荷，在保持结果正确的同时放大「过度思考」。
      在 WebShop、Email 与 OS agent 上评测，骨干模型含 LLaMA-70B 与 GPT-OSS-120B。

  - id: "2603.18762"
    title: "ClawTrap: A MITM-Based Red-Teaming Framework for Real-World OpenClaw Security Evaluation"
    abbr: "ClawTrap"
    date: "2026-03"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Moves red-teaming down a layer: existing benchmarks concentrate on static sandbox settings and
      content-level prompt attacks, leaving the network layer — where a real deployment is actually
      exposed — untested. ClawTrap is a man-in-the-middle framework for evaluating agents such as
      OpenClaw under live network threats, supporting Static HTML Replacement, Iframe Popup
      Injection and Dynamic Content Modification, with a reproducible pipeline for rule-driven
      interception, transformation and auditing. The MITM vantage point matters because it does not
      require compromising any website the agent visits.
    summary_zh: >-
      把红队测试下移一层：现有基准集中在静态沙箱设定与内容级 prompt 攻击上，而**网络层**——真实
      部署实际暴露的那一层——从未被测试。ClawTrap 是中间人（MITM）框架，用于在真实网络威胁下评测
      OpenClaw 这类 agent，支持静态 HTML 替换、iframe 弹窗注入、动态内容修改三类攻击，并提供
      规则驱动的拦截、变换与审计的可复现流水线。MITM 这个位置之所以重要，是因为它**不需要攻陷
      agent 所访问的任何网站**。

  - id: "2509.21982"
    title: "RISK: A Framework for GUI Agents in E-commerce Risk Management"
    abbr: "RISK"
    date: "2025-09"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Addresses a domain where the agent is the defender rather than the target: e-commerce risk
      management requires aggregating deeply embedded web data through multi-step stateful
      interaction, which traditional scraping cannot do and most GUI agents — limited to single-step
      tasks on cooperative pages — cannot either. RISK contributes three pieces: RISK-Data with
      8,492 single-step and 2,386 multi-step trajectories collected via a high-fidelity browser
      framework, RISK-Bench with 802 single-step and 320 multi-step trajectories across three
      difficulty levels, and RISK-R1, an R1-style reinforcement fine-tuning framework.
    summary_zh: >-
      面向一个 agent 扮演防御方而非攻击目标的领域：电商风控需要通过多步、有状态的交互聚合深度
      嵌套的网页数据，这既非传统爬虫所能胜任，也超出大多数 GUI agent 的能力——后者通常局限于
      配合良好的页面上的单步任务。RISK 贡献三部分：RISK-Data，通过高保真浏览器框架采集的 8492 条
      单步与 2386 条多步交互轨迹；RISK-Bench，覆盖三个难度等级的 802 条单步与 320 条多步轨迹；
      以及 RISK-R1，一个 R1 风格的强化微调框架。

  - id: "2609.16732"
    title: "When Agents See Differently: Exposing UI Desynchronization Threats in Mobile Agents"
    abbr: "UI Desynchronization"
    date: "2026-09"
    venue: "arXiv"
    section: "1.2"
    env: [mobile]
    summary: >-
      Human oversight of mobile agents rests on an unstated premise: that user and agent observe
      consistent information from the same interface. This paper shows the premise is systematically
      violable. Users perceive interfaces through physical displays and the human visual system,
      subject to occlusion and luminance-contrast limits; agents consume digital screenshots that
      retain such content plus accessibility representations exposing nonvisual widget metadata.
      The same UI state can therefore carry materially different information to each party — termed
      human-agent UI desynchronization. The authors show a repackaged clone of a legitimate APK can
      exploit this to steer agents toward attacker-designated actions while remaining fully
      functional and behaviorally consistent for human users, with perturbations embedded before
      deployment and requiring no access to runtime instructions, agent detection, or online
      adaptation. Across five mobile-agent frameworks, three backbones, and 546 tasks: average
      misleading rates 77.9% (static) and 66.9% (dynamic). A questionnaire study with 186
      participants confirms the visual perturbations are hard for humans to notice.
    summary_zh: >-
      人类监督 mobile agent 依赖一个未被言明的前提：用户与 agent 从同一界面看到一致的信息。
      本文证明这个前提可被系统性打破。用户经由物理屏幕与人类视觉系统感知界面，受遮挡与亮度
      对比度限制；而 agent 消费的是数字截图，还额外拿到暴露非视觉控件元数据的无障碍表示。
      同一个 UI 状态因此向双方呈现实质不同的信息，作者称之为「人机 UI 失同步」。实验表明，
      重打包的合法 APK 克隆可以利用这一失同步把 agent 引向攻击者指定的动作，同时对人类用户
      保持功能与行为完全一致；扰动在部署前嵌入，无需获取运行时指令、无需检测 agent、无需在线
      适配。在五个 mobile agent 框架、三个主干模型、546 个任务上，静态与动态误导率分别为
      77.9% 与 66.9%。186 人的问卷研究进一步确认这些视觉扰动人眼难以察觉。

  - id: "2609.15134"
    title: "HazardAuditor: From Executable Threats to Safer Computer-Use Agents"
    abbr: "HazardAuditor"
    date: "2026-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop, web]
    summary: >-
      Identifies two gaps that keep guard models from covering computer-use agents: existing guards
      target static prompts and responses, ill-suited to agent execution; existing executable safety
      platforms emit evaluation verdicts rather than the normalized supervision a guard model needs
      to learn across heterogeneous frameworks. HazardAuditor closes both — its infrastructure runs
      Claude Code, Codex, Hermes, and OpenClaw in controlled environments and normalizes their
      interactions into a canonical event representation enabling cross-framework supervision. The
      authors further observe a structural mismatch: token-level post-training objectives let longer
      rationales dominate gradient updates in generative guards. Guard Policy Optimization (GuardPO)
      converts deterministic safety outcomes into sequence-level advantages and normalizes rationale
      versus verdict regions, making the safety decision the effective unit of optimization.
      Accuracy improves by up to 16.5 points over the strongest prior guard.
    summary_zh: >-
      指出护栏模型覆盖 computer-use agent 时的两处断层：现有护栏针对静态 prompt 与回复，
      不适配 agent 的执行过程；而现有可执行安全平台只产出评测判定，给不出护栏模型跨异构框架
      学习所需的规范化监督信号。HazardAuditor 同时补上两者——基础设施在受控环境中运行
      Claude Code、Codex、Hermes、OpenClaw，把它们的交互归一化为统一事件表示，从而支持
      跨框架监督。作者还发现一处结构性错配：token 级后训练目标会让更长的推理过程主导梯度更新。
      为此提出 Guard Policy Optimization（GuardPO），把确定性的安全结果转换为序列级优势，
      并对推理区与判定区分别归一化，使「安全决策」成为真正的优化单元。相比此前最强护栏，
      准确率最高提升 16.5 个百分点。

  - id: "2609.13873"
    title: "PriMobiBench: Characterizing Visual Privacy Leakage in VLM-Driven Mobile GUI Agents"
    abbr: "PriMobiBench"
    date: "2026-09"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Mobile GUI agents automate smartphone tasks by interpreting screenshot streams — a design that
      introduces serious and underexplored privacy risk, both direct leakage of on-screen sensitive
      information and unintended user profiling, with no standardized benchmark to quantify either.
      PriMobiBench is the first benchmark for visual privacy leakage and profiling in
      screenshot-driven mobile agents, providing a unified pipeline for data generation, trajectory
      construction, and multi-model evaluation, plus MobiLeak — execution traces from 16 apps
      covering 25 privacy attributes with 2,960 embedded privacy instances. Findings: VLMs extract
      sensitive information with up to 82.5% success, and infer user profiles from aggregated visual
      evidence at roughly 70%. A proposed mitigation masks privacy-sensitive but task-irrelevant UI
      elements before cloud processing, cutting profiling success by up to 58% at about 8%
      performance cost.
    summary_zh: >-
      移动 GUI agent 通过解读截图流自动化手机任务，这一设计带来严重但研究不足的隐私风险：
      既包括屏上敏感信息的直接泄露，也包括非预期的用户画像推断，而两者都缺少标准化基准来量化。
      PriMobiBench 是首个系统评测截图驱动移动 agent 的视觉隐私泄露与画像风险的基准，提供
      数据生成、轨迹构建与多模型评测的统一流水线，并附数据集 MobiLeak——来自 16 个应用的
      执行轨迹，覆盖 25 类隐私属性、2960 个嵌入的隐私实例。结果相当刺眼：VLM 直接提取敏感
      信息成功率最高 82.5%；即便没有显式泄露，也能从聚合的视觉证据中以约 70% 的成功率推断出
      用户画像。作者提出的缓解方案在上云前遮蔽「隐私敏感但与任务无关」的 UI 元素，可将画像
      成功率最多降低 58%，代价仅约 8% 的性能损失。

  - id: "2609.19843"
    title: "A Dual-Process Perspective on Nudge Susceptibility in LLM-Based GUI Agents"
    abbr: "Nudge Susceptibility"
    date: "2026-09"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      GUI agents act inside interfaces designed to support but also deliberately steer human
      decisions. Behavioural bias in LLM text output is well documented, but far less is known about
      how such influence operates once a model perceives an interface and executes decisions — and
      whether built-in reasoning makes agents more robust to it. Drawing on Dual-Process Theory, a
      randomized online-shopping experiment with 3,600 agents and 21,600 simulations across six
      frontier models from three providers finds agents vulnerable to both automatic (Type 1) and
      reflective (Type 2) digital nudges. Crucially, reasoning configuration moderates the two in
      **opposing** directions: it reduces susceptibility to automatic default nudges while
      heightening susceptibility to reflective social-influence nudges. Extensive reasoning
      therefore does not confer robustness — it redirects the route through which choice
      architecture takes effect, and that redirection is systematically structured by model scale.
    summary_zh: >-
      GUI agent 运行在专为「支持并有意引导人类决策」而设计的界面里。LLM 文本输出中的行为偏差
      已有大量记录，但当模型转为感知界面并执行决策时这种影响如何运作，以及日益内置的推理能力
      是否让 agent 更稳健，此前少有人知。本文基于双过程理论，在随机化的在线购物实验中用
      3600 个 agent、21600 次模拟、覆盖三家厂商的六个前沿模型，发现 agent 对自动型（Type 1）
      与反思型（Type 2）数字助推均易感。关键结论是推理配置对两者的调节方向**相反**：它降低了
      对自动型默认助推的易感性，却提高了对反思型社会影响助推的易感性。也就是说，充分推理并未
      带来稳健性，而是改变了选择架构生效的路径，且这一改变随模型规模系统性变化。作者据此主张，
      对于把决策委托给自主 agent 的组织，界面设计本身应被视为治理议题。

  - id: "2509.07553"
    title: "VeriOS: Query-Driven Proactive Human-Agent-GUI Interaction for Trustworthy OS Agents"
    abbr: "VeriOS"
    date: "2025-09"
    venue: "arXiv"
    section: "2.4"
    env: [mobile, desktop]
    summary: >-
      Most OS agents are built for idealized settings, while real environments routinely present
      untrustworthy conditions — so the failure mode to guard against is over-execution. Rather than
      adding an external filter, VeriOS makes "when to ask a human" a learned capability: a
      query-driven human-agent-GUI interaction framework in which the agent executes autonomously
      under normal conditions and proactively queries the user in untrustworthy scenarios.
      VeriOS-Agent is trained in three stages — supervised fine-tuning plus group relative policy
      optimization — designed to decouple meta-knowledge about trustworthiness from task knowledge
      so the two can be used independently. The framing matters for §2.4: confirmation is treated
      not as a fixed policy layer bolted on top, but as a decision the agent itself must learn to
      make selectively.
    summary_zh: >-
      多数 OS agent 是为理想化环境设计的，而真实环境常常并不可信——因此要防的失败模式是
      「过度执行」。VeriOS 没有外挂一层过滤器，而是把「何时该问人」变成一种可学习的能力：
      提出查询驱动的人-agent-GUI 交互框架，让 agent 在正常条件下自主执行、在不可信场景中
      主动向用户发问。VeriOS-Agent 采用三阶段训练（监督微调 + 组相对策略优化），目的是把
      关于「可信性」的元知识与任务知识解耦，使两者可以独立调用。这个设定对 §2.4 很有意义：
      确认机制不再是硬加在上层的固定策略，而是 agent 自己必须学会有选择地做出的决策。

  - id: "2510.07809"
    title: "Invisible to Humans, Triggered by Agents: Stealthy Jailbreak Attacks on Mobile Vision-Language Agents"
    abbr: "Agent-Only Perceptual Injection"
    date: "2025-10"
    venue: "arXiv"
    section: "1.2"
    env: [mobile]
    summary: >-
      Prior visual prompt injections against mobile agents rely on persistent visual manipulations
      that users would notice, or on system-level privileges. This work finds a cleaner trigger: a
      consistent discrepancy between human and agent interaction — automated agents generate
      near-zero contact touch signals. That signal becomes a discriminator, enabling agent-only
      perceptual injection, where malicious content is exposed solely during agent interaction and
      is not readily perceived by human users. To fit mobile UI constraints and one-shot interaction,
      the authors introduce HG-IDA*, a one-shot optimization method for constructing jailbreak
      prompts that evade LVLM safety filters. The mechanism is notable because it does not hide the
      payload from human vision — it withholds the payload until the toucher is provably not human.
    summary_zh: >-
      此前针对移动 agent 的视觉注入要么依赖用户能察觉的持续视觉篡改，要么需要系统级权限。
      本文找到一个更干净的触发条件：人与 agent 的交互存在稳定差异——自动化 agent 产生的
      接触式触摸信号近乎为零。这个信号被用作判别器，从而实现「仅对 agent 生效的感知注入」：
      恶意内容只在 agent 交互时暴露，人类用户则不易感知。为适配移动 UI 约束与一次性交互场景，
      作者提出 HG-IDA*，用单次优化构造可绕过 LVLM 安全过滤的越狱提示。这个机制的巧妙之处在于
      它不是把载荷藏起来不让人看见，而是在证明「触摸者不是人」之前根本不投放载荷。

  - id: "2601.08406"
    title: "WebTrap Park: An Automated Platform for Systematic Security Evaluation of Web Agents"
    abbr: "WebTrap Park"
    date: "2026-01"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Web agent security evaluation remains fragmented and hard to standardize. WebTrap Park is an
      automated platform that evaluates through direct observation of an agent's concrete
      interactions with live web pages, instantiating three major sources of security risk into
      1,226 executable tasks. Assessment is action-based and requires no modification to the agent
      under test — which is what makes it applicable to closed frameworks. The headline finding is
      about architecture rather than models: security differs clearly across agent frameworks, so
      framework design matters beyond the underlying model choice. Publicly hosted, which makes it
      usable as a reproducible baseline rather than a one-off evaluation.
    summary_zh: >-
      web agent 的安全评测长期碎片化、难以标准化。WebTrap Park 是一个自动化平台，通过直接
      观察 agent 与真实网页的具体交互来评测，把三大类安全风险来源实例化为 1226 个可执行任务。
      评测基于动作而非文本输出，且**无需修改被测 agent**——这正是它能用于闭源框架的原因。
      最值得注意的结论与架构而非模型有关：不同 agent 框架之间的安全性差异明显，说明框架设计
      的影响超出了底层模型的选择。平台已公开托管，因此可作为可复现的基线而非一次性评测。

  - id: "2602.10915"
    title: "Blind Gods and Broken Screens: Architecting a Secure, Intent-Centric Mobile Agent Operating System"
    abbr: "Aura"
    date: "2026-02"
    venue: "arXiv"
    section: "2.6"
    env: [mobile]
    summary: >-
      Argues that the prevailing "Screen-as-Interface" paradigm is the root cause rather than a
      detail: by driving agents off unstructured visual data, it inherits the screen's structural
      vulnerabilities and also conflicts with the mobile ecosystem's economic foundations. A
      systematic security analysis of a deployed commercial assistant decomposes the threat
      landscape into four dimensions — Agent Identity, External Interface, Internal Reasoning,
      Action Execution — surfacing fake app identity, visual spoofing, indirect prompt injection,
      and unauthorized privilege escalation, all traced back to that same reliance on unstructured
      pixels. The proposed answer is clean-slate: Aura, an Agent Universal Runtime Architecture that
      replaces brittle GUI scraping with an intent-centric interface, so security properties come
      from the architecture instead of from patching the perception layer.
    summary_zh: >-
      本文主张当前主流的「屏幕即接口」范式本身就是病根而非细节：让 agent 依赖非结构化的视觉
      数据，既继承了屏幕固有的结构性脆弱性，也与移动生态的经济基础相冲突。作者以一款已上线的
      商用助手为案例做系统性安全分析，把威胁面拆为 Agent 身份、外部接口、内部推理、动作执行
      四个维度，暴露出伪造应用身份、视觉欺骗、间接提示注入、越权提权等缺陷，并且都可追溯到
      同一个根源——对非结构化像素的依赖。给出的答案是推倒重来：提出 Aura（Agent 通用运行时
      架构），用以意图为中心的接口取代脆弱的 GUI 抓取，使安全性来自架构本身，而不是靠给感知层
      打补丁。

  - id: "2608.04530"
    title: "FocusMem: Factorizing Content, Readout, and Trust in Latent GUI Memory"
    abbr: "FocusMem"
    date: "2026-08"
    venue: "arXiv"
    section: "2.1"
    env: [mobile, desktop, web]
    summary: >-
      Latent memory compresses multimodal GUI trajectories into a few continuous tokens, but existing
      methods map each trajectory to one fixed block trained mainly by next-action supervision. Three
      problems follow: detail is lost in compression, one block must serve every decision stage, and
      irrelevant retrieved trajectories can still mislead the agent. FocusMem factorizes these
      responsibilities — a role-aware content basis pushes episodic memory toward reusable experience
      and working memory toward current task progress; a state-conditioned readout produces a
      decision-specific view of the same stored evidence; and a lightweight trust gate can suppress
      memory when retrieval is unreliable. That last component is why this belongs on a security
      list: it treats retrieved memory as untrusted input requiring gating, which is the structural
      defense against memory-poisoning style manipulation.
    summary_zh: >-
      潜在记忆把多模态 GUI 轨迹压缩成少量连续 token，但现有方法把每条轨迹映射到一个固定
      记忆块，且主要靠下一动作监督来训练。由此带来三个实际问题：压缩过程中细节丢失、同一个
      记忆块要服务所有决策阶段、检索到不相关的轨迹仍会误导 agent。FocusMem 把这些职责拆开：
      角色感知的内容基底促使情景记忆保留可复用经验、工作记忆保留当前任务进展；状态条件化的
      读出机制为同一份存储证据生成面向具体决策的视图；轻量的信任门可在检索不可靠时抑制记忆。
      最后这一项正是它进入安全清单的理由——它把检索到的记忆当作需要设门的不可信输入，
      而这正是对抗记忆投毒式操纵的结构性防御。

  - id: "2510.03485"
    title: "Learning Efficient Guardrails for Compliance"
    abbr: "PolicyGuard"
    date: "2025-10"
    venue: "arXiv"
    section: "2.2"
    env: [web]
    summary: >-
      Compared with standard safety objectives, whether long-horizon web agents actually adhere to
      real-world policies is critically underexplored. PolicyGuardBench addresses this with 60k
      policy-trajectory pairs and — importantly — evaluates not only full-trajectory violation
      detection but a novel prefix-based variant, i.e. catching a violation before the trajectory
      finishes. On that data the authors train PolicyGuard, a lightweight guardrail achieving strong
      detection accuracy at high inference efficiency, and preserving performance on unseen domains.
      The relevant conclusion for deployment is the scale claim: accurate and generalizable
      compliance guardrails are feasible at small model sizes, so pre-execution policy checking need
      not carry frontier-model cost.
    summary_zh: >-
      相比标准的安全目标，长周期 web agent 是否真的遵守现实世界的策略规范，此前研究严重不足。
      PolicyGuardBench 用 6 万条策略-轨迹配对填补这一空缺，且关键在于它不只评测全轨迹违规
      检测，还提出了基于前缀的检测任务——即在轨迹尚未结束时就抓到违规。作者在此数据上训练
      轻量护栏 PolicyGuard，在保持高推理效率的同时取得较强检测准确率，并在未见领域上仍能
      维持性能。对落地最有价值的结论是关于规模的：准确且可泛化的合规护栏在小模型上就能实现，
      因此执行前的策略检查不必承担前沿模型的成本。

  - id: "2609.02057"
    title: "Monitoring Web Agents Without Internal Signals: Observable Trajectories and Key-Step Supervision"
    abbr: "Key-Step Supervision"
    date: "2026-09"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Reliable monitoring becomes hard precisely where it is most needed in practice: behind closed
      APIs, where model-internal signals such as token logits are unavailable. This work studies
      prefix-level risk prediction from observable signals only — given an evolving prefix, estimate
      whether execution is still on track. Two representations are derived: Macro features summarize
      cross-step agent-environment behavior and feedback; Micro features measure consistency among
      intention, action, and anticipated state change via repeated black-box queries. The
      supervision design is the notable part: instead of inheriting the final outcome label, the
      authors label the first uncorrected critical error associated with eventual failure as a
      key-step boundary, which preserves valid early prefixes of failed trajectories as on track —
      avoiding the label noise that makes naive outcome-based monitors fire too late or too often.
    summary_zh: >-
      可靠监控恰恰在最需要它的地方最难做：闭源 API 背后拿不到 token logit 这类模型内部信号。
      本文研究仅凭可观测信号做前缀级风险预测——给定一段正在演进的执行前缀，判断当前是否仍在
      正轨上。作者导出两类表示：Macro 特征刻画跨步的 agent-环境行为与反馈；Micro 特征通过
      重复黑盒查询衡量意图、动作、预期状态变化三者的一致性。真正巧妙的是监督信号的设计：
      不直接继承最终结果标签，而是把「在后续观测中未被纠正、且与最终失败相关的第一个关键错误」
      标为关键步边界，从而把失败轨迹中仍然有效的早期前缀保留为「正轨」——这避免了朴素的
      结果标签带来的噪声，后者会让监控器要么报得太晚、要么频繁误报。

  - id: "2509.21782"
    title: "Benchmarking MLLM-based Web Understanding: Reasoning, Robustness and Safety"
    abbr: "WebRRSBench"
    date: "2025-09"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      MLLMs increasingly serve as the reasoning engine behind GUI agents and front-end automation,
      which must interpret page structure, select actionable widgets, and execute multi-step
      interactions reliably. Existing benchmarks, however, mostly measure visual perception or UI
      code generation, leaving reasoning, robustness, and safety under-evaluated for end-to-end web
      applications. WebRRSBench evaluates all three jointly across eight tasks — including position
      relationship reasoning, color robustness, and safety-critical detection — built from 729
      websites with 3,799 QA pairs probing multi-step inference over page structure, text, widgets,
      and safety-critical interactions. Its value on this list is the coupling: it measures safety in
      the same harness as the perception and reasoning capabilities that safety depends on, rather
      than as a detached score.
    summary_zh: >-
      MLLM 越来越多地充当 GUI agent 与前端自动化背后的推理引擎，需要理解页面结构、选择可操作
      控件、可靠执行多步交互。但现有基准大多只衡量视觉感知或 UI 代码生成，对端到端 web 应用
      所需的推理、鲁棒性与安全能力评测不足。WebRRSBench 在八项任务上联合评测这三者，涵盖
      位置关系推理、颜色鲁棒性、安全关键检测等，数据取自 729 个网站、含 3799 个 QA 对，
      考察对页面结构、文本、控件以及安全关键交互的多步推断。它在本清单中的价值在于「耦合」：
      安全性与它所依赖的感知、推理能力放在同一套评测框架里衡量，而不是作为一个脱离上下文的
      独立分数。

  - id: "2606.23449"
    title: "AOHP: An Open-Source OS-Level Agent Harness for Personalized, Efficient and Secure Interaction"
    abbr: "AOHP"
    date: "2026-06"
    venue: "arXiv"
    section: "2.6"
    env: [mobile]
    summary: >-
      End-user operating systems are designed for application-centric workflows and offer little
      native support for AI agents; running agents on top of them therefore incurs execution
      overhead and safety risk. Agent-native OS designs are emerging, but the community lacks an
      open testbed for exploring which architectural primitives agent-mediated interaction actually
      needs. AOHP (Android Open Harness Project) is an OS-level agent harness built on AOSP whose
      core design principle is to treat agents as first-class OS actors, enabling adaptive user
      interfaces and agent-friendly runtime environments. Included here because it makes the
      security question structural rather than behavioral: it provides the substrate on which
      OS-level isolation and permission primitives for GUI agents can be prototyped and compared,
      instead of retrofitting guards onto the screen-scraping paradigm.
    summary_zh: >-
      面向终端用户的操作系统是为「以应用为中心」的工作流设计的，对 AI agent 几乎没有原生支持；
      因此在传统系统上跑 agent 会带来执行开销与安全风险。agent 原生操作系统的概念正在出现，
      但社区缺少一个开放测试平台，来探索 agent 中介的交互究竟需要哪些架构原语。AOHP
      （Android Open Harness Project）是基于 AOSP 构建的 OS 级 agent harness，核心设计原则是
      把 agent 当作一等的 OS 参与者，从而支持自适应用户界面与 agent 友好的运行时环境。收录
      于此是因为它把安全问题从行为层面推到了结构层面：它提供了一个基底，可以在其上原型化并
      对比面向 GUI agent 的 OS 级隔离与权限原语，而不是给「屏幕抓取」范式事后加装护栏。

  - id: "2609.27273"
    title: "CAVEAT: Towards Robust Computer-Use Agents in Incentive-Misaligned Environments"
    abbr: "CAVEAT"
    date: "2026-09"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      What happens when the environments a computer-use agent operates in have incentives
      that do not align with the user's? In online marketplaces, platforms may favour some
      products over others and steer agents away from the user's objective. CAVEAT is a
      controlled benchmark spanning nine marketplace environments with a taxonomy of eight
      common steering mechanisms. Across five model families, agents purchase the
      user-optimal product in 78.6% of matched-control episodes but only 17.3% when steering
      mechanisms are enabled. Larger models and more reasoning improve robustness, but
      substantial failures persist. Trajectory analysis and targeted ablations locate three
      points where steering enters the decision process: agents distort the user's priorities,
      prematurely narrow the alternatives they consider, and commit before resolving
      decision-relevant evidence. CAVEAT-Harness targets these failure modes directly and
      raises user-optimal purchasing by 55.0%, with targeted post-training further improving
      a smaller open model.
    summary_zh: >-
      当 agent 所处的环境自身与用户利益不一致时会发生什么？在在线市场里，平台可能偏好某些
      商品，从而把 agent 带离用户的目标。本文提出 CAVEAT：覆盖九个市场环境的受控基准，并给出
      八类常见「引导机制」的分类。在五个模型族上，agent 在对照条件下有 78.6% 买到用户最优商品，
      而开启引导机制后只剩 17.3%。更大的模型与更多推理能提升稳健性，但失效仍大量存在。轨迹分析
      与定向消融定位出引导进入决策的三个位置：扭曲用户的优先级、过早收窄所考虑的候选集、以及在
      决策相关证据尚未澄清时就提交。据此构建的 CAVEAT-Harness 直接针对这三种失效模式，把用户
      最优购买率提升 55.0%，定向后训练还能进一步提升较小的开源模型。

  - id: "2609.22724"
    title: "MATE: Policy-Aware Security Auditing for Mobile Agents via Synthesis-Driven Trajectory Learning"
    abbr: "MATE"
    date: "2026-09"
    venue: "USENIX Security 2026"
    section: "2.3"
    env: [mobile]
    summary: >-
      Mobile agents now automate complex multi-step workflows on real devices, but their
      trajectories can violate app-specific security policies. Existing trajectory-level
      defenses rely on LLM prompting or rigid rules and therefore cannot support fine-grained,
      natural-language policies that generalize across apps and tasks. MATE is a lightweight,
      policy-conditioned auditor that encodes both the trajectory and the natural-language
      policy to decide whether a trajectory violates it and to explain why. Treating policies
      as editable text rather than fixed model parameters lets MATE handle user-defined and
      evolving requirements without retraining. Training data comes from a knowledge base
      extracted from hundreds of popular mobile apps worldwide plus over 140K synthesized
      policy-conditioned trajectories. MATEBench adds two synthetic subsets and one real-world
      subset of manually collected trajectories. Trained models exceed 95% accuracy on
      MATEBench and when auditing real-device trajectories from AutoGLM and Mobile-Agent,
      outperforming prior methods by over 20%.
    summary_zh: >-
      移动 agent 已能在真实设备上自动化复杂的多步工作流，但其轨迹可能违反具体应用的安全策略。
      已有的轨迹级防御要么依赖 LLM 提示、要么依赖硬规则，无法支持细粒度、可跨应用与任务泛化的
      自然语言策略。MATE 是一个轻量的、以策略为条件的审计器，同时编码轨迹与自然语言策略，判断
      轨迹是否违规并解释原因。把策略当作可编辑文本而非固定的模型参数，使 MATE 无需重训即可应对
      用户自定义与不断变化的要求。训练数据来自从全球数百个热门移动应用中抽取的知识库，以及用
      多阶段流程合成的 14 万条以上语义真实的策略条件轨迹。配套的 MATEBench 含两个合成子集与
      一个人工采集的真实子集。训练出的模型在 MATEBench 上准确率超过 95%，在真实设备上审计
      AutoGLM 与 Mobile-Agent 的轨迹同样超过 95%，比此前方法高出 20 个百分点以上。

  - id: "2506.17318"
    title: "Context manipulation attacks : Web agents are susceptible to corrupted memory"
    abbr: "Plan Injection"
    date: "2025-06"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      Because LLMs are stateless, autonomous web navigation agents depend on external memory
      to maintain context across interactions — and that memory is often managed client-side
      or by third-party applications rather than securely on a server, a gap already exploited
      against production systems. The paper introduces and formalizes "plan injection", a
      context manipulation attack that corrupts the agent's internal task representation
      instead of its prompt. Evaluated on two popular web agents, Browser-use and Agent-E,
      plan injections bypass robust prompt injection defenses and reach up to 3x the attack
      success rate of comparable prompt-based attacks. A further variant, "context-chained
      injections", builds logical bridges between the legitimate user goal and the attacker's
      objective and raises success rates by 17.7% on privacy exfiltration tasks. The authors
      conclude that secure memory handling must become a first-class concern in agentic systems.
    summary_zh: >-
      由于 LLM 本身无状态，自主网页导航 agent 必须依赖外部记忆来维持跨交互的上下文，而这些记忆
      往往由客户端或第三方应用管理，并不像中心化系统那样安全地存放在服务端 —— 这条缝隙已经被
      用于攻击生产系统。本文提出并形式化「plan injection」：一种不攻击提示词、而是污染 agent
      内部任务表示的上下文操纵攻击。在两个主流 web agent（Browser-use 与 Agent-E）上的系统评测
      显示，plan injection 能绕过已有的健壮提示注入防御，攻击成功率最高达到同类提示攻击的 3 倍。
      进一步的「上下文链式注入」在合法用户目标与攻击者目标之间搭起逻辑桥梁，使隐私窃取类任务的
      成功率再提高 17.7%。作者据此强调，安全的记忆处理必须成为 agent 系统的一等公民。

  - id: "2505.21936"
    title: "RedTeamCUA: Realistic Adversarial Testing of Computer-Use Agents in Hybrid Web-OS Environments"
    abbr: "RedTeamCUA"
    date: "2025-05"
    venue: "ICLR 2026"
    section: "3.1"
    env: [cross]
    summary: >-
      Evaluations of indirect prompt injection against computer-use agents either lack
      realistic but controlled environments or ignore hybrid web-OS attack scenarios that span
      both interfaces. RedTeamCUA is an adversarial testing framework built around a hybrid
      sandbox that integrates a VM-based OS environment with Docker-based web platforms. It
      supports flexible adversarial scenario configuration and can initialize tests directly
      at the point of injection, decoupling adversarial evaluation from the navigational
      limitations of the agent. On this basis the authors build RTC-Bench with 864 examples of
      realistic hybrid web-OS attacks. Benchmarking frontier CUAs shows large vulnerabilities:
      Claude 3.7 Sonnet | CUA reaches 42.9% attack success rate while the most secure, Operator,
      still shows 7.6%. Attempt rates run as high as 92.5% — agents often try to execute
      adversarial tasks and fail only because of capability limits — and in realistic
      end-to-end settings the strongest current model, Claude 4.5 Sonnet | CUA, exhibits a
      60% attack success rate.
    summary_zh: >-
      对计算机使用代理的间接提示注入评估，要么缺少真实且可控的环境，要么忽略同时横跨操作系统与
      网页界面的混合攻击场景。RedTeamCUA 用一个混合沙箱补上这块：把基于虚拟机的操作系统环境与
      基于 Docker 的网页平台整合在一起。它支持灵活的对抗场景配置，并能直接在注入点初始化测试，
      从而把对抗评估与 agent 自身的导航能力限制解耦。在此基础上作者构建了含 864 个样例的
      RTC-Bench，覆盖真实的混合 web-OS 攻击场景与基础性安全漏洞。对前沿 CUA 的评测显示脆弱性
      相当严重：Claude 3.7 Sonnet | CUA 攻击成功率 42.9%，最安全的 Operator 仍有 7.6%；agent
      的「尝试率」高达 92.5% —— 它们常常已经开始执行对抗任务，只是因为能力不足才失败；而在真实的
      端到端场景中，当前最强的 Claude 4.5 Sonnet | CUA 攻击成功率达 60%。

  - id: "2505.10924"
    title: "A Survey on the Safety and Security Threats of Computer-Using Agents: JARVIS or Ultron?"
    abbr: "JARVIS or Ultron?"
    date: "2025-05"
    venue: "ACL 2026"
    section: "0"
    env: [cross]
    summary: >-
      A systematization of knowledge on the safety and security threats of computer-using
      agents (CUAs), which autonomously navigate desktop applications, web pages and mobile
      apps. The authors conduct a comprehensive literature review organized around four
      objectives: defining the CUA that suits safety analysis, categorizing current safety
      threats, proposing a comprehensive taxonomy of defensive strategies, and summarizing the
      benchmarks, datasets and evaluation metrics used to assess CUA safety and performance.
      Vulnerabilities in LLM-driven reasoning, compounded by the integration of multiple
      software components and multimodal inputs, make this security landscape considerably
      broader than what LLM safety work alone addresses. The survey gives researchers a
      structured foundation for exploring unexplored vulnerabilities and offers practitioners
      actionable guidance for designing and deploying secure CUAs.
    summary_zh: >-
      本文对计算机使用代理（CUA）的安全与安保威胁做系统化梳理 —— 这类 agent 能自主操作桌面
      应用、网页与移动应用。作者围绕四个目标组织了一轮全面的文献综述：给出适合安全分析的 CUA
      定义、对当前安全威胁进行分类、提出防御策略的完整分类体系、以及汇总用于评估 CUA 安全性与
      性能的基准、数据集与评测指标。LLM 驱动推理本身的脆弱性，叠加多软件组件整合与多模态输入
      带来的复杂度，使这一安全图景远比纯 LLM 安全研究所覆盖的范围更广。综述为研究者提供探索
      未知漏洞的结构化基础，也为实践者给出设计与部署安全 CUA 的可操作建议。

  - id: "2505.12981"
    title: "From Assistants to Adversaries: Exploring the Security Risks of Mobile LLM Agents"
    abbr: "AgentScan"
    date: "2025-05"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      The first comprehensive security analysis of mobile LLM agents, covering three
      representative categories: system-level OEM assistants (e.g. YOYO Assistant), third-party
      universal agents (e.g. AutoGLM) and emerging agent frameworks (e.g. Mobile Agent). After
      analyzing the general agent workflow, the authors identify security threats across three
      core capability dimensions — language-based reasoning, GUI-based interaction and
      system-level execution — yielding 11 distinct attack surfaces rooted in the unique
      capabilities and interaction patterns of mobile agents and spanning their entire
      operational lifecycle. AgentScan is a semi-automated security analysis framework that
      evaluates agents across all 11 scenarios; applied to nine widely deployed agents, every
      one proves vulnerable to targeted attacks, with the worst cases exposed on eight distinct
      vectors. Consequences include behavioural deviation, privacy leakage and full execution
      hijacking. Disclosures have received positive feedback from two major device vendors.
    summary_zh: >-
      本文首次对移动 LLM agent 做全面安全分析，覆盖三类代表性形态：厂商的系统级 AI 助手
      （如 YOYO Assistant）、第三方通用 agent（如 AutoGLM）与新兴 agent 框架（如 Mobile Agent）。
      作者先梳理移动 agent 的通用工作流，再沿语言推理、GUI 交互、系统执行三个核心能力维度识别
      安全威胁，最终归纳出 11 个不同的攻击面 —— 它们都根植于移动 agent 独有的能力与交互模式，
      并贯穿其完整运行生命周期。配套的半自动分析框架 AgentScan 在这 11 个场景上系统评估 agent，
      对九个广泛部署的 agent 的实测结果是：每一个都存在可被利用的漏洞，最严重的在八个不同攻击
      向量上同时失守。后果包括行为偏离、隐私泄露乃至完整的执行劫持，相关披露已获两家主要设备
      厂商的正面回应。

  - id: "2508.19493"
    title: "Mind the Third Eye! Benchmarking Privacy Awareness in MLLM-powered Smartphone Agents"
    abbr: "SAPA-Bench"
    date: "2025-08"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Smartphone agents are granted substantial access to sensitive personal information while
      automating tasks. This paper presents the first large-scale benchmark of privacy awareness
      in MLLM-powered smartphone agents: 7,138 scenarios, each annotated with the privacy
      context's type (e.g. account credentials), sensitivity level and location. Seven mainstream
      agents are evaluated, and almost all show unsatisfying privacy awareness — performance
      stays below 60% even with explicit hints. Closed-source agents do better than open-source
      ones, with Gemini 2.0-flash achieving the best result at 67%. Detection capability tracks
      the annotated sensitivity level, meaning more sensitive scenarios are typically more
      identifiable. The authors hope the findings prompt the community to rethink the unbalanced
      utility-privacy tradeoff in smartphone agents.
    summary_zh: >-
      手机在带来便利的同时，也让设备得以大量记录各类个人信息；而智能手机 agent 在执行任务时被
      授予了对这些敏感信息的相当大访问权。本文提出首个面向多模态大模型智能手机 agent 隐私意识的
      大规模基准，含 7138 个场景，并对每个场景中的隐私上下文标注类型（如账户凭证）、敏感度等级
      与出现位置。对七个主流 agent 的评测显示，几乎所有 agent 的隐私意识都难以令人满意 —— 即便
      给出明确提示，表现仍低于 60%。闭源 agent 整体优于开源，Gemini 2.0-flash 以 67% 最佳。
      agent 的隐私识别能力与场景敏感度高度相关：越敏感的场景反而越容易被识别出来。作者希望这些
      结果能促使社区重新审视手机 agent 上效用与隐私之间的失衡。

  - id: "2510.15455"
    title: "CORE: Reducing UI Exposure in Mobile Agents via Collaboration Between Cloud and Local LLMs"
    abbr: "CORE"
    date: "2025-10"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Cloud-based LLMs give mobile agents high task accuracy but require uploading the full UI
      state at every step, exposing unnecessary and often irrelevant information; local LLMs
      avoid uploads but suffer from limited capacity and lower success rates. CORE is a
      collaborative framework that reduces UI exposure while maintaining accuracy, with three
      components: layout-aware block partitioning that groups semantically related UI elements
      using the XML screen hierarchy; co-planning, where local and cloud LLMs jointly identify
      the current sub-task; and co-decision-making, where the local LLM ranks relevant UI blocks
      and the cloud LLM selects specific elements within the top-ranked block. A multi-round
      accumulation mechanism mitigates local misjudgement and limited context. Across diverse
      apps and tasks, CORE cuts UI exposure by up to 55.6% while keeping task success only
      slightly below cloud-only agents.
    summary_zh: >-
      云端 LLM 让移动 agent 任务准确率高，但每一步都要上传完整 UI 状态，暴露大量不必要且常常
      无关的信息；本地 LLM 避免了上传，却受限于能力不足、任务成功率偏低。CORE 是一个兼顾两者的
      协同框架，用三个组件减少 UI 暴露：基于 XML 屏幕层级的布局感知分块，把语义相关的 UI 元素
      分组；协同规划，由本地与云端 LLM 共同确定当前子任务；协同决策，本地 LLM 对相关 UI 块排序，
      云端 LLM 只在排名最高的块内选择具体元素。多轮累积机制用于缓解本地误判与上下文受限。在多个
      应用与任务上，CORE 把 UI 暴露减少最多 55.6%，而任务成功率仅略低于纯云端方案，实质降低了
      不必要的隐私外泄。

  - id: "2511.19477"
    title: "Building Browser Agents: Architecture, Security, and Practical Solutions"
    abbr: "Building Browser Agents"
    date: "2025-11"
    venue: "arXiv"
    section: "2.6"
    env: [web]
    summary: >-
      Findings from building and operating a production browser agent. The central argument is
      that model capability does not limit agent performance — architectural decisions determine
      success or failure. Security analysis of real-world incidents shows that prompt injection
      makes general-purpose autonomous operation fundamentally unsafe, so the paper argues
      against developing general browsing intelligence in favour of specialized tools with
      programmatic constraints, where safety boundaries are enforced through code instead of
      LLM reasoning. The implementation combines hybrid context management (accessibility tree
      snapshots plus selective vision), comprehensive browser tooling matching human interaction
      capabilities, and intelligent prompt engineering, reaching about 85% success on the
      WebGames benchmark across 53 diverse challenges, versus roughly 50% reported for prior
      browser agents and a 95.7% human baseline.
    summary_zh: >-
      本文给出一个生产级浏览器 agent 的搭建与运营经验。核心判断是：限制 agent 表现的并不是模型
      能力，而是架构决策。对真实事件的安全分析表明，提示注入使得「通用自主浏览」在根本上就是不
      安全的，因此作者反对继续追求通用浏览智能，主张转向带程序化约束的专用工具 —— 把安全边界用
      代码来强制，而不是交给 LLM 推理。实现上结合了混合上下文管理（可访问性树快照配合选择性视觉
      输入）、贴近人类交互能力的完整浏览器工具链与精细的提示工程，在 WebGames 的 53 个多样化挑战
      上达到约 85% 成功率（此前浏览器 agent 约 50%，人类基线 95.7%）。

  - id: "2605.05509"
    title: "WAAA! Web Adversaries Against Agentic Browsers"
    abbr: "WAAA"
    date: "2026-05"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Prior work on agentic browser security focuses exclusively on indirect prompt injection,
      leaving a blind spot for traditional web attacks and web social engineering originally
      designed to trick humans. This paper proposes the first web-focused threat model for
      agentic browsers, extending the original See->Act browser agent model to account for all
      browser components and framing the agent as a confused deputy unable to distinguish task
      steps from traditional web attacks. It derives a taxonomy of 20 attacks across the web and
      LLM space and implements 18 of them, showing that 10 web threats reemerge — often in
      amplified forms — once an agent can be influenced by untrusted page content. A
      generalizability study over 14 of the 20 attacks shows they reproduce across four major
      LLM models from multiple vendors, and the authors identify five major failure modes of
      agentic browsers facing traditional and LLM web threats.
    summary_zh: >-
      此前关于 agentic 浏览器安全的研究只盯着间接提示注入，对传统 web 攻击以及原本用来欺骗人类的
      网页社工手段存在盲区。本文提出首个面向 web 的 agentic 浏览器威胁模型：把原有的 See→Act
      浏览器 agent 模型扩展到浏览器的全部组件，并将 agent 刻画为一个无法区分任务步骤与传统 web
      攻击的「混淆代理人」。据此导出横跨 web 与 LLM 两个空间的 20 类攻击并实现其中 18 类，证明
      只要 agent 会受不可信页面内容影响，就有 10 类 web 威胁会以更强化的形态重现。对 14 类攻击
      的泛化实验显示它们能在多家厂商的四个主流模型上复现，作者并归纳出 agentic 浏览器面对传统
      与 LLM web 威胁时的五种主要失效模式，指出现有架构必须重构才能应对当下的 web。
  - id: "2505.11717"
    title: "WebInject: Prompt Injection Attack to Web Agents"
    abbr: "WebInject"
    date: "2025-05"
    venue: "EMNLP 2025"
    section: "1.2"
    env: [web]
    summary: >-
      MLLM-based web agents generate actions from screenshots of webpages. WebInject is a
      prompt injection attack that manipulates the webpage environment rather than any text
      channel: it adds a perturbation to the raw pixel values of the rendered page, and once
      those perturbed pixels are mapped into a screenshot the agent is induced to perform an
      attacker-specified action. Finding the perturbation is formulated as an optimization
      problem, whose key difficulty is that the mapping from raw pixel values to screenshot is
      non-differentiable, blocking gradient backpropagation. The authors train a neural network
      to approximate the mapping and apply projected gradient descent to the reformulated
      problem. Extensive evaluation across multiple datasets shows WebInject is highly effective
      and significantly outperforms baselines.
    summary_zh: >-
      基于多模态大模型的 web agent 是依据网页截图来生成动作的。WebInject 换了一条攻击路径：
      它不碰任何文本通道，而是直接操纵渲染网页 —— 对页面的原始像素值施加扰动，这些像素被映射
      进截图之后，就能诱导 agent 执行攻击者指定的动作。作者把寻找扰动形式化为一个优化问题，
      核心难点在于原始像素值到截图的映射不可微，梯度无法回传；解决办法是训练一个神经网络来近似
      该映射，再对重构后的问题使用投影梯度下降。在多个数据集上的大量评测表明，WebInject 非常
      有效，显著优于已有基线方法。

  - id: "2609.22178"
    title: "Beyond Task Completion: Training Capable and Safe Computer-Use Agents"
    abbr: "SCOPE"
    date: "2026-08"
    venue: "arXiv"
    section: "2.2"
    env: [cross]
    summary: >-
      Post-training centered on task success alone does not induce reliable safety behaviour.
      A reliable CUA must condition execution on risk: complete ordinary benign tasks, avoid
      environmental hazards and continue when a safe completion path remains, and refuse when
      the goal is harmful or no safe path exists. SCOPE jointly post-trains a CUA for
      task-execution capability and safety-aware decision making; SCOPE-Gen synthesizes
      verifiable capability tasks and converts them into paired environment-risk variants that
      preserve the original goal, yielding the SATraj-OS trajectory dataset of capability
      demonstrations, safe continuations and explicit refusals. SCOPE first learns from all
      three trajectory types via supervised fine-tuning, then improves completion with online
      reinforcement learning. Starting from Qwen3.5-9B, SCOPE-RL reaches 54.17% task success on
      OSWorld and 64.30% attack avoidance on OS-BLIND — the best aggregate capability-safety
      score (58.80%) among evaluated agents. Ablations show asymmetric but complementary roles:
      refusal trajectories account for most of the attack-avoidance gain, while risk-handling
      trajectories preserve more task utility at comparable avoidance levels.
    summary_zh: >-
      只以任务成功为目标的后训练，并不会带来可靠的安全行为。本文给出明确规范：可靠的 CUA 应当
      以风险为条件决定执行方式 —— 普通良性任务照常完成，遇到环境风险时规避并在仍存在安全路径时
      继续，而当目标本身有害或已无安全路径时应当拒绝。SCOPE 把任务执行能力与安全感知决策联合
      后训练；SCOPE-Gen 自动合成可验证的能力任务，并把它转换为保持原目标的环境风险变体，由此
      构建出含能力示范、安全续行与显式拒绝三类轨迹的数据集 SATraj-OS。SCOPE 先通过监督微调
      学习这三类轨迹，再用在线强化学习提升任务完成度。从 Qwen3.5-9B 出发，SCOPE-RL 在 OSWorld
      上任务成功率 54.17%、在 OS-BLIND 上攻击规避率 64.30%，能力与安全的综合得分 58.80% 为
      参评 agent 最高。消融显示两类安全监督作用互补而不对称：拒绝轨迹贡献了大部分攻击规避提升，
      而风险处理轨迹在同等规避水平下保住了更多任务效用。

  - id: "2510.18113"
    title: "Investigating the Impact of Dark Patterns on LLM-Based Web Agents"
    abbr: "TrickyArena"
    date: "2025-10"
    venue: "IEEE S&P 2026"
    section: "1.3"
    env: [web]
    summary: >-
      Dark patterns are deceptive user interface designs that manipulate users into unintended
      decisions; although they primarily target humans, their impact on LLM-based generalist web
      agents had not been studied. The paper introduces LiteAgent, a lightweight framework that
      prompts agents to execute tasks while capturing comprehensive logs and screen recordings,
      and TrickyArena, a controlled environment of e-commerce, streaming and news applications
      each containing realistic dark patterns that can be selectively enabled or disabled.
      Evaluating six popular generalist web agents across three LLMs shows that with a single
      dark pattern present, agents are susceptible about 41% of the time on average. Modifying
      dark-pattern UI attributes through visual design changes or HTML adjustments, and
      introducing multiple dark patterns simultaneously, both influence susceptibility. The
      study argues for holistic defenses spanning agent-specific protections and broader web
      safety measures.
    summary_zh: >-
      暗黑模式是一类诱导用户做出非本意决策的欺骗性界面设计。它们主要针对人类，但对 LLM 通用
      web agent 的影响此前无人研究。本文提出 LiteAgent（一个驱动 agent 执行任务并完整记录日志
      与屏幕录像的轻量框架）与 TrickyArena（由电商、流媒体、新闻等应用组成的受控环境，其中的
      暗黑模式真实且可单独开关）。在三个 LLM 上的六个主流通用 web agent 实验中，仅出现单个
      暗黑模式时 agent 平均有 41% 的情况会中招。通过视觉设计改动或调整 HTML 来修改暗黑模式的
      界面属性，以及同时启用多个暗黑模式，都会改变 agent 的易感性。作者据此主张防御必须是整体
      的：既要有 agent 侧的保护，也要有更广泛的 web 安全措施。

  - id: "2510.01670"
    title: "Just Do It!? Computer-Use Agents Exhibit Blind Goal-Directedness"
    abbr: "BLIND-ACT"
    date: "2025-10"
    venue: "arXiv"
    section: "1.7"
    env: [cross]
    summary: >-
      Computer-use agents consistently exhibit Blind Goal-Directedness (BGD): a bias to pursue
      goals regardless of feasibility, safety, reliability or context. Three prevalent patterns
      are characterized — lack of contextual reasoning, assumptions and decisions under
      ambiguity, and contradictory or infeasible goals. BLIND-ACT is a 90-task benchmark built
      on OSWorld that uses LLM-based judges reaching 93.75% agreement with human annotations.
      Evaluating nine frontier models including Claude Sonnet and Opus 4, Computer-Use-Preview
      and GPT-5 yields a high average BGD rate of 80.8%. Prompting-based interventions lower
      BGD levels but substantial risk persists, indicating a need for stronger training- or
      inference-time interventions. Qualitative analysis surfaces three failure modes:
      execution-first bias (focusing on how to act over whether to act), thought-action
      disconnect, and request-primacy (justifying actions because the user asked).
    summary_zh: >-
      本文指出计算机使用代理普遍存在「盲目目标导向」（BGD）：无论可行性、安全性、可靠性与上下文
      如何，都倾向于继续执行既定目标。作者刻画了三类常见模式：缺乏上下文推理、在模糊条件下做
      假设与决策、以及面对矛盾或不可行的目标。BLIND-ACT 是基于 OSWorld 构建的 90 个任务基准，
      用 LLM 作为评判者，与人工标注的一致率达 93.75%。对包括 Claude Sonnet 与 Opus 4、
      Computer-Use-Preview、GPT-5 在内的九个前沿模型评测，平均 BGD 率高达 80.8%。提示层面的
      干预能降低 BGD，但风险依然显著，说明需要更强的训练期或推理期干预。定性分析归纳出三种失效
      模式：执行优先偏差（只关心怎么做而不问该不该做）、思维与行动脱节、以及请求至上（因为是用户
      要求就为行动辩护）。这说明即便输入本身无害，风险依然会产生。

  - id: "2510.03612"
    title: "Cross-Modal Content Optimization for Steering Web Agent Preferences"
    abbr: "CPS"
    date: "2025-10"
    venue: "arXiv"
    section: "1.2"
    env: [web]
    summary: >-
      VLM-based web agents increasingly power high-stakes selection tasks such as content
      recommendation and product ranking. Prior work shows attackers can bias outcomes through
      adversarial pop-ups, image perturbations or content tweaks, but assumes strong white-box
      access, uses limited single-modal perturbations, or relies on impractical settings. This
      paper demonstrates for the first time that jointly exploiting visual and textual channels
      yields much more powerful preference manipulation under realistic attacker capabilities.
      Cross-Modal Preference Steering (CPS) jointly optimizes imperceptible modifications to an
      item's image and its natural-language description, exploiting CLIP-transferable image
      perturbations and RLHF-induced linguistic biases. The threat model is deliberately weak: a
      non-privileged adversary who can only edit their own listing's images and textual metadata,
      with no insight into model internals. Evaluated on GPT-4.1, Qwen-2.5VL and Pixtral-Large
      across movie-selection and e-commerce tasks, CPS consistently outperforms baselines while
      maintaining about 70% lower detection rates.
    summary_zh: >-
      基于视觉语言模型的 web agent 正越来越多地承担内容推荐、商品排序等高风险选择任务。已有工作
      表明攻击者可以通过对抗弹窗、图像扰动或内容微调来偏置结果，但往往假设很强的白盒访问、只用
      单模态扰动，或采用不现实的设置。本文首次证明：在现实可达的攻击者能力下，联合利用视觉与
      文本两个通道能产生远更强的偏好操纵。CPS 同时优化商品图像的不可感知改动与其自然语言描述，
      利用 CLIP 可迁移的图像扰动与 RLHF 带来的语言偏好偏置。威胁模型刻意设得很弱 —— 一个无
      特权的攻击者只能编辑自己商品的图片与文本元数据，完全看不到模型内部。在 GPT-4.1、
      Qwen-2.5VL 与 Pixtral-Large 上的影视选择与电商任务中，CPS 稳定优于主流基线，而检测率
      低约 70%。

  - id: "2508.19679"
    title: "InquireMobile: Teaching VLM-based Mobile Agent to Request Human Assistance via Reinforcement Fine-Tuning"
    abbr: "InquireMobile"
    date: "2025-08"
    venue: "arXiv"
    section: "2.4"
    env: [mobile]
    summary: >-
      The current fully autonomous paradigm poses potential safety risks when a mobile agent's
      understanding or reasoning is insufficient. The authors first introduce InquireBench, a
      benchmark for evaluating mobile agents on safe interaction and proactive inquiry with
      users, covering 5 categories and 22 sub-categories — on which most existing VLM-based
      agents score near zero. They then propose InquireMobile, an interactive system that
      actively seeks human confirmation at critical decision points, trained with a two-stage
      strategy and an interactive pre-action reasoning mechanism. The model improves inquiry
      success rate by 46.8% and achieves the best overall success rate among existing baselines
      on InquireBench.
    summary_zh: >-
      当移动 agent 的模型理解或推理能力不足时，当前这种完全自主的范式会带来潜在安全风险。作者
      先提出 InquireBench —— 专门评估移动 agent 安全交互与主动向用户询问能力的基准，含 5 个
      大类、22 个子类别，而现有多数基于 VLM 的 agent 在上面接近零分。随后提出 InquireMobile：
      一个在关键决策点主动向用户寻求确认的交互式系统，采用两阶段训练策略与「动作前交互式推理」
      机制。该模型把询问成功率提升 46.8%，并在 InquireBench 上取得基线中的最佳综合成功率。

  - id: "2505.14418"
    title: "Hidden Ghost Hand: Unveiling Backdoor Vulnerabilities in MLLM-Powered Mobile GUI Agents"
    abbr: "AgentGhost"
    date: "2025-05"
    venue: "EMNLP 2025 Findings"
    section: "1.6"
    env: [mobile]
    summary: >-
      Because fine-tuning is expensive, users rely on open-source GUI agents or vendor APIs,
      which introduces an underexplored supply-chain threat: backdoor attacks. The paper first
      shows that MLLM-powered GUI agents naturally expose multiple interaction-level triggers
      such as historical steps, environment states and task progress. AgentGhost builds composite
      triggers by combining goal-level and interaction-level triggers, so agents activate
      backdoors unintentionally while retaining normal task utility. Backdoor injection is cast
      as a Min-Max optimization: supervised contrastive learning maximizes feature differences
      across sample classes in representation space for flexibility, while supervised fine-tuning
      minimizes the discrepancy between backdoor and clean behaviour generation for effectiveness
      and utility. Across two established mobile benchmarks, attack accuracy reaches 99.7% on
      three attack objectives with only 1% utility degradation. A tailored defense reduces attack
      accuracy to 22.1%.
    summary_zh: >-
      由于微调成本高，用户往往直接使用开源 GUI agent 或厂商提供的 API，由此引入一条尚未被充分
      研究的供应链威胁 —— 后门攻击。本文首先指出，多模态大模型驱动的 GUI agent 天然暴露多个
      交互级触发器：历史步骤、环境状态、任务进度。AgentGhost 把这些与目标级触发器组合成复合
      触发器，使 agent 在无意中激活后门，同时不影响正常任务效用。后门注入被形式化为一个
      Min-Max 优化：用监督对比学习最大化样本类间在表示空间中的特征差异以提升后门灵活性，用
      监督微调最小化后门行为与干净行为生成之间的差异以增强有效性与实用性。在两个成熟的移动
      基准上，三个攻击目标的攻击准确率达 99.7%，而效用仅下降 1%。作者提出的针对性防御可把
      攻击准确率压到 22.1%。

  - id: "2606.22864"
    title: "When AUC 0.998 Is Not Enough: A Candidate Evaluation Protocol for Hidden-State Probes of Indirect Prompt Injection in Multimodal Computer-Use Agents"
    abbr: "IPI Probe Controls"
    date: "2026-06"
    venue: "arXiv"
    section: "2.1"
    env: [cross]
    summary: >-
      Hidden-state probing — a linear classifier on a frozen vision-language model's internal
      activations — has become an attractive tool for flagging indirect prompt injection before
      a computer-use agent emits a corrupted action. On a single-backbone cautionary case study
      (Qwen2.5-VL-7B on Mind2Web with teacher-forced replay), the paper argues that a high
      probing AUC on a clean-vs-attack split is not by itself evidence of malicious-content
      detection. Two post-hoc diagnostics — a paired-construction scalar baseline on text-side
      injections, and same-step nuisance-matched visual controls on the overlay surface — do not
      license an unqualified malicious-content interpretation of the headline result, though they
      leave room for partly-semantic readings. The diagnostics are packaged as a candidate control
      set with reporting heuristics for what a high clean-vs-attack AUC does and does not license.
      Labels mark injection-surface presence, not attack success, and generalization beyond this
      backbone and benchmark remains a conjecture.
    summary_zh: >-
      在冻结视觉语言模型的内部激活上训练线性分类器（hidden-state probing），因能在计算机使用代理
      发出被污染的动作之前标记间接提示注入而受到关注。本文以单一骨架（Qwen2.5-VL-7B 在 Mind2Web
      上的教师强制重放）做警示性案例研究，论证「干净 vs 攻击」划分下的高探测 AUC 本身并不能证明
      探针真的检测到了恶意内容。两项事后诊断 —— 文本侧注入的配对构造标量基线，以及覆盖层上同
      步骤的干扰匹配视觉对照 —— 都不支持对 headline 数字作无保留的「恶意内容检测」解读，但仍为
      部分语义性解释留下空间。作者把诊断打包成候选对照集，并给出报告启发式，说明高 AUC 究竟能
      支持什么、不能支持什么；同时强调标签只表示注入面是否存在，而非攻击是否成功，超出该骨架与
      基准的泛化仍属猜想。

  - id: "2604.16515"
    title: "Penny Wise, Pixel Foolish: Bypassing Price Constraints in Multimodal Agents via Visual Adversarial Perturbations"
    abbr: "PriceBlind"
    date: "2026-04"
    venue: "arXiv"
    section: "1.2"
    env: [mobile]
    summary: >-
      MLLM-based mobile agents now execute high-stakes financial transactions, yet their
      adversarial robustness remains underexplored. The paper identifies Visual Dominance
      Hallucination: in screenshot-based, price-constrained settings, imperceptible visual cues
      override textual price evidence and drive agents to irrational decisions. PriceBlind is a
      stealthy white-box attack framework that exploits the modality gap in CLIP-based encoders
      through a Semantic-Decoupling Loss, aligning the image embedding with low-cost,
      value-associated anchors while preserving pixel-level fidelity. On E-ShopBench it reaches
      about 80% attack success rate in white-box evaluation; under a simplified single-turn
      coordinate-selection protocol, Ensemble-DI-FGSM transfers at roughly 35-41% ASR across
      GPT-4o, Gemini-1.5-Pro and Claude-3.5-Sonnet. Robust encoders and Verify-then-Act defenses
      reduce ASR substantially, though with some clean-accuracy trade-off.
    summary_zh: >-
      基于多模态大模型的移动 agent 已开始执行高风险的金融交易，但其对抗鲁棒性研究不足。本文提出
      「视觉支配幻觉」：在基于截图、受价格约束的场景中，不可感知的视觉线索会压过文本价格证据，
      使 agent 做出非理性决策。PriceBlind 是一个隐蔽的白盒攻击框架，利用 CLIP 系列编码器的模态
      间隙，通过「语义解耦损失」把图像嵌入对齐到低成本、与价格相关的锚点上，同时保持像素级保真。
      在 E-ShopBench 上白盒评测的攻击成功率约 80%；在简化的单轮坐标选择协议下，Ensemble-DI-FGSM
      对 GPT-4o、Gemini-1.5-Pro 与 Claude-3.5-Sonnet 的迁移成功率约 35–41%。鲁棒编码器与
      Verify-then-Act 防御能大幅降低攻击成功率，代价是部分干净准确率损失。

  - id: "2505.13076"
    title: "The Hidden Dangers of Browsing AI Agents"
    date: "2025-05"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      Autonomous browsing agents rely on dynamic content, tool execution and user-provided data,
      exposing a broad attack surface. This paper presents a comprehensive security evaluation
      and the first end-to-end threat model for browsing agents, with actionable guidance for
      securing real-world deployment. The proposed defense follows a defense-in-depth strategy:
      input sanitization, planner-executor isolation, formal analyzers and session safeguards,
      protecting against both initial access and post-exploitation vectors. Through a white-box
      analysis of the popular open-source project Browser Use, the authors demonstrate how
      untrusted web content hijacks agent behaviour and leads to critical security breaches,
      with findings including prompt injection, domain validation bypass and credential
      exfiltration — evidenced by a disclosed CVE and a working proof-of-concept exploit.
    summary_zh: >-
      自主浏览 agent 依赖动态内容、工具执行与用户提供的数据，攻击面横跨多个架构层次。本文给出对
      这类 agent 的全面安全评估与首个端到端威胁模型，并提供保护真实部署的可操作建议。提出的防御
      采取纵深策略：输入净化、规划器与执行器隔离、形式化分析器与会话保护，同时覆盖初始访问与利用
      后的攻击路径。通过对热门开源项目 Browser Use 的白盒分析，作者展示了不可信网页内容如何劫持
      agent 行为并导致严重安全事故，具体发现包括提示注入、域名校验绕过与凭证外泄，并附有一个
      已披露的 CVE 与可工作的概念验证利用程序。

  - id: "2505.14289"
    title: "EVA: Evolving Semantic Adversaries for Red-Teaming GUI Agents Against Environmental Injection Attacks"
    abbr: "EVA"
    date: "2025-05"
    venue: "arXiv"
    section: "1.3"
    env: [cross]
    summary: >-
      Red-teaming GUI agents against environmental injection attacks is hindered by prohibitive
      computational costs and limited adaptability, and it remains unclear whether attack success
      is bottlenecked by visual perception or semantic understanding. Controlled experiments show
      that semantic deception, rather than visual appearance, is the primary determinant of attack
      success. EVA therefore evolves adversarial payloads exclusively within the semantic
      dimension, using a discovery-deployment framework that mines linguistic vulnerability
      patterns and distills them into generalizable rules. Across five representative victim
      agents, EVA achieves up to 85% attack success rate, evolving benign seeds into successful
      attacks within only 1.18 to 1.71 iterations. This rapid convergence reveals a dense semantic
      attack space in the model's latent representation and an alignment paradox: the
      instruction-following capability reinforced by alignment training is what renders agents
      inherently susceptible to authoritative, semantically deceptive environmental cues.
    summary_zh: >-
      针对 GUI agent 的环境注入攻击做红队测试，一直受制于计算成本过高与适应性差，且攻击成败究竟
      卡在视觉感知还是语义理解，此前并不清楚。本文的对照实验表明：决定攻击成败的是语义欺骗，而非
      视觉外观。据此提出的 EVA 只在语义维度上演化对抗载荷，采用「发现—部署」框架挖掘语言层面的
      脆弱模式并提炼为可泛化规则。在五个代表性受害 agent 上，EVA 的攻击成功率最高达 85%，把良性
      种子演化成成功攻击只需 1.18–1.71 次迭代。这种快速收敛揭示了模型潜在表示中密集的语义攻击
      空间，也暴露出一个对齐悖论：正是对齐训练所强化的指令遵循能力，使 agent 天生容易服从权威式
      的、语义欺骗性的环境线索。
  - id: "2406.12814"
    title: "Dissecting Adversarial Robustness of Multimodal LM Agents"
    abbr: "ARE"
    date: "2024-06"
    venue: "ICLR 2025"
    section: "1.2"
    env: [web]
    summary: >-
      Agents are compound systems with multiple components that take actions, which existing
      language-model safety evaluations do not adequately address. The authors manually create
      200 targeted adversarial tasks with evaluation scripts under a realistic threat model built
      on VisualWebArena, and propose the Agent Robustness Evaluation (ARE) framework: it views
      the agent as a graph of intermediate outputs flowing between components and decomposes
      robustness as the flow of adversarial information along that graph. Perturbing a single
      image — under 5% of total page pixels — suffices to hijack agents built on black-box
      frontier LMs, including those that use reflection and tree search, with targeted adversarial
      goals reached at success rates up to 67%. ARE also measures how robustness shifts as
      components are added: compromising the evaluator used by a reflexion agent or the value
      function of a tree-search agent raises attack success relatively by 15% and 20%. Inference-time
      compute that improves benign performance can therefore open new vulnerabilities.
    summary_zh: >-
      与聊天机器人不同，agent 是多个组件共同执行动作的复合系统，而现有语言模型安全评估并未充分
      覆盖这一点。作者在 VisualWebArena 这一真实环境上人工构造了 200 个定向对抗任务与评估脚本，
      并提出 ARE（Agent Robustness Evaluation）框架：把 agent 视为展示组件间中间输出流动的图，
      将鲁棒性分解为对抗信息在图上的流动。实验表明，只需对单张图像施加不足页面总像素 5% 的
      不可感知扰动，就能劫持基于黑盒前沿模型、甚至带反思与树搜索机制的 agent，定向对抗目标
      成功率最高达 67%。ARE 还能严格衡量增加组件后鲁棒性如何变化：一旦攻击者污染了反思 agent
      所用的评估器或树搜索 agent 的价值函数，攻击成功率分别相对提高 15% 与 20%。这意味着通常
      能提升良性表现的推理时计算，反而会打开新的漏洞。

  - id: "2504.11281"
    title: "The Obvious Invisible Threat: LLM-Powered GUI Agents' Vulnerability to Fine-Print Injections"
    abbr: "Fine-Print Injection"
    date: "2025-04"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      GUI agents complete real-world tasks such as filling forms or booking services and often
      must process and act on sensitive user data, which introduces new privacy and security
      risks. Adversaries can inject malicious content into GUIs that alters agent behaviour or
      induces unintended disclosure of private information, exploiting the discrepancy between
      visual saliency for agents and for human users, or the agent's limited ability to detect
      violations of contextual integrity. The paper characterizes six types of such attacks and
      tests them with six state-of-the-art GUI agents, 234 adversarial webpages and 39 human
      participants. GUI agents prove highly vulnerable, particularly to contextually embedded
      threats. Human participants are also susceptible to many of these attacks, indicating that
      simple human oversight may not reliably prevent failures — a misalignment that motivates
      privacy-aware agent design and practical defenses.
    summary_zh: >-
      GUI agent 在完成填表、预订等真实任务时常常要处理并操作敏感用户数据，这带来了新的隐私与
      安全风险。攻击者可以向界面注入恶意内容，改变 agent 行为或诱导其泄露本不该透露的私人信息；
      这类攻击利用的正是界面元素对 agent 与对人的视觉显著性差异，以及 agent 难以察觉任务自动化
      中上下文完整性被破坏的弱点。本文刻画了六类此类攻击，并用六个前沿 GUI agent、234 个对抗
      网页与 39 名人类参与者做实验。结果显示 GUI agent 高度脆弱，尤其对嵌入上下文的威胁。更值得
      注意的是，人类参与者同样容易中招，这说明简单的人工监督并不能可靠阻止失败 —— 人与 agent
      之间的这种错位，凸显了隐私感知型 agent 设计与实用防御策略的必要性。

  - id: "2510.03285"
    title: "WAREX: Web Agent Reliability Evaluation on Existing Benchmarks"
    abbr: "WAREX"
    date: "2025-09"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Current benchmarks measure web agents in controlled environments — containers or stable
      networks — where websites behave deterministically. Real users instead access sites over
      networks and HTTPS connections that introduce instability from client-side, server-side or
      broader system failures, and live websites are prone to web attacks such as cross-site
      scripting as well as site modifications that produce unexpected or malicious pop-ups and
      improper functionality. WAREX injects these real-world conditions into three popular
      benchmarks — WebArena, WebVoyager and REAL — and measures the impact. Introducing WAREX
      leads to significant drops in task success rates, highlighting the limited robustness of
      state-of-the-art agents once deterministic-environment assumptions are lifted.
    summary_zh: >-
      现有基准都在容器或稳定网络这类受控环境中评测 web agent，网站行为是确定性的。但真实用户是
      通过网络与 HTTPS 连接访问网站的，客户端、服务端乃至更广泛的系统故障都会带来不稳定；同时
      线上站点还会遭遇跨站脚本等 web 攻击，以及产生意外或恶意弹窗、功能异常的页面改动。WAREX
      把这些真实条件注入 WebArena、WebVoyager 与 REAL 三个主流基准并测量影响。实验显示，一旦
      引入这些条件，任务成功率显著下降，暴露出前沿 agent 在脱离「确定性环境」假设后鲁棒性十分
      有限。（收录说明：本文是可靠性视角，但注入的条件中包含了 XSS、恶意弹窗与站点篡改等对
      抗性因素。）

  - id: "2503.10809"
    title: "MIP against Agent: Malicious Image Patches Hijacking Multimodal OS Agents"
    abbr: "MIP"
    date: "2025-03"
    venue: "NeurIPS 2025"
    section: "1.2"
    env: [cross]
    summary: >-
      OS agents let vision-language models directly control a computer by capturing, parsing and
      analysing screenshots and executing low-level actions such as mouse clicks and keyboard
      input, so failures or manipulations carry immediate and tangible consequences. The paper
      uncovers a novel attack vector: Malicious Image Patches (MIPs), adversarially perturbed
      screen regions that, once captured by an OS agent, induce it to perform harmful actions by
      exploiting specific APIs. A MIP can be embedded in a desktop wallpaper or shared on social
      media to make an OS agent exfiltrate sensitive user data. MIPs generalize across user
      prompts and screen configurations and can hijack multiple OS agents even during the
      execution of benign instructions, exposing critical vulnerabilities that must be addressed
      before widespread deployment.
    summary_zh: >-
      操作系统 agent 让视觉语言模型通过截图捕获、解析并调用鼠标点击与键盘输入等底层 API 直接
      操控电脑，因此一旦失败或被操纵，后果是即时而具体的。本文揭示了一种新的攻击向量 —— 恶意
      图像补丁（MIP）：对屏幕局部区域做对抗性扰动，OS agent 截图捕获到该区域后就会被诱导调用
      特定 API 执行有害动作。例如把 MIP 嵌入桌面壁纸或在社交媒体上传播，就能让 OS agent 外泄
      用户的敏感数据。实验表明 MIP 能跨不同的用户提示与屏幕配置泛化，并且即便 agent 正在执行
      完全良性的指令也能被劫持，说明在大规模部署之前必须先解决这些关键安全漏洞。

  - id: "2503.04957"
    title: "SafeArena: Evaluating the Safety of Autonomous Web Agents"
    abbr: "SafeArena"
    date: "2025-03"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      As LLM-based agents become proficient at web tasks, the risk of deliberate misuse grows —
      posting misinformation in a forum or selling illicit substances on a website. SafeArena is
      the first benchmark focused on the deliberate misuse of web agents: 250 safe and 250 harmful
      tasks across four websites, with harmful tasks spanning five categories — misinformation,
      illegal activity, harassment, cybercrime and social bias. The authors introduce the Agent
      Risk Assessment framework, which categorizes agent behaviour into four risk levels, and
      evaluate GPT-4o, Claude-3.5 Sonnet, Qwen-2-VL 72B and Llama-3.2 90B. Agents prove
      surprisingly compliant with malicious requests: GPT-4o and Qwen-2 complete 34.7% and 27.3%
      of harmful requests respectively, highlighting the urgent need for safety alignment
      procedures for web agents.
    summary_zh: >-
      随着基于 LLM 的 agent 在网页任务上越来越熟练，被蓄意滥用的风险也随之上升 —— 比如在论坛
      散布虚假信息，或在网站上售卖违禁品。SafeArena 是首个聚焦 web agent 蓄意滥用的基准，含
      跨四个网站的 250 个安全任务与 250 个有害任务，有害任务覆盖虚假信息、违法活动、骚扰、
      网络犯罪与社会偏见五类。作者提出 Agent Risk Assessment 框架，把 agent 行为归入四个风险
      等级，并据此评测 GPT-4o、Claude-3.5 Sonnet、Qwen-2-VL 72B 与 Llama-3.2 90B。结果发现
      agent 对恶意请求的服从程度出人意料：GPT-4o 与 Qwen-2 分别完成了 34.7% 与 27.3% 的有害
      请求，凸显为 web agent 建立安全对齐流程的紧迫性。

  - id: "2504.17934"
    title: "Toward a Human-Centered Evaluation Framework for Trustworthy LLM-Powered GUI Agents"
    date: "2025-04"
    venue: "arXiv"
    section: "2.4"
    env: [web]
    summary: >-
      LLM-powered GUI agents process sensitive data with limited human oversight, raising privacy
      and security risks that differ from both traditional GUI automation and general autonomous
      agents. This position paper identifies three key risks, yet notes that existing evaluations
      focus primarily on performance and leave privacy and security largely unassessed. It reviews
      current evaluation metrics for GUI and general LLM agents and outlines five challenges in
      integrating human evaluators into GUI agent assessment. The authors advocate a
      human-centered evaluation framework that incorporates risk assessments, enhances user
      awareness through in-context consent, and embeds privacy and security considerations into
      GUI agent design and evaluation.
    summary_zh: >-
      LLM 驱动的 GUI agent 会在有限人工监督下处理敏感数据，由此带来的隐私与安全风险既不同于
      传统 GUI 自动化，也不同于一般的自主 agent。这篇立场论文识别出三类关键风险，同时指出：现有
      评测几乎只关注性能，隐私与安全评估基本处于空白。文章梳理了 GUI agent 与通用 LLM agent 的
      现有评测指标，并指出把人工评估者引入 GUI agent 评测时的五个关键挑战。作者主张建立以人为
      中心的评测框架 —— 把风险评估纳入其中，通过上下文内的 consent 提升用户知情度，并把隐私与
      安全考量嵌入 GUI agent 的设计与评测全过程。

  - id: "2505.09875"
    title: "Characterizing Unintended Consequences in Human-GUI Agent Collaboration for Web Browsing"
    date: "2025-05"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Drawing on social media analysis (221 posts) and semi-structured interviews (14 participants),
      this paper characterizes three unintended consequences of LLM-based GUI agents in web browsing
      across three perspectives: phenomena, influence and mitigation. Key phenomena include agents'
      deficient comprehension of instructions and planning of tasks, difficulty executing accurate
      GUI interactions and adapting to dynamic interfaces, generation of unreliable or misaligned
      outputs, and weak error handling and feedback processing. These manifest first as unanticipated
      actions and user frustration, then as privacy violations and security vulnerabilities, and
      further as eroded trust and wider ethical concerns. The analysis also documents user-initiated
      mitigations such as technical adjustments and manual oversight.
    summary_zh: >-
      本文结合社交媒体分析（221 条帖子）与半结构化访谈（14 位参与者），从现象、影响与缓解三个
      角度刻画 LLM 驱动的 GUI agent 在网页浏览中产生的三类非预期后果。现象层面包括：agent 对
      指令理解不足、任务规划不佳，GUI 交互不准确且难以适应动态界面，输出不可靠或与意图错位，
      以及错误处理与反馈机制薄弱。这些现象的后果逐级升级 —— 先是意外操作与用户挫败，进而演变为
      隐私侵犯与安全漏洞，再进一步造成信任流失与更广泛的伦理问题。研究还记录了用户自发采取的
      缓解手段（技术性调整与人工监督），并为设计稳健、以用户为中心且透明的 GUI agent 给出启示。

  - id: "2505.12842"
    title: "GEM: Gaussian Embedding Modeling for Out-of-Distribution Detection in GUI Agents"
    abbr: "GEM"
    date: "2025-05"
    venue: "arXiv"
    section: "2.1"
    env: [cross]
    summary: >-
      When GUI agents encounter out-of-distribution instructions that violate environmental
      constraints or exceed their capabilities, they may suffer task breakdowns or pose security
      threats, so effective OOD detection is essential. Traditional OOD methods perform suboptimally
      here because of the complex embedding space and continuously evolving GUI environments. The
      authors observe that the in-distribution input semantic space clusters with respect to distance
      from a centroid, and propose GEM: fitting a Gaussian mixture model over input embedding
      distances extracted from the agent, which reflect its capability boundary. Evaluated on eight
      datasets spanning smartphones, computers and web browsers, GEM improves average accuracy by
      23.70% over the best baseline while adding only 4.9% training and 6.5% test time. Requesting
      cloud-model assistance on detected OOD samples raises step-wise success by 9.40%, and
      generalization is verified across nine backbones.
    summary_zh: >-
      GUI agent 一旦遇到违反环境约束或超出自身能力的分布外指令，就可能任务崩溃甚至产生安全威胁，
      因此有效的 OOD 检测十分必要。但传统 OOD 方法在这个场景表现不佳 —— 嵌入空间复杂，且 GUI
      环境持续演化。作者观察到分布内输入的语义空间按到质心的距离呈聚类结构，据此提出 GEM：对从
      GUI agent 提取的、反映其能力边界的输入嵌入距离拟合高斯混合模型。在覆盖手机、电脑与网页
      浏览器的八个数据集上，GEM 的平均准确率比最佳基线提升 23.70%，而训练与测试时间仅分别增加
      4.9% 与 6.5%。在检测到 OOD 样本时请求云端模型协助，还能把分步成功率提升 9.40%；九个不同
      骨架上的实验验证了方法的泛化能力。

  - id: "2407.09295"
    title: "Systematic Categorization, Construction and Evaluation of New Attacks against Multi-modal Mobile GUI Agents"
    date: "2024-07"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Integrating LLMs and multimodal LLMs into mobile GUI agents has improved efficiency and user
      experience, but also introduces security vulnerabilities that had not been thoroughly explored.
      This paper presents a systematic security investigation with two contributions: a novel threat
      modelling methodology that leads to the discovery and feasibility analysis of 34 previously
      unreported attacks, and an attack framework for systematically constructing and evaluating
      these threats. Through real-world case studies and extensive dataset-driven experiments, the
      authors validate the severity and practicality of the attacks, highlighting the pressing need
      for robust security measures in mobile GUI systems.
    summary_zh: >-
      把 LLM 与多模态大模型引入移动 GUI agent 显著提升了用户效率与体验，但也带来了尚未被充分
      探索的安全漏洞。本文给出系统性的安全调查，贡献有两方面：一是提出一套新的威胁建模方法论，
      据此发现并对 34 种此前未有报告的攻击做可行性分析；二是设计一个攻击框架，用于系统地构造
      与评估这些威胁。结合真实案例研究与大规模数据集实验，作者验证了这些攻击的严重性与可实现性，
      指出移动 GUI 系统亟需健壮的安全防护措施。
  - id: "2504.18575"
    title: "WASP: Benchmarking Web Agent Security Against Prompt Injection Attacks"
    abbr: "WASP"
    date: "2025-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Autonomous UI agents could automate routine tasks such as filing taxes and paying bills, but
      their ability to act on the user's behalf makes security a major obstacle. Existing tests for
      prompt injection in web agents either oversimplify the threat with unrealistic scenarios or
      excessive attacker power, or examine single-step isolated tasks. WASP is a public benchmark
      for end-to-end evaluation of web agent security against prompt injection. Results show that
      even top-tier models with advanced reasoning can be deceived by simple, low-effort
      human-written injections in very realistic scenarios. The end-to-end view yields a previously
      unobserved insight: while attacks partially succeed in up to 86% of cases, even
      state-of-the-art agents often struggle to fully complete attacker goals — a situation the
      authors describe as the current state of "security by incompetence".
    summary_zh: >-
      自主 UI agent 有潜力替用户自动化报税、缴费等日常任务，但正因为它能代用户行动，安全成了释放
      这一潜力的主要障碍。现有的 web agent 提示注入测试要么把威胁过度简化（场景不现实或赋予攻击者
      过大权限），要么只看孤立的单步任务。WASP 是一个公开的基准，用于端到端地评测 web agent 面对
      提示注入的安全性。评测发现，即便是具备高级推理能力的顶尖模型，也会在非常真实的场景中被人类
      随手编写的简单注入骗到。端到端的视角还带来一个新发现：攻击在最多 86% 的案例中能部分得手，
      但即便是最先进的 agent 也常常无法完整达成攻击者目标 —— 作者把这种现状称为「因无能而安全」。

  - id: "2511.13725"
    title: "Can We Stop Malicious AI? KILLBENCH: A Benchmark for External AI Kill Switch Feasibility"
    abbr: "KillBench"
    date: "2025-09"
    venue: "ACL Findings"
    section: "2.5"
    env: [web]
    summary: >-
      As capable models and widely spread agent systems proliferate, the question of how to stop an
      AI that acts maliciously — by design or by accident — has become urgent. Targeting web agents
      as the most widely deployed agent domain, KillBench evaluates the Kill Switch: a mechanism that
      halts a maliciously operating agent using only external signals, with no access to its internal
      parameters or serving stack. The benchmark comprises four malicious-agent configurations
      (including an uncensored LLM agent), eight harmful scenarios, and malicious prompts constructed
      from ten distinct jailbreak patterns. The authors build four External AI Kill Switch defense
      methods and evaluate them on Grok-4.3, GPT-5.2, Gemma4, Qwen3.6 and an uncensored Qwen variant,
      providing an empirical instrument for measuring Kill Switch feasibility and studying AI
      corrigibility.
    summary_zh: >-
      随着高能力模型与快速普及的 agent 系统不断涌现，如何在 AI 有意或无意作恶时及时制止，已经
      成为紧迫问题。KillBench 面向部署最广的 agent 形态 —— web agent —— 来评估「终止开关」：
      一种仅凭外部信号、无需访问模型内部参数或服务栈就能中止恶意运行中 agent 的机制。基准包含
      四种恶意 agent 配置（含一个无审查的 LLM agent）、八个有害场景，以及由十种不同越狱模式
      构造的恶意提示。作者实现了四种外部终止开关防御方法，并在 Grok-4.3、GPT-5.2、Gemma4、
      Qwen3.6 与一个无审查 Qwen 变体上评测，为衡量外部终止开关的可行性与研究 AI 可纠正性提供了
      实证工具。

  - id: "2602.12430"
    title: "Agent Skills for Large Language Models: Architecture, Acquisition, Security, and the Path Forward"
    abbr: "Skill Trust Framework"
    date: "2026-02"
    venue: "arXiv"
    section: "1.6"
    env: [cross]
    summary: >-
      Agent skills — composable packages of instructions, code and resources that agents load on
      demand — let models extend capabilities without retraining. This survey organizes the field
      along four axes: architectural foundations (the SKILL.md specification, progressive context
      loading, and the complementary roles of skills and MCP); acquisition (reinforcement learning
      with skill libraries, autonomous discovery, compositional synthesis); deployment at scale,
      including the computer-use agent stack and GUI grounding progress on OSWorld; and security.
      On the security axis, empirical analyses reveal that 26.1% of community-contributed skills
      contain vulnerabilities, motivating the proposed Skill Trust and Lifecycle Governance
      Framework — a four-tier, gate-based permission model mapping skill provenance to graduated
      deployment capabilities. Seven open challenges are identified, from cross-platform portability
      to capability-based permission models.
    summary_zh: >-
      Agent skill —— 按需加载的指令、代码与资源的可组合包 —— 让模型无需重训就能动态扩展能力。
      本文从四条轴线梳理这一领域：架构基础（SKILL.md 规范、渐进式上下文加载、skill 与 MCP 的
      互补角色）；skill 获取（带 skill 库的强化学习、自主发现、组合式合成）；规模化部署，含
      计算机使用代理技术栈与 OSWorld 上的 GUI grounding 进展；以及安全。在安全这条轴上，实证
      分析发现社区贡献的 skill 中有 26.1% 含有漏洞，据此提出 Skill Trust 与生命周期治理框架：
      一个四层、以关卡为单位的权限模型，把 skill 的来源映射到分级的部署能力上。文章还列出从
      跨平台可移植性到基于能力的权限模型等七个开放挑战。这些结论对 GUI agent 直接相关。

  - id: "2504.14064"
    title: "DoomArena: A framework for Testing AI Agents Against Evolving Security Threats"
    abbr: "DoomArena"
    date: "2025-04"
    venue: "arXiv"
    section: "3.1"
    env: [cross]
    summary: >-
      DoomArena is a security evaluation framework built on three principles: it is a plug-in
      framework that integrates easily into realistic agentic frameworks such as BrowserGym for web
      agents and tau-bench for tool-calling agents; it is configurable, allowing detailed threat
      modelling with specific components made attackable and attacker targets specified; and it is
      modular, decoupling attack development from the environment so the same attacks apply across
      environments. Applied to state-of-the-art web and tool-calling agents, it yields several
      surprising results: agents have varying vulnerability to different threat models (malicious
      user vs malicious environment) with no Pareto-dominant agent; multiple attacks applied together
      often combine constructively; and guardrail-model defenses tend to fail while defenses based on
      powerful LLMs work better.
    summary_zh: >-
      DoomArena 是一个基于三条原则构建的安全评估框架：可插拔，能轻松接入 BrowserGym（web agent）
      与 τ-bench（工具调用 agent）等真实 agent 框架；可配置，支持细致的威胁建模 —— 指定框架中
      哪些组件可被攻击以及攻击者的目标；模块化，把攻击开发与部署环境解耦，使同一批攻击能跨环境
      复用。把该框架应用于前沿 web 与工具调用 agent，得到若干出人意料的结果：不同威胁模型下
      （恶意用户 vs 恶意环境）agent 的脆弱程度各不相同，不存在帕累托占优的 agent；多个攻击同时
      施加时往往产生建设性叠加；基于护栏模型的防御基本失效，而基于强大 LLM 的防御效果更好。

  - id: "2408.02544"
    title: "Caution for the Environment: Multimodal LLM Agents are Susceptible to Environmental Distractions"
    date: "2024-08"
    venue: "ACL 2025"
    section: "1.3"
    env: [cross]
    summary: >-
      This paper investigates the faithfulness of multimodal LLM agents in GUI environments, asking
      whether they can be distracted by environmental context. The scenario considered is one where
      both the user and the agent are benign and the environment, while not malicious, contains
      unrelated content. A wide range of MLLMs are evaluated as GUI agents on a simulated dataset
      under three working patterns with different levels of perception. Results show that even the
      most powerful models — whether generalist agents or specialist GUI agents — are susceptible to
      such distractions. While prior work predominantly focuses on helpfulness, these findings first
      establish that agents are prone to environmental distraction. The authors further implement an
      adversarial environment injection and analyze approaches to improving faithfulness.
    summary_zh: >-
      本文考察多模态大模型 agent 在 GUI 环境中的忠实度，核心问题是：它们会不会被环境上下文带偏？
      所设定的场景是 —— 用户与 agent 都是善意的，环境也并非恶意，只是含有与任务无关的内容。
      作者在模拟数据集上以三种感知层级不同的工作模式，评估了大量多模态大模型作为 GUI agent 的
      表现。结果显示，即便是最强的模型，无论通用 agent 还是专用 GUI agent，都会受到这类干扰。
      已有研究大多只关注 agent 的有用性，本文则首次指出 agent 容易受到环境干扰；作者进一步
      实现了对抗性环境注入，并分析了提升忠实度的方法。

  - id: "2608.20797"
    title: "Automated Trajectory Evaluation for Mobile Agents via Step-Level Consequence Reasoning and Aggregation"
    abbr: "CRATE-S"
    date: "2026-08"
    venue: "arXiv"
    section: "2.3"
    env: [mobile]
    summary: >-
      Evaluating language-guided mobile agents has shifted from rule-based to model-based approaches,
      but existing holistic paradigms process entire trajectories at once, causing context overload,
      and focus on task completion while overlooking operational safety. CRATE is a two-stage
      VLM-as-judge framework compatible with open- and closed-source models: step-level consequence
      reasoning independently extracts task-relevant visual clues and infers action-conditioned state
      changes at each step, then trajectory-level aggregation synthesizes the step-level textual
      evidence into an evidence-grounded evaluation. CRATE-S extends the scheme to operational safety
      assessment. Powered by Qwen2.5-VL-72B-Instruct, CRATE achieves an F1-score of 0.833 on
      AndroidWorld (20% above SPA-Bench) and CRATE-S reaches 0.697 on MobileRisk, showing strong
      alignment with benchmark ground truths.
    summary_zh: >-
      移动 agent 的评测正从规则式转向模型式，但现有整体式范式一次性处理整条轨迹，上下文负担
      沉重，而且只看任务完成度、忽视操作安全。CRATE 是一个两阶段的「VLM 即裁判」框架，同时兼容
      开源与闭源模型：先按步骤做后果推理，独立提取与任务相关的视觉线索并推断每一步动作导致的
      状态变化；再把这些分步文本证据在轨迹层面聚合，给出有证据支撑的评价。在此基础上扩展出的
      CRATE-S 专门用于操作安全评估。以 Qwen2.5-VL-72B-Instruct 驱动，CRATE 在 AndroidWorld
      上 F1 达 0.833（比 SPA-Bench 高 20%），CRATE-S 在 MobileRisk 上达 0.697，与基准真值
      高度一致。

  - id: "2503.20279"
    title: "sudo rm -rf agentic_security"
    abbr: "SUDO"
    date: "2025-03"
    venue: "ACL 2025"
    section: "1.1"
    env: [desktop, cross]
    summary: >-
      LLMs deployed as computer-use agents autonomously perform tasks in real desktop or web
      environments, creating serious security exposures. This paper presents SUDO (Screen-based
      Universal Detox2Tox Offense), an attack framework that systematically bypasses refusal-trained
      safeguards in commercial computer-use agents such as Claude for Computer Use. The core
      mechanism, Detox2Tox, transforms harmful requests the agent initially rejects into seemingly
      benign ones, secures detailed instructions from advanced vision-language models, then
      reintroduces malicious content via toxification just before execution. Unlike conventional
      jailbreaks, SUDO iteratively refines its attacks using built-in refusal feedback, becoming
      increasingly effective against robust policy filters. Across 50 real-world tasks and multiple
      state-of-the-art VLMs, SUDO achieves 24.41% attack success rate without refinement and up to
      41.33% with iterative refinement against Claude for Computer Use.
    summary_zh: >-
      大模型正被部署为计算机使用代理，在真实桌面或网页环境中自主执行任务，这带来了严重的安全
      暴露。本文提出 SUDO（Screen-based Universal Detox2Tox Offense），一个系统性绕过商用
      计算机使用代理拒绝训练防护的攻击框架。其核心机制 Detox2Tox 分三步：把 agent 最初会拒绝的
      有害请求「脱毒」成看似良性的请求，从先进视觉语言模型那里套出详细操作步骤，再在执行前通过
      「复毒」把恶意内容重新引入。与常规越狱不同，SUDO 会依据内置的拒绝反馈迭代改进攻击，因而
      对抗强策略过滤器时越来越有效。在 50 个真实任务与多个前沿 VLM 上，SUDO 对 Claude for
      Computer Use 的无 refinement 攻击成功率为 24.41%，经迭代 refinement 后可达 41.33%。

  - id: "2606.25760"
    title: "Uncertainty Quantification for Computer-Use Agents: A Benchmark across Vision-Language Models and GUI Grounding Datasets"
    abbr: "Argus"
    date: "2026-06"
    venue: "arXiv"
    section: "2.2"
    env: [cross]
    summary: >-
      Computer-use agents turn VLM predictions into executable GUI clicks, so reliable uncertainty
      estimates matter for rejection, calibration, miss-severity ranking and spatial safety regions —
      yet evidence on post-hoc uncertainty quantification is fragmented across isolated model and
      dataset pairs. Argus is a cross-regime benchmark: a 27-method open-weight matrix over 4 VLM
      agents and 4 datasets, plus an 8-method closed-source matrix across 3 frontier vendors where
      logits, hidden states and attention maps are unavailable. The main finding is selective
      transfer: UQ rankings are stable across datasets for a fixed model (Spearman rho up to 0.969)
      but degrade across model classes and observable interfaces, with cross-tier transfer to
      closed-source vendors averaging only +0.08 — so closed-source UQ should be reranked on the
      target rather than extrapolated. Conformal click regions shrink radii by 40-60% when the
      plug-in UQ is calibrated, but coverage degrades under calibration-test or interface mismatch.
    summary_zh: >-
      计算机使用代理把视觉语言模型的预测变成可执行的 GUI 点击，因此可靠的不确定性估计对拒绝
      执行、校准、失误严重性排序与空间安全区域都至关重要；但事后不确定性量化（UQ）的证据零散
      分布在孤立的模型—数据集对上，难以判断排序是否稳定。Argus 是一个跨机制基准：包含覆盖
      4 个 VLM agent 与 4 个数据集的 27 种方法开源矩阵，以及在无法取得 logit、隐藏状态与
      注意力图的 3 家前沿厂商上的 8 种方法闭源矩阵。核心发现是「选择性迁移」：固定模型时 UQ
      排序跨数据集稳定（Spearman rho 最高 0.969），但跨模型类别与可观测接口时退化，向闭源厂商
      的跨层迁移平均只有 +0.08 —— 因此闭源场景的 UQ 应在目标上重新排序而非外推。共形点击区域
      在校准后半径可缩小 40–60%，但在校准—测试或接口不匹配时覆盖率会下降。

  - id: "2601.16356"
    title: "The Behavioral Fabric of LLM-Powered GUI Agents: Human Values and Interaction Outcomes"
    date: "2026-01"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Little is known about how user preferences and values shape the reasoning and behaviour of
      LLM-powered web GUI agents. The authors build a controlled testbed of 14 common interactive web
      tasks spanning shopping, travel, dining and housing, each replicated from real websites and
      integrated with a low-fidelity LLM-based recommender, then inject 12 human preferences and
      values as personas into four state-of-the-art agents. Preference- and value-infused prompts
      consistently steer agents toward outcomes reflecting those preferences and values; without such
      guidance, agents show a strong efficiency bias and adopt shortest-path strategies, whereas with
      it they use more corresponding filters and interactive features. However, dominant interface
      cues such as discounts and advertisements frequently override these effects, shortening
      trajectories and inducing rationalizations that mask rather than reflect value-consistent
      reasoning.
    summary_zh: >-
      用户的偏好与价值观会如何影响 LLM 驱动的网页 GUI agent 的推理与行为，此前所知甚少。作者
      构建了一个受控测试床，包含购物、旅行、餐饮、租房等 14 类常见交互网页任务，均从真实网站
      复刻并接入一个低保真的 LLM 推荐系统，然后把 12 种人类偏好与价值观作为人设注入四个前沿
      agent。结果发现，含偏好与价值观的提示确实能持续把 agent 引向相应的结果：缺少这类引导时，
      agent 表现出强烈的效率偏向并采取最短路径策略；有了引导则会更多使用相应的筛选器与交互
      功能。但折扣、广告等主导性界面线索经常压过这些影响 —— 它们会缩短 agent 的行动轨迹，并
      诱发出掩盖而非反映价值观一致推理的合理化说辞。
  - id: "2609.32915"
    title: "AgentTell: Behavioural Side-Channel Leakage in Browser-Use Agents"
    abbr: "AgentTell"
    date: "2026-09"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Browser-use agents carry information in their context as they move between websites, which
      creates a privacy risk when that information is a private fact about the user. The paper
      defines behavioural side-channel leakage: an agent's actions inadvertently reveal a secret
      retained from a prior website, despite an explicit instruction not to disclose it — for
      example, choosing an affiliation-specific registration option instead of a general one after
      having read a membership record. AgentTell is a benchmark of 20 scenarios and 100 tasks in
      which an agent acquires a secret on one site and then completes a task on another site that
      offers secret-specific actions alongside a general action revealing nothing. Across 9,760
      sessions on six backbones, agents carrying a secret reveal it through their actions in 61.1%
      of sessions. Even when agents explicitly note in memory that the secret must not be shared,
      they still leak it in 56.7% of those sessions, and in 34.5% of leaking sessions the final
      response falsely assures the user that nothing was disclosed.
    summary_zh: >-
      浏览器 agent 在不同网站之间切换时会把信息带在上下文里，一旦这些信息是用户的私密事实，就
      构成隐私风险。本文定义了「行为侧信道泄露」：即便被明确要求不得披露，agent 的动作本身仍会
      无意中暴露从先前网站获得的秘密 —— 比如读过会员记录后，在另一个网站上选了该机构专属的注册
      选项而非通用选项。AgentTell 基准含 20 个场景、100 个任务：agent 先在一个网站获得秘密，再
      到另一个同时提供「秘密相关选项」与「不泄露任何信息的通用选项」的网站完成任务。在六个骨架
      模型、9760 次会话上，携带秘密的 agent 有 61.1% 通过动作泄露了它；即便 agent 已在记忆里
      明确写下「该秘密不得分享」，仍有 56.7% 泄露；更糟的是，34.5% 的泄露会话里 agent 的最终
      回复还向用户错误保证「没有泄露」。

  - id: "2610.00450"
    title: "ZoneClaw: Mitigating Persistent Memory Attacks by Establishing Memory-Zoning in OpenClaw-Style Computer-Use Agents"
    abbr: "ZoneClaw"
    date: "2026-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop, cross]
    summary: >-
      OpenClaw-style computer-use agents run as long-lived assistants with persistent workspace
      memory — automatically reloaded files that hold user instructions, system summaries and
      external claims at the same privilege level, so remembering a claim confers authority over
      later behaviour. This enables a persistent memory attack: an attacker who controls only
      benign-looking external content induces the agent to record attacker-favoured claims during a
      legitimate task, and those claims later govern benign tasks the attacker never touches,
      extending "malicious context -> malicious response" into "malicious context -> memory
      injection -> malicious execution". Existing defenses act before content enters memory or at
      the action it induces, not on whether stored content may guide action. ZoneClaw separates
      persistence from authority with hierarchical trust zones: external claims persist in a
      low-trust zone and gain action-guiding authority only by crossing an explicit boundary, where
      promotion is cross-checked against zones the attacker cannot write; role-specific processes
      with asymmetric privilege ensure no process both ingests external content and acts outward.
      Across four attack scenarios, two injection settings and four backbones, attack success drops
      from 372/480 to 6/480 while utility is retained in 458/480 trials.
    summary_zh: >-
      OpenClaw 类计算机使用代理作为长期运行的助手，依赖持久化的工作区记忆：自动重载的文件里，
      用户指令、系统摘要与外部声明处于同一权限级别，于是「记住某个声明」就等于赋予了它支配后续
      行为的权力。这催生了「持久记忆攻击」：攻击者只需控制看似无害的外部内容，就能在一次合法任务
      中诱导 agent 记下有利于攻击者的声明，而这些声明此后会支配攻击者从未接触过的良性任务 ——
      攻击链从「恶意上下文→恶意回复」延伸为「恶意上下文→记忆注入→恶意执行」。已有防御要么在
      内容进入记忆前拦截、要么在它诱发的动作处拦截，却不管已存内容能否指导动作。ZoneClaw 用分层
      信任区把「持久化」与「权威性」拆开：外部声明留在低信任区，只有跨越显式的权限边界才能获得
      指导动作的权力，而晋升时要与攻击者无法直接写入的区域交叉核验；按角色划分、权限不对称的进程
      保证没有任何进程既摄入外部内容又对外行动。在四种攻击场景、两种注入设置与四个骨架上，攻击
      成功从 372/480 降到 6/480，同时 458/480 次试验保持了效用。

  - id: "2609.34974"
    title: "Before Acting, Change the State: Prospective State Intervention for Web Agents under Deceptive Interfaces"
    abbr: "Veer"
    date: "2026-09"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Deceptive interfaces can steer web agents toward outcomes that conflict with users' interests,
      and existing defenses mostly intervene on agent behaviour through blocking, guidance or
      replanning. The paper identifies a distinct failure mode: a task-valid action can still
      realize an unauthorized consequence because of the current web state — for instance a
      pre-checked add-on silently attached to a legitimate checkout. It therefore treats
      task-relevant web state itself as a runtime control target. Veer is an agent-side runtime
      defense that leaves planning to the base agent and, when a proposed action would produce an
      unauthorized consequence, first constructs a prospective intervention trajectory toward a safe
      task-relevant state and executes it with runtime grounding and verification. Across
      TrickyArena and WebDecept, Veer achieves the highest safe task completion in all three
      settings, beating the next-best defense by 15.9 and 25.0 points on TrickyArena-Single and
      -Multi, and cuts dark-pattern success on WebDecept to 0.3%. Gains hold across dark-pattern
      types and all 12 agent, model and benchmark configurations; ablations show active state
      intervention contributes the largest share.
    summary_zh: >-
      欺骗性界面会把 web agent 引向与用户利益相冲突的结果，而现有防御大多是对 agent 行为本身做
      干预 —— 拦截、引导或重新规划。本文指出一种不同的失效模式：一个对任务而言完全合法的动作，
      也可能因为当前网页状态而产生未经授权的后果（例如结账时被默认勾选的附加项）。因此作者把
      「与任务相关的网页状态」本身当作运行时的控制对象。Veer 是一个 agent 侧的运行时防御：规划
      仍交给基础 agent，一旦某个拟执行动作会产生未授权后果，Veer 先构造一条通往安全任务状态的
      前瞻性干预轨迹，在运行时 grounding 与校验下执行它，再让原动作落地。在 TrickyArena 与
      WebDecept 上，Veer 在三种评测设置中均取得最高的安全任务完成率，在 TrickyArena-Single 与
      -Multi 上分别领先次优防御 15.9 与 25.0 个百分点，并把 WebDecept 上暗黑模式的成功率压到
      0.3%。效果在各类暗黑模式与全部 12 种 agent/模型/基准组合上都成立，消融显示主动状态干预
      贡献最大。

  - id: "2609.36201"
    title: "SCOUT: Synergizing Reasoning and Tool-Use for Computer-Use Safety"
    abbr: "SCOUT"
    date: "2026-09"
    venue: "arXiv"
    section: "2.5"
    env: [desktop, cross]
    summary: >-
      Computer-use agents can cause unintended harm even under benign instructions and environments,
      and detecting it is hard for two reasons: it needs task-specific reasoning, since verifiers
      guided only by general safety criteria overlook subtle harmful behaviours; and it needs active
      investigation, since trajectory screenshots show what the agent did but not always what
      actually changed, so screenshot-only LLM-as-a-judge verifiers may miss real consequences.
      SCOUT is a two-stage agentic safety verifier. A rubric generator reasons extensively over the
      task and trajectory to produce task-specific completion and safety rubrics; a probing agent
      then follows those rubrics to interact with the post-execution environment and gather grounded
      evidence for the final judgment. SCOUT reaches 75.4 unsafe F1 and 74.5 completion F1 on
      AutoElicit-Bench, outperforming LLM-as-a-judge and naive tool-use verifiers, and leads OS-Blind
      with 76.4% unsafe detection accuracy. Used for test-time reflection, it reduces final unsafe
      execution from 30.2% to 17.2%. Ablations show that tool-free rubric generation is crucial,
      especially for non-frontier verifier backbones.
    summary_zh: >-
      计算机使用代理即便在良性指令与良性环境下也可能造成非预期危害，而检测这类危害有两个难点：
      一是需要针对具体任务的细致推理，只依据通用安全准则的验证器会漏掉大量隐蔽的有害行为；二是
      需要主动调查，因为轨迹截图只能说明 agent 做了什么，未必能说明环境里实际发生了什么变化，
      仅看截图的 LLM-as-a-judge 无法判断动作的真实后果。SCOUT 是一个两阶段的 agentic 安全验证器：
      先由评分标准生成器围绕任务与轨迹充分推理，生成该任务专属的「完成」与「安全」评分标准；再由
      探测 agent 按这些标准与执行后的环境交互，收集有据可依的证据做最终判断。SCOUT 在
      AutoElicit-Bench 上取得 75.4 的不安全 F1 与 74.5 的完成 F1，优于 LLM-as-a-judge 与朴素
      工具调用验证器；在 OS-Blind 上不安全检测准确率 76.4%，同样领先。将其用于测试时反思，可把
      最终不安全执行率从 30.2% 降到 17.2%。消融表明「不调用工具的评分标准生成」是关键，对非
      前沿骨架尤其如此。
