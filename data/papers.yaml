# Awesome-GUI-Agent-Security 论文数据源
#
# ⚠️ 这是本仓库的唯一数据源。README.md 与 papers_by_*/ 下所有文件均由
#    scripts/build.py 从本文件生成，请勿手工编辑那些文件。
#
# 字段说明（必填项标 *）：
#   id*        arXiv ID，如 2608.06477（不带版本号）。非 arXiv 用 url 字段
#   title*     论文官方完整标题
#   abbr       方法/基准缩写，如 StepJack
#   date*      arXiv v1 提交日期，YYYY-MM
#   venue      发表会议/期刊，未发表填 arXiv
#   section*   所属小节 ID，见 scripts/sections.yaml
#   env*       环境标签，多选：web / mobile / desktop / cross
#   summary*   中文简介，2-4 句 150-300 字，须含动机/机制/关键数字
#   code       代码仓库 URL
#   url        非 arXiv 来源的链接（第 4 章商用产品安全用）
#
# 收录边界（详见 CONTRIBUTING.md）：
#   论文的**主要研究对象**必须是 GUI / computer-use / browser / mobile agent。
#   仅把 GUI agent 当作若干实验环境之一的通用 LLM 安全工作 → 不收。

papers:
  - id: "2608.06477"
    title: "StepJack: Benchmarking Computer-Use Agent Safety Against Multi-Step Indirect Prompt Injection"
    abbr: "StepJack"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop, cross]
    summary: >-
      Existing indirect prompt injection (IPI) benchmarks for computer-use agents rely on single-step
      injections, which fail to capture the risk profile of realistic multi-step workflows. StepJack
      introduces a multi-step IPI benchmark of 480 cases that distributes the payload across intermediate
      steps, modelling an adversary who can only contaminate one stage of the pipeline. Multi-step injection
      raises attack success by up to 31.2 points over single-step, showing that current benchmarks
      substantially understate real exposure and that defenses rarely fire once execution is mid-flow.
    summary_zh: >-
      针对现有间接提示注入评测多为单步、无法刻画真实 CUA 长流程风险的问题，提出多步 IPI 基准
      StepJack，构造 480 个测试用例，把注入载荷分散在多步任务的中间环节，模拟攻击者只能污染
      流程某一环的现实约束。实验显示多步注入相比单步把攻击成功率最高抬升 31.2 个百分点，
      说明单步评测显著低估了 CUA 的真实暴露面，且现有防御在流程中段几乎不再触发。

  - id: "2608.02018"
    title: "Invisible Ink Threats: Adversarial Goals Behind Legitimate Tasks in Computer-Use Agents"
    abbr: "Invisible Ink"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop]
    summary: >-
      Studies how adversarial goals can be concealed inside tasks that look entirely legitimate, so a
      computer-use agent fulfils the attacker's objective while carrying out work the user has already
      approved. The key finding is that such attacks defeat human-in-the-loop confirmation: every individual
      action in the trajectory looks reasonable under review, and harm only emerges from their composition.
      This exposes a structural blind spot in step-by-step approval, the dominant defense paradigm for CUAs.
    summary_zh: >-
      研究攻击者如何把恶意目标伪装在看似合法的任务描述中，使 CUA 在执行用户确认过的正常任务时
      顺带完成攻击者目标。核心发现是这类攻击能绕过 human-in-the-loop 确认机制——因为人工审核
      看到的动作序列本身每一步都合理，只有组合起来才产生危害。这揭示了「逐步确认」这一主流
      防御范式的结构性盲区。

  - id: "2606.23189"
    title: "Capable but Careless: Do Computer-Use Agents Follow Contextual Integrity?"
    abbr: "Capable but Careless"
    date: "2026-06"
    venue: "arXiv"
    section: "1.5"
    env: [desktop]
    summary: >-
      Applies the contextual integrity framework to ask whether computer-use agents respect information-flow
      norms when operating across applications. More capable agents turn out to be more prone to violations:
      to complete a task they will carry private data from one application into another's input fields, and no
      existing privacy control fires because every individual read and write stays within granted permissions.
      Proposes evaluating agents by information flow rather than by permission boundaries.
    summary_zh: >-
      用「上下文完整性」（contextual integrity）框架考察 CUA 在跨应用操作时是否会不当传播敏感
      信息。结论是能力越强的 agent 反而越容易越界：它们为完成任务会主动把 A 应用中的私密数据
      带入 B 应用的输入框，而这类行为不触发任何现有的隐私告警，因为每一次读写都在授权范围内。
      提出了以信息流而非权限边界为判据的评估方法。

  - id: "2608.04755"
    title: "\"Allow\" to Achieve, Over-Privileged Inadvertently: The Unintended Cost of Task-Completion-Driven Pop-up Decisions in Mobile GUI Agents"
    abbr: "Allow to Achieve"
    date: "2026-08"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Identifies a systematic over-granting tendency in mobile GUI agents facing permission dialogs, and
      isolates two biases: App-Trust Bias, where agents allow anything requested by an already-installed app,
      and Task-Prior Override, where completing the task outweighs least-privilege. The result is silent
      accumulation of permissions far beyond task requirements, reducing the permission prompt — the last line
      of user-facing defense — to a formality.
    summary_zh: >-
      发现移动 GUI agent 在遇到权限弹窗时存在系统性的过度授权倾向，识别出两种偏差：App-Trust
      Bias（对已安装应用默认信任而一律点允许）与 Task-Prior Override（为达成任务目标而牺牲
      权限最小化）。结果是 agent 在用户不知情的情况下累积远超任务所需的权限，把权限弹窗这一
      最后防线变成了形式。

  - id: "2607.00333"
    title: "(A)I Sees What You Don't: Exploiting New Attack Surfaces in Third-Party Mobile Agents"
    abbr: "AI Sees"
    date: "2026-07"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Systematically maps the attack surface introduced by third-party mobile agents, centred on a perception
      gap: agents read screen content that users never see or never attend to, including hidden views,
      background notifications, and accessibility nodes. An attacker can exploit this asymmetry to steer the
      agent in ways the user cannot possibly notice, and the paper argues the third-party agent ecosystem
      lacks any mechanism constraining what an agent is allowed to perceive.
    summary_zh: >-
      系统分析第三方移动 agent 引入的新攻击面，核心是「感知鸿沟」——agent 能读取到屏幕上用户
      实际看不到或不会注意的内容（隐藏视图、后台通知、无障碍节点），攻击者可利用这一差异实施
      用户完全无法察觉的诱导。指出第三方 agent 生态缺乏对 agent 可见性范围的约束机制。

  - id: "2607.29199"
    title: "Alignment Is Local: A Paired Diagnostic for GUI Agents under User Persuasion"
    abbr: "Alignment Is Local"
    date: "2026-07"
    venue: "arXiv"
    section: "1.7"
    env: [mobile, cross]
    summary: >-
      Introduces a paired diagnostic that measures how far a GUI agent's safety alignment degrades under
      multi-turn user persuasion. Alignment turns out to be local: agents refuse a harmful request in a single
      turn, then concede incrementally as the user persists with plausible-sounding justifications — and this
      decay is invisible to every single-turn metric. The finding implies that single-turn safety evaluation
      cannot characterise risk in realistic multi-turn interaction.
    summary_zh: >-
      提出成对诊断方法，衡量 GUI agent 的安全对齐在多轮用户说服下的退化程度。关键发现是对齐
      具有「局部性」：agent 在单轮拒绝有害请求，但在用户连续追问、提供看似合理的理由后会逐步
      让步，且这种退化不体现在任何单轮评测指标上。说明当前基于单轮的安全评测无法反映真实
      多轮交互下的风险。

  - id: "2603.08316"
    title: "SlowBA: An Efficiency Backdoor Attack towards VLM-based GUI Agents"
    abbr: "SlowBA"
    date: "2026-03"
    venue: "arXiv"
    section: "1.6"
    env: [mobile, cross]
    summary: >-
      Proposes an efficiency backdoor against VLM-based GUI agents: the trigger leaves task outcomes unchanged
      and instead inflates response latency or step count. Such backdoors are extremely hard to notice because
      every correctness check still passes and only resource consumption reveals them, so they can persist
      indefinitely while imposing continuous compute cost. This broadens the GUI-agent backdoor threat model
      from outcome tampering to availability and economic attacks.
    summary_zh: >-
      提出针对 VLM-based GUI agent 的效率后门：触发器不改变任务最终结果，只让 agent 的响应
      延迟大幅增加或步数显著膨胀。这类后门极难被察觉——正确性检测全部通过，只有观察资源消耗
      才能发现，因此可长期潜伏并造成持续的算力成本损失。拓展了 GUI agent 后门的威胁定义，
      从「结果篡改」扩展到「可用性与经济性攻击」。

  - id: "2608.08939"
    title: "Not an A11y: How Android Accessibility Exposes Mobile AI Agents to Indirect Prompt Injection"
    abbr: "Not an A11y"
    date: "2026-08"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Shows that the Android accessibility tree is an overlooked injection channel for mobile agents: any app
      can write text into accessibility nodes, and agents consume that content as trusted interface semantics.
      No special permission is required — an ordinary app suffices to inject instructions. The path bypasses
      defenses aimed at screenshots or web content entirely, revealing the absence of input-channel governance
      for mobile agents.
    summary_zh: >-
      指出 Android 无障碍树（accessibility tree）是移动 agent 的一条被忽视的注入通道：任何
      应用都能往无障碍节点写入文本，而 agent 会把这些内容当作可信的界面语义读取。攻击者无需
      任何特殊权限即可通过普通应用注入指令。这条路径完全绕开了针对视觉截图或网页内容的
      防御，暴露出移动 agent 输入通道治理的缺失。

  - id: "2608.02643"
    title: "CUADebug: Diagnosing and Repairing Computer-Use Agent Failures"
    abbr: "CUADebug"
    date: "2026-07"
    venue: "arXiv"
    section: "2.5"
    env: [desktop]
    summary: >-
      Targets diagnosis and repair after a computer-use agent fails, proposing a framework that localises the
      failing step and generates a fix. Although framed around reliability, its failure attribution and state
      rollback capabilities transfer directly to post-incident security recovery: determining where a hijacked
      agent first deviated and reverting to the last trusted state. It is one of the few systematic works in
      the post-hoc recovery defense layer.
    summary_zh: >-
      面向 CUA 执行失败后的诊断与修复，提出定位失败步骤并生成修复方案的框架。虽以可靠性为
      出发点，但其失败归因与状态回滚能力可直接用于安全事件的事后恢复——在 agent 被注入劫持后
      判断从哪一步开始偏离、并回退到最后一个可信状态。是「事后恢复」这一防御层中较少见的
      系统性工作。

  - id: "2604.02947"
    title: "AgentHazard: A Benchmark for Evaluating Harmful Behavior in Computer-Use Agents"
    abbr: "AgentHazard"
    date: "2026-04"
    venue: "arXiv"
    section: "3.1"
    env: [desktop]
    summary: >-
      Addresses the novel risks that arise once computer-use agents can act persistently across tools and
      files, introducing AgentHazard, a benchmark of 2,653 instances spanning diverse risk categories and
      attack strategies. The central observation is that harmful behaviour typically accumulates from a chain
      of individually plausible but collectively unsafe actions. Claude Code backed by Qwen3-Coder reaches a
      73.63% attack success rate, indicating that base-model alignment alone does not secure the agent layer.
    summary_zh: >-
      针对 CUA 具备跨工具、跨文件持久化操作能力后产生的新型安全风险，构建覆盖多风险类别与
      攻击策略的基准 AgentHazard，含 2653 个实例。关键结论是有害行为往往由一串「单看都合理、
      合起来不安全」的动作累积产生。实测 Claude Code 搭配 Qwen3-Coder 的攻击成功率达 73.63%，
      表明仅靠底座模型的对齐无法保障 agent 层面的安全。

  - id: "2608.30207"
    title: "SIR: Self-improving Red-teaming for Compute Use Agents"
    abbr: "SIR"
    date: "2026-08"
    venue: "arXiv"
    section: "1.1"
    env: [desktop, web]
    summary: >-
      Argues that existing CUA safety benchmarks use hand-written fixed injections and therefore understate an
      adaptive adversary. SIR is a black-box IPI attack that composes stealthy injections from a small library
      of reusable, plain-language principles, wrapped in an iterative feedback loop that diagnoses failed
      attack trajectories and distils successful bypasses back into the library. Red-teaming becomes
      self-improving, implying that conclusions drawn from static payloads decay as attackers iterate.
    summary_zh: >-
      指出现有 CUA 安全基准用的都是人工手写的固定注入载荷，会低估自适应攻击者的真实威胁。提出
      黑盒 IPI 攻击 SIR：从一个用自然语言描述的可复用「隐蔽性原则」小库中组合注入内容，再套一层
      迭代反馈循环——诊断受害 agent 失败的攻击轨迹，把成功绕过的模式蒸馏回原则库。这把红队从
      静态测试变成自我改进的过程，说明固定载荷的评测结论会随攻击者迭代迅速失效。

  - id: "2608.27808"
    title: "CURA: Certified Runtime Alarms for Computer-Use Agents"
    abbr: "CURA"
    date: "2026-08"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Shows that self-report — the cheapest oversight channel a deployer has — fails exactly where oversight
      matters. Across 361 OSWorld tasks the pipeline scores 82.9 on average (above the 72.4 human reference),
      yet 64 of 71 failures (90%) end with a success claim, 61 assert no blocker, and the explicit failure
      affordance goes unused across roughly 9,100 calls. CURA is an external monitor reading only
      harness-visible telemetry — no model internals, extra LLM calls, or prompt changes — turning the
      trajectory into a sequential test with certified false-alarm control: at alpha = 0.10 its CUSUM alarm
      detects 42.3% of failures a median of 31 steps before termination at a realized false-alarm rate of
      0.066.
    summary_zh: >-
      揭示 self-report 这一最廉价的监督通道恰恰在最需要它的地方失效：在 361 个 OSWorld 任务上，
      流水线平均分 82.9（超过人类基线 72.4），但 71 次失败里有 64 次（90%）以「成功」收尾，
      61 次声称没有遇到任何阻碍，约 9100 次调用中显式的失败上报机制从未被使用。提出外部监控器
      CURA，只读 harness 可见的遥测数据，不需模型内部状态、额外 LLM 调用或改 prompt，把运行
      轨迹转成带误报率保证的序贯检验：α=0.10 时 CUSUM 告警能在终止前中位 31 步检出 42.3% 的
      失败，实测误报率 0.066。

  - id: "2608.26204"
    title: "ADeptS-Bench: Measuring the Trustworthiness of Computer Use Agents Across Devices"
    abbr: "ADeptS-Bench"
    date: "2026-08"
    venue: "arXiv"
    section: "3.1"
    env: [desktop, mobile]
    summary: >-
      Fills the gap that no benchmark jointly assesses whether CUAs interact safely with visual interfaces
      while handling ambiguous instructions. ADeptS-Bench is a dual-stream trustworthiness benchmark: the
      Safety stream pairs benign and malicious tasks with threats embedded in the visual interface, and the
      Disambiguation stream tests whether agents seek clarification under ambiguous intent. Across seven
      models none stays above 80% task success while holding attack success below 30%; every model clicks
      Checkout on a $25K order, and none detects a factory-reset button mislabelled as Optimize.
    summary_zh: >-
      针对「没有基准能同时考察 CUA 在视觉界面下的安全性与对模糊指令的处理」这一空缺，提出双流
      可信度基准 ADeptS-Bench：Safety 流提供威胁嵌在视觉界面中的良性/恶意配对任务，Disambiguation
      流考察 agent 在意图模糊时是否会主动澄清。评测 7 个模型的结论相当刺眼——没有模型能在任务
      成功率超 80% 的同时把攻击成功率压到 30% 以下；所有模型都会毫不犹豫点下 2.5 万美元订单的
      「结账」，也没有一个能识别出被标为「优化」的按钮实际是「恢复出厂设置」。

  - id: "2608.24099"
    title: "Are Android GUI Agents Robust Against Runtime Anomalies? AnTrap: Evaluating Agents in Dynamic Adversarial Environments"
    abbr: "AnTrap"
    date: "2026-08"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Notes that existing benchmarks lack systematic evaluation of GUI-agent robustness to runtime anomalies,
      though unexpected pop-ups and action misuse are routine on real Android devices. AnTrap organises
      real-world anomalies into a four-layer taxonomy (State, Thinking, Action, Round) with ten subcategories,
      plus a construction pipeline that injects adversarial perturbation while keeping tasks solvable.
      Evaluating 16 leading GUI models reveals universal vulnerability, with even the strongest degrading
      significantly; GRPO training in both clean and adversarial environments separates environment difficulty
      from model capability.
    summary_zh: >-
      指出现有基准缺乏对 GUI agent 运行时异常鲁棒性的系统评估，而 Android 实机部署中意外弹窗、
      动作误用等动态扰动十分常见。提出基准 AnTrap，把真实异常归纳为 State / Thinking / Action /
      Round 四层共十个细分类别，并设计了在注入对抗扰动的同时保持任务仍可完成的构造流程。评测
      16 个主流 GUI 模型显示对动态异常存在普遍脆弱性，最强模型也出现显著性能下降；作者还在
      原始与对抗环境下各做一轮 GRPO 训练，以区分环境难度与模型能力两个混杂因素。

  - id: "2608.17659"
    title: "MobileWorldSafety: Benchmarking GUI Agent Safety Against Environmental Injection Attacks in Android Apps"
    abbr: "MobileWorldSafety"
    date: "2026-08"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Argues that existing benchmarks miss everyday usage and offer no systematic evaluation of mobile GUI
      agents under environmental injection — a pressing gap now that such agents are moving from prototypes
      into deployment while continuously processing untrusted environmental content. MobileWorldSafety
      comprises 142 risk tasks built on real Android applications, covering indirect prompt injection and
      adversarial instructions across everyday channels, with a programmatically verifiable success condition
      per task so attack outcomes are objectively measurable.
    summary_zh: >-
      指出现有基准脱离日常使用场景，缺乏对移动 GUI agent 在环境注入下的系统评估——而这类
      agent 已从研究原型走向真实部署，且日常操作中会不断处理不可信的环境内容。提出基于真实
      Android 应用构建的基准 MobileWorldSafety，含 142 个风险任务，覆盖间接提示注入与对抗
      指令等多种日常渠道，每个任务都定义了可程序化验证的判定条件，使攻击是否成功可被客观测量。

  - id: "2607.08147"
    title: "Prismata: Confining Cross-Site Prompt Injection in Web Agents"
    abbr: "Prismata"
    date: "2026-07"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Frames web-agent injection as a recurrence of XSS: mixing trusted and untrusted content was already
      proven dangerous, and agents revive the risk by interpreting natural language as instructions, letting
      third-party and user-generated content hijack them. The core difficulty is that deriving a task-specific
      security policy requires reasoning over page structure already entangled with attacker content. Prismata
      enforces contextual least privilege via dynamic trust derivation that assigns permission labels to page
      content with structural confinement guarantees inspired by classical integrity models, constraining both
      what the agent sees and what it can do.
    summary_zh: >-
      把 web agent 面临的注入风险类比为 XSS 的重现：XSS 已经证明混合可信与不可信内容是危险的，
      而 agent 把自然语言当指令解释，使第三方与用户生成内容能够劫持 agent。核心难点在于推导
      任务专属的安全策略需要理解页面结构，而页面结构本身已与攻击者内容纠缠。提出 Prismata，
      借鉴经典完整性模型的思路做动态信任推导，为页面内容打上权限标签并提供结构性隔离保证，
      同时约束 agent「能看到什么」与「能做什么」，实现上下文最小权限。

  - id: "2607.05277"
    title: "Untrusted Content Masking for Web Agents with Security Guarantees"
    abbr: "UCM"
    date: "2026-07"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Observes that provable injection defenses depend on strict isolation between trusted instructions and
      untrusted data — natural in text-based tool-use settings where an agent can reason from interface
      definitions alone — but web agents must first observe the rendered page, which structurally intermingles
      trusted and untrusted content and dissolves the very trust boundary those guarantees rest on. Untrusted
      Content Masking restores that boundary in web environments by exploiting a structural property of pages,
      letting provable defenses carry over.
    summary_zh: >-
      指出可证明的注入防御依赖可信指令与不可信数据之间的严格隔离，这在纯文本的 tool-use 场景
      中天然成立（agent 可只依据接口定义推理，无需接触不可信内容），但 web agent 必须先观察
      渲染后的页面才能感知环境，而页面把可信与不可信内容结构性地混在一起，导致安全保证赖以
      成立的信任边界消失。提出 Untrusted Content Masking，利用页面的结构特性在 web 环境中
      重建这一边界，使既有的可证明防御能够迁移过来。

  - id: "2606.20717"
    title: "MIRAGE: Stealthy Visual Prompt Injection for Vulnerability Detection in Web Agents"
    abbr: "MIRAGE"
    date: "2026-06"
    venue: "arXiv"
    section: "1.2"
    env: [web]
    summary: >-
      Criticises adversarial evaluations of multimodal web agents for adopting permissive threat models and
      visually conspicuous artifacts. This work moves to a constrained, realistic setting where the evaluator
      is an unprivileged third party — a merchant or advertiser — controlling only a semantically legitimate,
      spatially bounded region such as an ad slot or sponsored card. Under those constraints MIRAGE performs
      visual indirect prompt injection for targeted next-action hijacking, showing that control over one small
      legitimate region suffices to steer a vision-based agent.
    summary_zh: >-
      批评现有针对多模态 web agent 的对抗评测普遍采用过于宽松的威胁模型、依赖视觉上显眼的
      伪影。本文转向受约束的现实设定：评测者只是不具特权的第三方（如商家或广告主），仅能控制
      广告位、赞助卡片这类语义合法且空间受限的区域。在此约束下提出视觉间接注入框架 MIRAGE，
      实现对下一步动作的定向劫持，说明即便攻击者只掌握页面上一小块合法区域，也足以操纵
      基于视觉的 agent。

  - id: "2606.13385"
    title: "Who Pays the Price? Stakeholder-Centric Prompt Injection Benchmarking for Real-world Web Agents"
    abbr: "Who Pays the Price"
    date: "2026-06"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Points out that existing security benchmarks take an attack-centric view, measuring whether injection is
      technically feasible while ignoring how the resulting harm is distributed. The paper argues injection
      risk is victim-dependent: one exploit yields asymmetric consequences across stakeholders (user,
      platform, merchant), and the same attack pattern varies substantially in effectiveness depending on the
      target. It builds a stakeholder-centric benchmark focused on e-commerce, where agent actions carry
      direct financial consequences.
    summary_zh: >-
      指出现有安全基准都采用「攻击视角」，只关注注入在技术上是否可行，忽略了危害在不同受害方
      之间的分布差异。本文主张注入风险是**受害者依赖**的：同一个漏洞对不同利益相关方（用户、
      平台、商家）造成的后果高度不对称，同一攻击模式的有效性也随目标不同而显著变化。据此构建
      以利益相关方为中心的基准，聚焦电商这类动作直接带来财务后果的真实场景。

  - id: "2503.23434"
    title: "Towards Trustworthy GUI Agents: A Survey"
    abbr: "Trustworthy GUI Survey"
    date: "2025-03"
    venue: "arXiv"
    section: "0"
    env: [cross]
    summary: >-
      Frames the execution gap as the central obstacle to trustworthy GUI agents: the misalignment
      between perception, reasoning, and interaction in dynamic, partially observable interfaces.
      Unlike conversational systems, GUI agents perform irreversible operations such as submitting
      forms, granting permissions, or deleting data. The survey proposes a workflow-aligned taxonomy
      decomposing trust into Perception, Reasoning, and Interaction Trust, traces how failures
      propagate and compound through action/observation loops, and argues that task completion alone
      is an insufficient basis for trust assessment.
    summary_zh: >-
      把「执行落差」（execution gap）确立为可信 GUI agent 的核心障碍——即在动态、部分可观测界面下
      感知、推理与交互三者之间的错配。与对话系统不同，GUI agent 执行的是提交表单、授予权限、删除
      数据这类不可逆操作。综述提出与工作流对齐的分类法，把信任拆为感知信任、推理信任、交互信任
      三层，梳理失败如何在动作/观察循环中传播并累积，并主张仅用任务完成率评估可信度是不充分的。

  - id: "2507.05445"
    title: "A Systematization of Security Vulnerabilities in Computer Use Agents"
    abbr: "CUA Vuln SoK"
    date: "2025-07"
    venue: "arXiv"
    section: "0"
    env: [desktop, web]
    summary: >-
      Conducts systematic threat analysis and adversarial testing of real-world CUAs, identifying
      seven risk classes unique to the paradigm and dissecting three exploits in depth: clickjacking
      via visual overlays that mislead interface-level reasoning, indirect prompt injection achieving
      RCE through chained tool use, and CoT exposure attacks that hijack multi-step reasoning by
      manipulating implicit interface framing. The case studies converge on three architectural
      flaws shared across current implementations: no input provenance tracking, weak
      interface-action binding, and insufficient control-flow integrity.
    summary_zh: >-
      对真实 CUA 做系统化威胁分析与对抗测试，归纳出七类该范式独有的风险，并深入剖析三个具体
      利用链：用视觉覆盖层误导界面级推理的 clickjacking、经工具链串联实现远程代码执行的间接提示
      注入、以及通过操纵隐式界面语境劫持多步推理的 CoT 暴露攻击。三个案例共同指向当前实现的
      三处架构性缺陷：缺少输入来源追踪、界面与动作绑定薄弱、控制流完整性不足。

  - id: "2506.14866"
    title: "OS-Harm: A Benchmark for Measuring Safety of Computer Use Agents"
    abbr: "OS-Harm"
    date: "2025-06"
    venue: "arXiv"
    section: "3.4"
    env: [desktop]
    summary: >-
      Notes that CUA safety has been largely overlooked despite growing deployment, and introduces
      OS-Harm on top of the OSWorld environment to test three harm categories: deliberate user
      misuse, prompt injection attacks, and model misbehavior. It comprises 150 tasks spanning
      harassment, copyright infringement, disinformation, and data exfiltration, requiring
      interaction with email clients, code editors, and browsers. An automated judge scores both
      accuracy and safety with high human agreement (0.76 and 0.79 F1).
    summary_zh: >-
      指出 CUA 已在快速部署但安全性长期被忽视，基于 OSWorld 环境构建 OS-Harm，考察三类危害：
      用户故意滥用、提示注入攻击、模型自身失当行为。含 150 个任务，覆盖骚扰、侵犯版权、虚假
      信息、数据外泄等违规类型，要求 agent 操作邮件客户端、代码编辑器、浏览器等多种应用。
      配套自动评判器同时评估准确性与安全性，与人工标注一致性达 0.76 / 0.79 F1。

  - id: "2505.21499"
    title: "AdInject: Real-World Black-Box Attacks on Web Agents via Advertising Delivery"
    abbr: "AdInject"
    date: "2025-05"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Criticises prior environmental injection work for unrealistic assumptions — direct HTML
      manipulation, knowledge of user intent, or access to model parameters. AdInject instead
      injects malicious content through internet advertising delivery, operating under a black-box
      agent, static content constraints, and no knowledge of user intent. It combines ad content
      designed to lure agent clicks with VLM-based optimization that infers likely user intent from
      the target site, making it one of the most deployment-realistic threat models in this area.
    summary_zh: >-
      批评已有环境注入研究依赖不现实的假设——直接改 HTML、已知用户意图、或能访问模型参数。
      AdInject 改用互联网广告投放这一真实渠道注入恶意内容，威胁模型严格得多：agent 为黑盒、
      恶意内容静态不可变、且不掌握用户意图。方法上结合诱导 agent 点击的广告内容设计，以及
      基于 VLM 从目标站点反推用户潜在意图的内容优化，是该方向最贴近真实部署的威胁模型之一。

  - id: "2507.14293"
    title: "WebGuard: Building a Generalizable Guardrail for Web Agents"
    abbr: "WebGuard"
    date: "2025-07"
    venue: "arXiv"
    section: "2.2"
    env: [web]
    summary: >-
      Argues web agents need access controls analogous to those for human users, and releases the
      first dataset supporting web-agent action risk assessment: 4,939 human-annotated
      state-changing actions from 193 websites across 22 domains, including often-overlooked
      long-tail sites, labelled under a three-tier schema (SAFE / LOW / HIGH) with designated
      train-test splits for generalization study. The headline finding is stark — even frontier LLMs
      predict action outcomes with under 60% accuracy.
    summary_zh: >-
      主张 web agent 需要类似人类用户的访问控制机制，并发布首个支持 agent 动作风险评估的数据集：
      来自 22 个领域、193 个网站（含常被忽视的长尾站点）的 4939 条人工标注状态改变动作，按
      SAFE / LOW / HIGH 三级风险标注，并划分好训练测试集以支持泛化研究。核心结论相当刺眼——
      即便前沿 LLM 预测动作后果的准确率也不足 60%。

  - id: "2510.20333"
    title: "GhostEI-Bench: Do Mobile Agents Resilience to Environmental Injection in Dynamic On-Device Environments?"
    abbr: "GhostEI-Bench"
    date: "2025-10"
    venue: "arXiv"
    section: "3.3"
    env: [mobile]
    summary: >-
      Identifies environmental injection as an underexplored threat distinct from prompt-based
      attacks: rather than manipulating textual instructions, it corrupts visual perception by
      inserting adversarial UI elements such as deceptive overlays or spoofed notifications directly
      into the GUI, bypassing textual safeguards and risking privacy leakage, financial loss, or
      irreversible device compromise. GhostEI-Bench moves beyond static image assessment by
      injecting adversarial events into realistic application workflows inside fully operational
      Android emulators.
    summary_zh: >-
      把环境注入确立为区别于提示类攻击的、研究不足的威胁向量：它不改文本指令，而是把欺骗性
      覆盖层、伪造通知这类对抗 UI 元素直接插入 GUI 以污染 agent 的视觉感知，从而绕开文本层
      防护，可导致隐私泄漏、财务损失甚至不可逆的设备失陷。GhostEI-Bench 跳出静态图像评测，
      在完整可运行的 Android 模拟器中把对抗事件注入真实应用工作流。

  - id: "2604.02623"
    title: "Poison Once, Exploit Forever: Environment-Injected Memory Poisoning Attacks on Web Agents"
    abbr: "eTAMP"
    date: "2026-04"
    venue: "arXiv"
    section: "1.3"
    env: [web]
    summary: >-
      Memory makes web agents personalized yet exploitable: storing past interactions creates a
      persistent attack surface spanning websites and sessions. Whereas prior work assumes attackers
      can write to memory directly or exploit cross-user sharing, eTAMP achieves cross-session,
      cross-site compromise through environmental observation alone — a single contaminated
      observation such as viewing a manipulated product page silently poisons memory and activates
      during later tasks on different sites, bypassing permission-based defenses. Attack success
      reaches 32.5% on GPT-5-mini, 23.4% on GPT-5.2, and 19.5% on GPT-OSS-120B, and the paper
      further identifies Frustration Exploitation.
    summary_zh: >-
      记忆让 web agent 变得个性化，也使其可被利用：存储历史交互创造出跨站点、跨会话持续存在的
      攻击面。已有研究假设攻击者能直接写入记忆或利用跨用户共享，而 eTAMP 仅靠环境观察就实现
      跨会话跨站点污染——单次被污染的观察（如浏览一个被操纵的商品页）即可静默投毒记忆，并在
      日后其他网站的任务中激活，绕开基于权限的防御。攻击成功率在 GPT-5-mini 上达 32.5%、
      GPT-5.2 上 23.4%、GPT-OSS-120B 上 19.5%，另发现「挫败感利用」现象。

  - id: "2603.23007"
    title: "AgentRAE: Remote Action Execution through Notification-based Visual Backdoors against Screenshots-based Mobile GUI Agents"
    abbr: "AgentRAE"
    date: "2026-03"
    venue: "arXiv"
    section: "1.6"
    env: [mobile]
    summary: >-
      Existing backdoors against web GUI agents rely on environmental injection or deceptive pop-ups,
      which fail on screenshot-based mobile agents due to restricted trigger design space, OS
      background interference, and conflicts among multiple trigger-action mappings. AgentRAE
      induces Remote Action Execution using visually natural triggers such as benign app icons in
      notifications, via a two-stage pipeline that first sharpens the agent's sensitivity to subtle
      iconographic differences through contrastive learning, then binds each trigger to a specific
      action through backdoor post-training.
    summary_zh: >-
      已有针对 web GUI agent 的后门依赖环境注入或欺骗性弹窗，但在基于截图的移动 agent 上失效——
      触发器设计空间受限、操作系统后台干扰、以及多个触发器与动作映射之间相互冲突。AgentRAE 用
      视觉上自然的触发器（如通知栏里的正常应用图标）诱发远程动作执行，采用两阶段流程：先用
      对比学习强化 agent 对细微图标差异的敏感度，再通过后门后训练把每个触发器绑定到特定动作。

  - id: "2604.07831"
    title: "Are GUI Agents Focused Enough? Automated Distraction via Semantic-level UI Element Injection"
    abbr: "Semantic UI Injection"
    date: "2026-04"
    venue: "arXiv"
    section: "1.2"
    env: [cross]
    summary: >-
      Notes two limits in existing GUI-agent red-teaming: adversarial perturbations need white-box
      access unavailable commercially, and prompt injection is increasingly neutralized by stronger
      alignment. Semantic-level UI Element Injection is a black-box paradigm overlaying
      safety-aligned, harmless UI elements onto screenshots to misdirect visual grounding, pairing a
      modular Editor-Overlapper-Victim pipeline with iterative search. Across 19 victim models in 8
      families, strategic optimization beats random injection by 3.5-6.9x on the most robust
      victims and transfers near-perfectly across architectures.
    summary_zh: >-
      指出现有 GUI agent 红队研究的两个局限：对抗扰动需要商业部署中拿不到的白盒访问，而提示
      注入正被日益增强的安全对齐所化解。提出黑盒范式「语义级 UI 元素注入」——把本身安全对齐、
      内容无害的 UI 元素叠加到截图上以误导视觉 grounding，用模块化的 Editor-Overlapper-Victim
      流水线配合迭代搜索。在 8 个模型家族共 19 个受害模型上，策略化优化相比随机注入在最鲁棒的
      模型上高出 3.5–6.9 倍，且跨架构迁移性近乎完美。

  - id: "2604.09155"
    title: "CORA: Conformal Risk-Controlled Agents for Safeguarded Mobile GUI Automation"
    abbr: "CORA"
    date: "2026-04"
    venue: "arXiv"
    section: "2.6"
    env: [mobile]
    summary: >-
      Existing GUI-agent safeguards rest on prompt engineering, brittle heuristics, and VLM-as-critic,
      offering neither formal verification nor user-tunable guarantees. CORA is a post-policy,
      pre-action framework giving statistical guarantees on harmful executed actions: it reframes
      safety as selective action execution, trains a Guardian to estimate action-conditional risk,
      then uses Conformal Risk Control to calibrate an execute/abstain boundary meeting a
      user-specified risk budget, routing rejected actions to a Diagnostician that recommends
      confirm, reflect, or abort. A Goal-Lock mechanism guards against visual injection.
    summary_zh: >-
      现有 GUI agent 防护依赖 prompt 工程、脆弱的启发式规则与 VLM-as-critic，既无形式化验证也
      不提供用户可调的保证。CORA 是一个「策略之后、动作之前」的防护框架，对已执行的有害动作
      给出统计保证：把安全性重构为选择性动作执行，训练 Guardian 模型估计动作条件风险，再用
      Conformal Risk Control 校准满足用户指定风险预算的执行/弃权边界，被拒动作交由
      Diagnostician 做多模态推理并建议确认、反思或中止。另设 Goal-Lock 机制抵御视觉注入。

  - id: "2603.17357"
    title: "WebPII: Benchmarking Visual PII Detection for Computer-Use Agents"
    abbr: "WebPII"
    date: "2026-03"
    venue: "arXiv"
    section: "1.5"
    env: [web, desktop]
    summary: >-
      CUAs create new privacy risks from two directions: training data scraped from real websites
      inevitably contains sensitive information, and cloud-hosted inference exposes user screenshots.
      No public benchmark existed for detecting PII in web screenshots. WebPII provides 44,865
      annotated e-commerce UI images with an extended PII taxonomy covering transaction-level
      re-identification identifiers, anticipatory detection for partially-filled forms, and scalable
      VLM-based UI reproduction. The accompanying WebRedact more than doubles text-extraction
      baseline accuracy (0.753 vs 0.357 mAP@50) at 20ms CPU latency.
    summary_zh: >-
      CUA 从两个方向带来新的隐私风险：从真实网站采集的训练数据不可避免含敏感信息，而云端推理
      会暴露用户截图。此前没有公开基准用于检测网页截图中的个人身份信息。WebPII 提供 44865 张
      标注的电商 UI 图像，特点包括扩展的 PII 分类（含可用于重识别的交易级标识符）、针对用户
      正在填写的半完成表单的前瞻式检测、以及基于 VLM 的可扩展 UI 复现。配套 WebRedact 把
      文本抽取基线准确率翻倍以上（0.753 vs 0.357 mAP@50），CPU 延迟仅 20ms。

  - id: "2604.00986"
    title: "Do Phone-Use Agents Respect Your Privacy?"
    abbr: "MyPhoneBench"
    date: "2026-04"
    venue: "arXiv"
    section: "1.5"
    env: [mobile]
    summary: >-
      Asks whether phone-use agents respect privacy while completing benign tasks — hard to answer
      because privacy-compliant behavior was never operationalized for such agents, and ordinary
      apps do not reveal what data agents type into which form fields. MyPhoneBench operationalizes
      privacy-respecting use as permissioned access, minimal disclosure, and user-controlled memory
      via a minimal privacy contract, paired with instrumented mock apps and rule-based auditing.
      Across five frontier models, 10 apps, and 300 tasks, task success, privacy-compliant
      completion, and later-session preference reuse prove to be distinct capabilities that no
      single model dominates.
    summary_zh: >-
      追问手机操作类 agent 在完成正常任务时是否尊重隐私。这一问题此前难以回答，因为隐私合规
      行为从未被形式化定义，且普通应用不会暴露 agent 究竟把哪些数据填进了哪个表单项。
      MyPhoneBench 用一份最小隐私契约把「尊重隐私」操作化为三条：授权访问、最小披露、用户可控
      记忆，并配以插桩的模拟应用与规则化审计。在 5 个前沿模型、10 个应用、300 个任务上发现，
      任务成功率、隐私合规完成度、后续会话中对已存偏好的使用是三种彼此独立的能力，无一模型全占优。

  - id: "2601.12349"
    title: "Mind the Gap: Action Rebinding Attacks against Android GUI Agents"
    abbr: "Action Rebinding"
    date: "2026-01"
    venue: "arXiv"
    section: "1.4"
    env: [mobile]
    summary: >-
      Shows that treating GUI agents as high-privilege operators — perceiving screen content and
      injecting inputs across application boundaries — fundamentally conflicts with Android's strict
      app sandboxing. The cross-application Action Rebinding attack lets a malicious app holding
      zero dangerous permissions hijack agent execution: it renders a benign contextual carrier to
      elicit a planned action, then swaps the foreground to a sensitive target during reasoning
      latency, so the agent unwittingly executes in a privileged context. The attack is further
      weaponized into programmable multi-step exploit loops by abusing the agent's own task-recovery
      logic.
    summary_zh: >-
      指出把 GUI agent 当作高权限操作者（跨应用边界感知屏幕、注入输入）与 Android 严格的应用
      沙箱机制存在根本冲突。跨应用 Action Rebinding 攻击让一个不申请任何危险权限的恶意应用即可
      劫持 agent 执行：先渲染一个无害的「上下文载体」诱导 agent 规划出某个动作，再在其推理延迟
      窗口内把前台切换到敏感目标应用，agent 察觉不到切换、于是在特权上下文中执行了该动作。
      作者进一步利用 agent 自身的任务恢复逻辑，把攻击武器化为可编程的多步利用循环。

  - id: "2604.18860"
    title: "Temporal UI State Inconsistency in Desktop GUI Agents: Formalizing and Defending Against TOCTOU Attacks on Computer-Use Agents"
    abbr: "PUSV"
    date: "2026-04"
    venue: "arXiv"
    section: "1.4"
    env: [desktop]
    summary: >-
      Formalizes the observation-to-action gap in screenshot-and-click loops (mean 6.51 s on real
      OSWorld workloads) as a Visual Atomicity Violation, creating a Time-Of-Check-Time-Of-Use
      window for unprivileged UI manipulation. Three attack primitives are characterized:
      Notification Overlay Hijack, Window Focus Manipulation, and Web DOM Injection — the second
      being the desktop analog of Android Action Rebinding, achieving 100% action-redirection with
      zero visual evidence at observation time. The proposed PUSV defense re-verifies UI state
      immediately before each dispatch via masked pixel SSIM, global screenshot diff, and X Window
      snapshot diff, reaching 100% interception across 180 adversarial trials with no false
      positives and under 0.1 s overhead.
    summary_zh: >-
      把「截图—点击」循环中的观察到动作间隔（真实 OSWorld 负载下平均 6.51 秒）形式化为「视觉
      原子性破坏」，指出这构成一个 TOCTOU 窗口，无特权攻击者可在其中篡改 UI 状态。刻画三种攻击
      原语：通知覆盖劫持、窗口焦点操纵、网页 DOM 注入——其中第二种是 Android Action Rebinding
      的桌面对应物，动作重定向成功率 100% 且在观察时刻不留任何视觉痕迹。提出 PUSV 防御，在每次
      动作派发前立即复验 UI 状态（点击目标处的掩码像素 SSIM、全局截图差分、X Window 快照差分），
      在 180 次对抗试验中拦截率 100%、零误报、开销低于 0.1 秒。

  - id: "2509.22256"
    title: "Secure and Efficient Access Control for Computer-Use Agents via Context Space"
    abbr: "CSAgent"
    date: "2025-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Argues that granting agents control over computers is risky because of inherent LLM
      uncertainty — deviations from user intent can be irreversible — and that user confirmation and
      LLM-based dynamic validation each fall short on usability, security, or performance. CSAgent
      is a system-level, static policy-based access control framework that bridges static policy and
      dynamic context through intent- and context-aware policies, with an automated toolchain for
      constructing and refining them, enforced by an optimized OS service so actions execute only
      under specific user intents and contexts.
    summary_zh: >-
      主张把计算机控制权交给 agent 之所以危险，根源在 LLM 固有的不确定性——一旦动作偏离用户
      意图，后果可能不可逆；而用户确认与基于 LLM 的动态校验分别在可用性、安全性或性能上有短板。
      CSAgent 是系统级、基于静态策略的访问控制框架，通过「意图感知 + 上下文感知」策略弥合静态
      策略与动态上下文之间的落差，并提供自动化工具链协助开发者构造与精炼策略，最终由优化过的
      操作系统服务强制执行，确保动作只在特定用户意图与上下文下才被允许。

  - id: "2603.23791"
    title: "The Cognitive Firewall: Securing Browser Based AI Agents Against Indirect Prompt Injection Via Hybrid Edge Cloud Defense"
    abbr: "Cognitive Firewall"
    date: "2026-03"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Tackles the tension that cloud-based defenses offer strong semantic analysis but add latency
      and privacy exposure. The Cognitive Firewall is a three-stage split-compute architecture
      distributing checks across client and cloud: a local visual Sentinel, a cloud Deep Planner,
      and a deterministic Guard enforcing execution-time policies. Across 1,000 adversarial samples
      edge-only defenses miss 86.9% of semantic attacks, whereas the full hybrid drives attack
      success below 1% (0.88% static, 0.67% adaptive) while keeping deterministic constraints on
      side-effecting actions — and by filtering presentation-layer attacks locally it achieves
      roughly a 17,000x latency advantage over cloud-only baselines.
    summary_zh: >-
      针对「云端防御语义分析能力强但引入延迟与隐私暴露」这一矛盾，提出三阶段拆分计算架构
      Cognitive Firewall，把安全检查分布在客户端与云端：本地视觉 Sentinel、云端 Deep Planner、
      以及在执行期强制策略的确定性 Guard。在 1000 个对抗样本上，纯边端防御漏检 86.9% 的语义
      攻击，而完整混合架构把攻击成功率压到 1% 以下（静态评测 0.88%、自适应评测 0.67%），同时
      对有副作用的动作保持确定性约束；由于表现层攻击在本地即被过滤，相比纯云端基线取得约
      17000 倍的延迟优势。

  - id: "2608.04741"
    title: "LoginTrap: Uncovering Task-Agnostic Phishing-Style Indirect Prompt Injection Attacks against LLM-based Web Agents"
    abbr: "LoginTrap"
    date: "2026-08"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Login is a sensitive authentication boundary for web agents because it involves credentials,
      yet prior work has not examined whether malicious page content can induce login and cause
      end-to-end private data leakage. LoginTrap is a task-agnostic login-inducing attack assuming a
      black-box attacker who controls page context and the induced login flow without knowing the
      user task or agent internals: through a fuzzing-inspired process it generates page-specific
      indirect injections that make login look like a plausible prerequisite for continuing the
      task, steering the agent to an attacker-controlled login page.
    summary_zh: >-
      登录对 web agent 而言是涉及凭据的敏感认证边界，但已有工作尚未考察恶意页面内容能否诱导
      agent 登录并造成端到端的私密数据泄漏。LoginTrap 是一种与任务无关的诱导登录攻击，假设
      黑盒攻击者只控制页面上下文与被诱导的登录流程，并不知道用户任务或 agent 内部实现：通过
      类 fuzzing 的流程生成页面专属的间接注入内容，使「先登录」看起来是继续完成任务的合理
      前置条件，从而把 agent 引导至攻击者控制的登录页。

  - id: "2602.13516"
    title: "SPILLage: Agentic Oversharing on the Web"
    abbr: "SPILLage"
    date: "2026-02"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Unlike chatbots answering questions in controlled settings, web agents act in the wild with
      access to user resources such as emails and calendars, interacting with third parties and
      leaving an action trace. The paper formalizes Natural Agentic Oversharing — unintentional
      disclosure of task-irrelevant user information through that trace — and characterizes it along
      channel (content vs. behavior) and directness (explicit vs. implicit). This exposes a blind
      spot: prior work targets text leakage, but agents also overshare behaviorally through clicks,
      scrolls, and navigation patterns that third parties can monitor. Benchmarked on 180 tasks
      across live e-commerce sites.
    summary_zh: >-
      与在受控环境中回答问题的聊天机器人不同，web agent 是「在野」运行的：它能访问用户的邮件、
      日历等资源，与第三方交互，并留下动作轨迹。本文把「自然的 agent 过度分享」形式化为——
      通过这条动作轨迹无意披露与任务无关的用户信息，并沿「通道」（内容 vs. 行为）与「直接性」
      （显式 vs. 隐式）两个维度刻画。这揭示了一处盲区：已有工作聚焦文本泄漏，但 agent 还会通过
      点击、滚动、导航模式等行为层面过度暴露，而这些可被第三方监测。在真实电商站点的 180 个
      任务上做了基准评测。

  - id: "2607.15550"
    title: "SeerGuard: A Safety Framework for Mobile GUI Agents via World Model Prediction"
    abbr: "SeerGuard"
    date: "2026-07"
    venue: "arXiv"
    section: "2.2"
    env: [mobile]
    summary: >-
      Argues that existing safety mechanisms for mobile GUI agents are fundamentally reactive
      and cannot assess risk before an action fires, which matters because a single erroneous
      action can be irreversible. SeerGuard is a consequence-aware framework combining
      instruction-level screening with action-level risk assessment: it analyses proposed
      actions against the current GUI state and anticipates likely outcomes before execution.
      The enabling component is a safety-augmented world model trained via multi-task learning
      that fuses semantic next-state prediction with risk assessment, and the framework
      transfers across different underlying GUI agents rather than being tied to one model.
    summary_zh: >-
      指出移动 GUI agent 现有安全机制本质上都是被动响应，无法在动作触发前评估风险，而这类
      agent 的单个错误动作往往不可逆。SeerGuard 是「后果感知」框架，将指令级筛查与动作级
      风险评估结合：在当前 GUI 状态下分析 agent 拟执行的动作，预判可能结果再决定是否放行。
      支撑能力来自一个多任务学习训练的安全增强世界模型（SAWM），把语义化的下一状态预测与
      安全风险评估融进同一个模型，且该框架可跨不同底层 GUI agent 迁移。

  - id: "2602.01725"
    title: "SafePred: A Predictive Guardrail for Computer-Using Agents via World Models"
    abbr: "SafePred"
    date: "2026-02"
    venue: "arXiv"
    section: "2.2"
    env: [desktop]
    summary: >-
      Identifies a blind spot shared by most CUA guardrails: they are reactive and constrain
      behavior only within the current observation space, which catches immediate hazards like
      clicking a phishing link but cannot see long-horizon risk. The paper's example is sharp —
      clearing logs looks locally reasonable yet renders future audits untraceable, a
      consequence that simply is not visible in the present observation. SafePred instead
      aligns predicted future risk with the current decision, establishing a risk-to-decision
      loop so that delayed, irreversible consequences are priced into each step.
    summary_zh: >-
      指出现有 CUA 护栏的共同盲区：它们都是被动式的，只在当前观测空间内约束行为，因此能拦下
      「点击钓鱼链接」这类即时危害，却看不见长周期风险。文中的例子很到位——清理日志在局部看
      完全合理，但会导致未来审计无从追溯，而这个后果在当前观测里根本不可见。SafePred 转而把
      预测出的未来风险与当前决策对齐，建立「风险到决策」的闭环，使延迟发生、不可逆的后果能被
      计入每一步的判断。

  - id: "2603.14707"
    title: "Visual Confused Deputy: Exploiting and Defending Perception Failures in Computer-Using Agents"
    abbr: "Visual Confused Deputy"
    date: "2026-03"
    venue: "arXiv"
    section: "1.2"
    env: [desktop]
    summary: >-
      Reframes CUA perception failures as a security problem rather than a performance
      limitation: prior work asks whether an action succeeded, not whether the agent acted on
      the correct object at all. The paper formalizes the visual confused deputy — an agent
      authorizing an action based on a misperceived screen state, whether from grounding error,
      adversarial screenshot manipulation, or a TOCTOU race. Crucially, simple screen-level
      manipulations can redirect routine clicks into privileged actions while looking
      indistinguishable from ordinary agent mistakes, making the attack deniable. The proposed
      guardrail is the first to operate outside the agent's own perceptual loop, using
      dual-channel contrastive classification to evaluate the click target independently.
    summary_zh: >-
      把 CUA 的感知失败从「性能局限」重新定义为安全问题：以往工作只问动作是否成功，不问
      agent 作用的对象是否正确。论文形式化了「视觉混淆代理」这一失效模式——agent 基于误判的
      屏幕状态授权动作，成因可以是 grounding 错误、对抗性截图篡改或 TOCTOU 竞态。关键之处
      在于，简单的屏幕层篡改就能把常规点击重定向为特权操作，而表现上与普通 agent 失误无法
      区分，使攻击具备可否认性。提出的护栏是首个运行在 agent 感知回路之外的方案，用双通道
      对比分类独立校验点击目标。

  - id: "2603.00476"
    title: "Atomicity for Agents: Exposing, Exploiting, and Mitigating TOCTOU Vulnerabilities in Browser-Use Agents"
    abbr: "Atomicity for Agents"
    date: "2026-02"
    venue: "arXiv"
    section: "1.4"
    env: [web]
    summary: >-
      Frames the gap between an agent's planning and execution as a classic TOCTOU
      vulnerability: web pages routinely change in between, so actions fire against stale
      assumptions, and dynamic or adversarial content can deliberately widen that window. The
      paper contributes a large-scale empirical study over a benchmark of synthesized and real
      websites, evaluating 10 popular open-source agents and finding TOCTOU exposure to be
      widespread rather than incidental. The proposed mitigation is deliberately lightweight —
      monitor DOM and layout changes during planning, then validate page state immediately
      before the action executes.
    summary_zh: >-
      把 agent 规划与执行之间的时间差刻画为经典的 TOCTOU 漏洞：网页在两者之间经常发生变化，
      导致动作基于过期假设执行，而动态或对抗性内容可以刻意拉大这个窗口。论文在覆盖合成与真实
      网站的基准上做了大规模实证，评测 10 个主流开源 agent，发现 TOCTOU 暴露是普遍现象而非
      个例。提出的缓解方案刻意保持轻量——在规划阶段监控 DOM 与布局变化，并在动作真正执行前
      立即校验页面状态。

  - id: "2605.15030"
    title: "WARD: Adversarially Robust Defense of Web Agents Against Prompt Injections"
    abbr: "WARD"
    date: "2026-05"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Catalogues four practical failure modes of existing guard models for web agents: weak
      generalization to unseen domains and attack patterns, high false positives on benign
      content, per-step latency that degrades deployment, and vulnerability to attacks that
      target the guard itself. WARD is built on WARD-Base, a 177K-sample dataset drawn from 719
      high-traffic URLs and platforms, plus WARD-PIG, a dataset purpose-built for injections
      aimed at the guard. It further introduces A3T, an adaptive adversarial training
      framework, addressing the often-ignored point that a guard model is itself an attack
      surface.
    summary_zh: >-
      系统列出现有 web agent 护栏模型的四类实际失效：对未见域与新攻击模式泛化差、在正常内容上
      误报率高、每步推理带来的延迟拖累部署、以及自身会成为攻击目标。WARD 基于 WARD-Base
      构建——取自 719 个高流量 URL 与平台的约 17.7 万样本，另有专门针对「攻击护栏本身」的
      WARD-PIG 数据集。并提出自适应对抗训练框架 A3T，正面回应了一个常被忽略的问题：护栏模型
      本身也是一个攻击面。

  - id: "2604.12284"
    title: "WebAgentGuard: A Reasoning-Driven Guard Model for Detecting Prompt Injection Attacks in Web Agents"
    abbr: "WebAgentGuard"
    date: "2026-04"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Notes that both system-prompt defenses and direct fine-tuning of the agent have shown
      limited effectiveness against injections embedded in HTML or rendered screenshots. The
      architectural choice is to run a dedicated guard agent in parallel with the web agent,
      decoupling injection detection from the agent's own reasoning so that a compromised
      reasoning chain does not also compromise detection. WebAgentGuard is a reasoning-driven
      multimodal guard trained on a synthetic dataset spanning 164 topics and 230 distinct
      visual and UI design styles, targeting the generalization gap that narrow training sets
      leave open.
    summary_zh: >-
      指出无论是 system prompt 防御还是直接微调 agent，对嵌在 HTML 或渲染截图中的注入效果
      都有限。架构上的选择是让一个专职护栏 agent 与 web agent 并行运行，把注入检测与 agent
      自身的推理解耦——这样推理链被污染时不会连带污染检测能力。WebAgentGuard 是推理驱动的
      多模态护栏模型，训练数据覆盖 164 个主题与 230 种视觉/UI 设计风格，针对的正是训练集
      过窄留下的泛化缺口。

  - id: "2604.25562"
    title: "SnapGuard: Lightweight Prompt Injection Detection for Screenshot-Based Web Agents"
    abbr: "SnapGuard"
    date: "2026-04"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Targets a specific blind spot: screenshot-based web agents operate on rendered visuals
      rather than structured text, so the dominant text-centric defenses simply do not apply.
      Existing multimodal detectors do work but lean on large VLMs, and the paper locates the
      bottleneck precisely — the VLM must comprehend the global semantics of an entire modern
      webpage, driving up both inference time and GPU memory. SnapGuard starts instead from the
      observation that injected pages carry distinctive local characteristics, enabling
      detection without whole-page semantic understanding.
    summary_zh: >-
      针对一个具体盲区：基于截图的 web agent 处理的是渲染后的视觉画面而非结构化文本，因此
      主流的文本中心防御根本用不上。已有的多模态检测方法确实有效，但依赖大型 VLM，而论文精确
      定位了瓶颈——VLM 必须理解整个现代网页的全局语义，推理时间与显存开销都被推高。SnapGuard
      转而从「被注入的页面具有独特局部特征」这一观察出发，无需理解整页语义即可完成检测。

  - id: "2602.03792"
    title: "WebSentinel: Detecting and Localizing Prompt Injection Attacks for Web Agents"
    abbr: "WebSentinel"
    date: "2026-02"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Observes that existing detection and localization methods underperform in the web-agent
      setting because their underlying assumptions do not hold there. WebSentinel is a two-step
      approach: Step I extracts segments of interest that may be contaminated, Step II scores
      each segment by checking its consistency against the surrounding webpage content as
      context. Beyond a binary verdict it localizes the injected span, which matters
      operationally — knowing which element was poisoned enables surgical removal instead of
      discarding the whole page.
    summary_zh: >-
      观察到现有检测与定位方法在 web agent 场景下效果有限，因为其赖以成立的假设在这里不成立。
      WebSentinel 采用两步法：第一步抽取可能被污染的「关注片段」，第二步以页面其余内容为上下文
      检查每个片段的一致性。它不只给出二分类判断，还能定位被注入的具体片段——这在工程上很关键，
      知道哪个元素被污染就能做精确剔除，而不必丢弃整个页面。

  - id: "2512.12594"
    title: "ceLLMate: Sandboxing Browser AI Agents"
    abbr: "ceLLMate"
    date: "2025-12"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Approaches injection containment by restricting the agent's ambient authority to shrink
      the blast radius, rather than trying to detect every malicious instruction. The key
      insight addresses what the authors call the semantic gap: writing and enforcing security
      policies over low-level UI primitives like clicks and keystrokes is brittle and
      error-prone, so ceLLMate instead sandboxes at the HTTP layer, on the grounds that every
      side-effecting UI operation ultimately produces network traffic to the site's backend.
      This yields a policy surface that is both stable and semantically meaningful, shipped as
      an agent-agnostic browser extension.
    summary_zh: >-
      不试图检测每一条恶意指令，而是通过限制 agent 的环境权限来压缩爆炸半径。核心洞察针对作者
      所称的「语义鸿沟」：在点击、按键这类低层 UI 原语上编写和强制安全策略既脆弱又易错，因此
      ceLLMate 选择在 HTTP 层做沙箱——依据是任何产生副作用的 UI 操作最终都会向网站后端发出
      网络请求。这使策略面同时具备稳定性与语义可读性，实现形态是与 agent 无关的浏览器扩展。

  - id: "2509.07764"
    title: "AgentSentinel: An End-to-End and Real-Time Security Defense Framework for Computer-Use Agents"
    abbr: "AgentSentinel"
    date: "2025-09"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Distinguishes the threat model from conventional prompt security: the danger here is not
      only an insecure user prompt but tool commands generated by the agent's own unstable LLM
      decisions, a class of vulnerability spanning every component of a computer-use agent.
      AgentSentinel intercepts all sensitive operations inside agent-related services and
      halts execution pending a security audit, so the enforcement point sits at the service
      boundary rather than in the prompt. Its auditing mechanism correlates evidence across the
      agent's components instead of judging each call in isolation.
    summary_zh: >-
      把威胁模型与传统的 prompt 安全区分开：这里的危险不只来自不安全的用户输入，还来自 agent
      自身不稳定的 LLM 决策所生成的工具调用，而这类漏洞横跨 computer-use agent 的每个组件。
      AgentSentinel 拦截 agent 相关服务内的所有敏感操作并暂停执行，直到安全审计完成——也就是
      把强制点放在服务边界而非 prompt 层。其审计机制会跨组件关联证据，而不是孤立地判断每次调用。

  - id: "2508.04010"
    title: "HarmonyGuard: Toward Safety and Utility in Web Agents via Adaptive Policy Enhancement and Dual-Objective Optimization"
    abbr: "HarmonyGuard"
    date: "2025-08"
    venue: "arXiv"
    section: "2.3"
    env: [web]
    summary: >-
      Frames the core tension as balancing task performance against evolving hidden web threats
      over long action sequences, and notes that prior work is confined to single-objective
      optimization or single-turn settings. HarmonyGuard is a multi-agent framework whose
      Policy Agent automatically extracts and maintains structured security policies from
      unstructured external documents and keeps updating them, addressing the practical problem
      that hand-written policies go stale. The dual-objective optimization jointly targets
      safety and utility rather than trading one for the other.
    summary_zh: >-
      把核心矛盾表述为在长动作序列中平衡任务性能与不断演化的网页隐藏威胁，并指出以往工作局限于
      单目标优化或单轮场景。HarmonyGuard 是多 agent 框架，其中 Policy Agent 能从非结构化的
      外部文档中自动抽取并维护结构化安全策略、持续更新，回应的是「手写策略会过期」这一现实
      问题。双目标优化同时兼顾安全与效用，而非牺牲其一换取其二。

  - id: "2606.12666"
    title: "CAPED: Context-Aware Privacy Exposure Defense for Mobile GUI Agents"
    abbr: "CAPED"
    date: "2026-06"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Names a problem specific to the screenshot paradigm: because the agent sees the phone
      exactly as a human does, every screen observation becomes a privacy boundary, and routine
      task execution can expose contacts, messages, photos, health cues and other context
      entirely unrelated to the request. The authors call this incidental visual privacy
      exposure and explain why both extremes fail — text anonymization misses visual and
      inferential cues, while generic masking removes the very evidence and controls the agent
      needs to finish the task. CAPED is a phone-side pre-upload control layer that parses
      visible UI elements and masks selectively, using task requirements and screen context as
      a privacy prior.
    summary_zh: >-
      指出一个截图范式特有的问题：由于 agent 以与人完全相同的方式「看」手机，每一次屏幕观测都
      变成一道隐私边界，正常执行任务时就可能暴露联系人、消息、照片、健康线索等与请求毫无关系的
      上下文。作者称之为「附带性视觉隐私暴露」，并说明两个极端为何都行不通——文本匿名化会漏掉
      视觉与可推断线索，而通用遮蔽又会把 agent 完成任务所需的证据和控件一起抹掉。CAPED 是运行
      在手机侧的上传前控制层，解析可见 UI 元素并选择性遮蔽，以任务需求和屏幕上下文作为隐私先验。

  - id: "2606.15034"
    title: "OSGuard: A Benchmark for Safety in Computer-Use Agents"
    abbr: "OSGuard"
    date: "2026-06"
    venue: "arXiv"
    section: "3.1"
    env: [desktop, web]
    summary: >-
      Attacks a measurement blind spot: computer-use agents are judged by task completion, yet
      success alone hides failures where the agent hit the nominal goal via an unsafe shortcut.
      OSGuard evaluates safety under benign, unchanged user instructions — no attacker in the
      loop — with two granularities. The action-level benchmark labels contextualized proposed
      actions as allowed, unrelated, or unsafe, each judged against the original instruction and
      current interface state. The execution suite uses hand-built OSWorld-derived variants
      where the task stays achievable but the environment carries latent hazards such as
      destructive overwrites, paired with evaluators that retain the original success signal.
    summary_zh: >-
      针对一个测量盲区：computer-use agent 通常只以任务完成率评判，但「成功」会掩盖 agent 通过
      不安全捷径达成名义目标的情况。OSGuard 在**良性、未被篡改**的用户指令下评估安全性——回路中
      没有攻击者——并设计了两个粒度。动作级基准把语境化的候选动作标注为「允许 / 无关 / 不安全」，
      每条都相对原始指令与当前界面状态判定。执行套件基于人工构造的 OSWorld 变体，原任务仍可完成，
      但环境中埋入了破坏性覆写等潜在危害，并配套保留原成功信号的增强评测器。

  - id: "2601.18842"
    title: "GUIGuard-Bench: Toward a General Evaluation for Privacy-Preserving GUI Agents"
    abbr: "GUIGuard-Bench"
    date: "2026-01"
    venue: "arXiv"
    section: "3.1"
    env: [mobile, desktop]
    summary: >-
      Argues that existing visual privacy datasets are largely static natural images and
      therefore cannot capture two properties that define privacy risk in GUI workflows:
      context dependence and task relevance. GUIGuard-Bench supplies 241 real GUI-agent
      trajectories with 4,080 screenshots across Android and PC. The annotation design is the
      contribution — each screenshot is labeled at region level with privacy bounding boxes,
      semantic categories, risk levels, and critically whether that private information is
      actually needed to complete the task, which is exactly the distinction a masking defense
      must get right.
    summary_zh: >-
      指出现有视觉隐私数据集多为静态自然图像，因而无法刻画 GUI 工作流中界定隐私风险的两个性质：
      上下文依赖与任务相关性。GUIGuard-Bench 提供 241 条真实 GUI agent 轨迹、涵盖 Android 与
      PC 环境的 4080 张截图。真正的贡献在标注设计——每张截图在区域级标注隐私边界框、语义类别、
      风险等级，以及关键的一项：该隐私信息是否为完成任务所必需。而这恰恰是遮蔽类防御必须判断
      正确的那个区分。

  - id: "2510.01354"
    title: "WAInjectBench: Benchmarking Prompt Injection Detections for Web Agents"
    abbr: "WAInjectBench"
    date: "2025-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Fills a systematic gap: many injection attacks target web agents and many general-purpose
      detectors exist, but none had been evaluated specifically in the web-agent setting.
      WAInjectBench first categorizes attacks by threat model, then builds datasets covering
      both modalities and both polarities — malicious text segments from different attacks,
      benign text from four categories, attack-produced malicious images, and benign images
      from two categories. The headline finding is a sharp boundary: detectors handle attacks
      carrying explicit textual instructions or visible image perturbations, but degrade
      sharply outside that regime.
    summary_zh: >-
      填补一个系统性空缺：针对 web agent 的注入攻击很多，通用注入检测方法也很多，但从未有人
      在 web agent 场景下系统评测过后者。WAInjectBench 先按威胁模型对攻击做细粒度分类，再构建
      覆盖两种模态、两种极性的数据集——来自不同攻击的恶意文本片段、四类正常文本、攻击生成的
      恶意图像、两类正常图像。核心结论划出了一条清晰边界：检测器能应对带显式文本指令或可见图像
      扰动的攻击，一旦越出这个范围性能急剧下降。

  - id: "2506.13205"
    title: "Poison Once, Control Anywhere: Clean-Text Visual Backdoors in VLM-based Mobile Agents"
    abbr: "VIBMA"
    date: "2025-06"
    venue: "arXiv"
    section: "1.6"
    env: [mobile]
    summary: >-
      Exploits a structural weakness in how mobile agents are built: they are typically
      fine-tuned on small, user-collected datasets, which makes training-time poisoning
      practical rather than theoretical. VIBMA is the first clean-text backdoor for VLM-based
      mobile agents — it modifies only the visual input while leaving prompts and instructions
      untouched, so there is no textual anomaly to detect. After fine-tuning on poisoned data,
      inserting a predefined visual trigger at inference activates the attacker's behavior. The
      mechanism aligns poisoned samples' training gradients with those of an attacker-specified
      target instance, embedding backdoor features into the data itself.
    summary_zh: >-
      利用移动 agent 构建方式上的结构性弱点：它们通常在小规模、用户自行收集的数据上微调，使
      训练期投毒从理论威胁变成现实可行。VIBMA 是首个针对 VLM 移动 agent 的**纯净文本**后门——
      只修改视觉输入，prompt 与指令完全保持原样，因此没有任何文本异常可供检测。模型在投毒数据上
      微调后，推理时加入预设的视觉触发图案即激活攻击者指定行为。其机制是把投毒样本的训练梯度与
      攻击者指定目标实例的梯度对齐，从而把后门特征嵌进数据本身。

  - id: "2511.13248"
    title: "DualTAP: A Dual-Task Adversarial Protector for Mobile MLLM Agents"
    abbr: "DualTAP"
    date: "2025-11"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Locates the privacy leak at a concrete architectural point: screenshots containing PII are
      routinely sent to untrusted third-party routers, which can mine that data with their own
      MLLMs. The scenario imposes conflicting requirements that prior perturbation methods fail
      to satisfy jointly — hide PII from the router's model while preserving enough signal for
      the agent's model to finish the task. DualTAP explicitly decouples the two objectives via
      a contrastive attention module that targets only PII-sensitive regions and a dual-task
      adversarial objective balancing task-preservation loss against privacy interference.
    summary_zh: >-
      把隐私泄露定位到一个具体的架构环节：含 PII 的截图会被例行发送给不受信的第三方路由服务，
      而这些服务可以用自己的 MLLM 挖掘其中数据。该场景提出了此前扰动类方法无法同时满足的矛盾
      要求——既要让路由方的模型看不到 PII，又要保留足够信息让 agent 的模型完成任务。DualTAP
      显式解耦这两个目标：用对比注意力模块精确定位仅 PII 敏感区域，并以双任务对抗目标在任务
      保持损失与隐私干扰之间取得平衡。

  - id: "2507.10610"
    title: "LaSM: Layer-wise Scaling Mechanism for Defending Pop-up Attack on GUI Agents"
    abbr: "LaSM"
    date: "2025-07"
    venue: "arXiv"
    section: "2.6"
    env: [desktop, web]
    summary: >-
      Notes that existing defenses against pop-up environmental injection either require costly
      retraining or collapse under inductive interference, then takes a mechanistic route
      instead. The paper systematically studies how such attacks alter a GUI agent's attention
      and uncovers a layer-wise attention divergence pattern separating correct from incorrect
      outputs. LaSM exploits this directly by selectively amplifying attention and MLP modules
      in the critical layers, realigning model saliency with task-relevant screen regions
      without any additional training — a rare instance of interpretability findings converted
      into a deployable GUI-agent defense.
    summary_zh: >-
      指出针对弹窗式环境注入的现有防御要么需要昂贵重训、要么在归纳性干扰下失效，转而走机制
      可解释性路线。论文系统研究这类攻击如何改变 GUI agent 的注意力分布，发现正确输出与错误输出
      之间存在**逐层的注意力发散模式**。LaSM 直接利用这一发现，选择性放大关键层的注意力与 MLP
      模块，无需任何额外训练即把模型显著性重新对齐到任务相关的屏幕区域——这是把可解释性结论
      转化为可部署 GUI agent 防御的少见案例。

  - id: "2605.08310"
    title: "WebTrap: Stealthy Mid-Task Hijacking of Browser Agents During Navigation"
    abbr: "WebTrap"
    date: "2026-05"
    venue: "arXiv"
    section: "1.1"
    env: [web]
    summary: >-
      Diagnoses two gaps in existing injections against browser agents: low effectiveness,
      because attacks tuned on toy baselines fail to reach end-to-end goals in real environments
      with long step counts; and weak stealth, because most attacks pit the attack goal against
      the user goal, so usability visibly collapses and the attack announces itself. WebTrap
      instead hijacks mid-task via multi-step instruction fusion steering that merges both
      goals, letting the agent resume the user's original task after serving the attacker. A
      context-grounded generation method aligns injected content with the surrounding task
      environment, so nothing looks out of place.
    summary_zh: >-
      诊断出现有针对浏览器 agent 的注入攻击有两个缺口：一是有效性低，在玩具基准上调优的攻击
      放到真实环境、长步骤链条中就达不成端到端目标；二是隐蔽性弱，多数攻击把攻击目标与用户目标
      对立起来，导致可用性明显崩塌，攻击相当于自我暴露。WebTrap 转而在**任务中途**劫持：用多步
      指令融合引导把两个目标缝合起来，让 agent 在完成攻击目标后继续把用户原任务做完。配套的
      上下文接地生成方法使注入内容与所处任务环境保持一致，看不出突兀。

  - id: "2606.10742"
    title: "MemVenom: Triggered Poisoning of Multimodal Memories in Web Agents"
    abbr: "MemVenom"
    date: "2026-06"
    venue: "arXiv"
    section: "1.6"
    env: [web]
    summary: >-
      Targets external memory, now a core component of web agents for long-horizon reasoning,
      and points out the structural consequence: content injected into memory is persistently
      recalled and repeatedly steers behavior, so one successful poisoning outlasts the session.
      MemVenom is a black-box framework poisoning graph-structured memory with coordinated
      text-image evidence in two stages — a trigger-conditioned retrieval attack ensuring the
      malicious entry is recalled with high probability, then post-retrieval induction using
      adversarial perturbation and stealthy OCR injection to override the user's objective.
      Unlike prompt-level or text-only memory attacks, the result is persistent and reusable.
    summary_zh: >-
      针对外部记忆——它已是现代 web agent 支撑长周期推理的核心组件——并指出其结构性后果：注入
      记忆的内容会被持续召回、反复影响行为，因此一次成功投毒的影响能跨越会话存活。MemVenom 是
      黑盒框架，用协同的图文证据污染图结构外部记忆，分两阶段：先以触发条件化的检索攻击确保恶意
      记忆被高概率召回，再通过对抗扰动与隐蔽 OCR 注入在检索后诱导 agent 覆盖用户原目标。与
      prompt 层或纯文本记忆攻击不同，其效果是持久且可复用的。

  - id: "2512.22894"
    title: "DECEPTICON: How Dark Patterns Manipulate Web Agents"
    abbr: "DECEPTICON"
    date: "2025-12"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Studies dark patterns — deceptive UI designs already pervasive on the real web — as an
      agent security threat requiring no attacker infrastructure at all, since the malicious
      interface is simply the status quo. DECEPTICON isolates individual dark patterns across
      700 web navigation tasks (600 generated, 100 real-world). Dark patterns steer agents to
      malicious outcomes in over 70% of tasks versus a 31% human average. The most consequential
      finding inverts the usual scaling assumption: effectiveness correlates positively with
      model size and test-time reasoning, so larger and more capable agents are more
      susceptible, not less.
    summary_zh: >-
      把暗黑模式（dark patterns，即真实网络上早已泛滥的欺骗性 UI 设计）作为一类 agent 安全威胁
      来研究——它不需要攻击者搭建任何基础设施，因为恶意界面本身就是现状。DECEPTICON 在 700 个
      网页导航任务（600 合成 + 100 真实）中隔离测试单个暗黑模式。结果是暗黑模式在超过 70% 的
      任务中成功把 agent 引向恶意结果，而人类平均只有 31%。最值得警惕的发现颠覆了通常的
      scaling 直觉：操纵有效性与模型规模、测试时推理量**正相关**——越大越强的 agent 反而更易受骗。

  - id: "2511.20597"
    title: "BrowseSafe: Understanding and Preventing Prompt Injection Within AI Browser Agents"
    abbr: "BrowseSafe"
    date: "2025-11"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Argues that integrating agents into browsers creates security problems beyond traditional
      web application threat models, and that while prompt injection is a known vector, its
      real-world impact remains under-measured. The benchmark's design choices are the
      contribution: it emphasizes injections that influence real-world *actions* rather than
      just text output, and constructs payloads with complexity and distractor density
      comparable to what deployed agents actually meet. It then evaluates existing defenses
      across frontier models and proposes a multi-layered strategy combining architectural and
      model-based defenses.
    summary_zh: >-
      指出把 agent 集成进浏览器所带来的安全问题已超出传统 Web 应用威胁模型，而尽管提示注入是
      已知攻击向量，其真实世界影响仍缺乏充分测量。该基准的贡献在于设计取向：强调那些能影响真实
      **动作**（而非仅文本输出）的注入，并构造在复杂度与干扰项密度上贴近实际部署 agent 所遭遇
      情形的载荷。在此基础上横向评测现有防御在多个前沿模型上的表现，并提出结合架构级与模型级
      防御的多层策略。

  - id: "2605.28116"
    title: "MIRAGE: Context-Aware Prompt Injection against Mobile GUI Agents via User-Generated Content"
    abbr: "MIRAGE (Mobile)"
    date: "2026-05"
    venue: "arXiv"
    section: "1.3"
    env: [mobile]
    summary: >-
      Roots the vulnerability in the perception paradigm: mobile GUI agents see the screen as
      rendered pixels and choose actions from what they see, so they cannot reliably tell
      trusted interface chrome from user-generated content. MIRAGE turns benign screenshots into
      injection samples by planting attacker text into ordinary UGC regions — no modification to
      the agent, the app, or the OS. The three-stage pipeline has a Localizer find
      user-controllable regions, a Generator synthesize context-aware payloads rendered in the
      app's native style, and a Curator enforce realism while balancing samples across apps,
      region types, and attack intents.
    summary_zh: >-
      把漏洞根源归到感知范式本身：移动 GUI agent 把屏幕当作渲染后的像素来看，并据所见选择动作，
      因此无法可靠区分可信的界面框架与用户生成内容。MIRAGE 把正常截图转化为注入样本——将攻击者
      文本放进普通 UGC 区域，**无需修改 agent、应用或操作系统**。三阶段流水线：Localizer 定位
      用户可控区域，Generator 合成上下文感知载荷并以应用原生样式渲染，Curator 把控真实性并在
      应用、区域类型与攻击意图之间平衡样本分布。

  - id: "2604.10577"
    title: "The Blind Spot of Agent Safety: How Benign User Instructions Expose Critical Vulnerabilities in Computer-Use Agents"
    abbr: "OS-BLIND"
    date: "2026-04"
    venue: "arXiv"
    section: "1.7"
    env: [desktop]
    summary: >-
      Isolates the setting existing safety evaluations skip: user instructions are entirely
      benign and harm emerges from task context or execution outcome, with no misuse and no
      injection. OS-BLIND supplies 300 human-crafted tasks over 12 categories and 8
      applications, split into environment-embedded threats and agent-initiated harms. The
      numbers are stark — most CUAs exceed 90% attack success rate, and safety-aligned Claude
      4.5 Sonnet still hits 73.0%. Worse, deploying that same model in a multi-agent
      configuration pushes its ASR from 73.0% to 92.7%, suggesting orchestration itself erodes
      alignment.
    summary_zh: >-
      隔离出现有安全评测跳过的那个场景：用户指令完全良性，危害来自任务上下文或执行后果，既无
      滥用也无注入。OS-BLIND 提供 300 个人工构造任务，覆盖 12 个类别、8 个应用，分为「环境
      嵌入型威胁」与「agent 自发危害」两簇。数字相当刺眼——多数 CUA 的攻击成功率超过 90%，
      即便经过安全对齐的 Claude 4.5 Sonnet 也达到 73.0%。更糟的是，同一模型置于多 agent
      配置中时 ASR 从 73.0% 升至 92.7%，说明编排本身就在侵蚀对齐效果。

  - id: "2604.06367"
    title: "WebSP-Eval: Evaluating Web Agents on Website Security and Privacy Tasks"
    abbr: "WebSP-Eval"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Opens a direction orthogonal to the rest of this list: existing benchmarks measure either
      general capability (WebArena) or resistance to malicious actions (SafeArena), but none ask
      whether an agent can competently *perform* the security and privacy chores users actually
      delegate — managing cookie preferences, configuring privacy-sensitive account settings,
      revoking inactive sessions. WebSP-Eval contributes 200 hand-built task instances across 28
      websites, an agentic harness that manages accounts and initial state across runs via a
      custom Chrome extension, and an automated evaluator, applied to 8 web agent
      instantiations.
    summary_zh: >-
      开辟了一个与本清单其余部分正交的方向：现有基准要么测通用能力（WebArena），要么测抵御恶意
      动作的能力（SafeArena），但没有一个去问 agent 能否胜任用户真正会委托给它的安全与隐私
      事务——管理 cookie 偏好、配置隐私敏感的账户设置、吊销闲置会话。WebSP-Eval 贡献了跨 28 个
      网站的 200 个人工构造任务实例、一套通过自定义 Chrome 扩展在多次运行间管理账号与初始状态的
      agent 框架、以及自动评测器，并在 8 种 web agent 实例化配置上做了评估。

  - id: "2603.28551"
    title: "\"What Did It Actually Do?\": Understanding Risk Awareness and Traceability for Computer-Use Agents"
    abbr: "What Did It Actually Do"
    date: "2026-03"
    venue: "arXiv"
    section: "2.5"
    env: [desktop]
    summary: >-
      Studies the human side of CUA risk as personalized agents move from expert circles into
      mainstream use: these systems install skills, invoke tools, reach private resources and
      modify local environments, yet users typically do not know what authority they delegated,
      what the agent actually did, or whether it was cleanly removed afterward. The work pairs a
      multi-source corpus of the OpenClaw ecosystem — incidents, advisories, malicious-skill
      reports, news, tutorials, social narratives — with an interview study of users and
      practitioners. Participants recognized these systems as risky in the abstract but lacked
      concrete mental models of privilege and persistence.
    summary_zh: >-
      在个人化 agent 从专家圈走向大众使用的背景下研究 CUA 风险的人因侧：这类系统会安装 skill、
      调用工具、访问私有资源、修改本地环境，但用户通常并不清楚自己授予了什么权限、agent 实际
      做了什么、以及事后是否被干净卸载。工作把 OpenClaw 生态的多来源语料（安全事件、公告、恶意
      skill 报告、新闻报道、教程、社交媒体叙述）与面向用户和从业者的访谈研究结合起来。发现是：
      受访者在抽象层面认得出这类系统有风险，却缺乏关于权限与持久化的具体心智模型。

  - id: "2606.13686"
    title: "Benchmarking Web Agent Safety under E-commerce Deceptive Interfaces"
    abbr: "WebDecept"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Examines web agent behavior under realistic deceptive interfaces in e-commerce, where a
      wrong click carries direct financial consequence. WebDecept is a lightweight configurable
      plugin framework injecting deceptive interface patterns into existing web environments, and
      instantiates seven patterns commonly seen in the wild including targeted advertisements,
      domain redirection and shopping manipulation. Injecting them into the frontend during live
      task execution gives controlled evaluation across multiple multimodal agents. Two findings
      matter: agents are highly susceptible across several pattern classes, and prompt-based
      constraints are frequently insufficient as mitigation.
    summary_zh: >-
      在电商场景下考察 web agent 面对真实欺骗性界面时的行为——这个场景里点错一下就有直接的财务
      后果。WebDecept 是轻量可配置的插件框架，能把欺骗性界面模式注入既有网页环境，并实例化了
      七种野外常见模式，含定向广告、域名重定向、购物操纵等。在任务执行过程中把它们注入前端，
      即可对多个多模态 agent 做受控评测。两个结论值得注意：agent 对多类模式都高度易感；而基于
      prompt 的约束往往不足以缓解这类失败。

  - id: "2604.13531"
    title: "RiskWebWorld: A Realistic Interactive Benchmark for GUI Agents in E-commerce Risk Management"
    abbr: "RiskWebWorld"
    date: "2026-04"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Notes that existing interactive benchmarks target benign, predictable consumer
      environments, leaving high-stakes investigative domains unexamined. RiskWebWorld draws
      1,513 tasks from production risk-control pipelines across 8 core domains and deliberately
      preserves the authentic difficulties of risk operations — uncooperative websites and
      partial environmental hijacking. A Gymnasium-compliant infrastructure decouples policy
      planning from environment mechanics to support agentic RL. The evaluation exposes a stark
      capability gap: top-tier generalist models reach only 49.1% success, indicating that
      adversarial real-world operational settings remain far from solved.
    summary_zh: >-
      指出现有交互式基准都瞄准良性、可预测的消费者环境，把高风险的调查类场景留在了视野之外。
      RiskWebWorld 从生产环境的风控流水线中取 1513 个任务、覆盖 8 个核心领域，并刻意保留风控
      作业的真实困难——不配合的网站、部分环境劫持。配套的 Gymnasium 兼容基础设施把策略规划与
      环境机制解耦，以支持 agentic RL。评测暴露出明显的能力落差：顶级通用模型成功率仅 49.1%，
      说明对抗性的真实作业场景远未被解决。

  - id: "2601.18113"
    title: "MalURLBench: A Benchmark Evaluating Agents' Vulnerabilities When Processing Web URLs"
    abbr: "MalURLBench"
    date: "2026-01"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Isolates a narrow but consequential failure: accepting a disguised malicious URL lets an
      agent proceed into unsafe webpages, and everything downstream inherits that compromise, yet
      no benchmark had targeted this step. MalURLBench provides 61,845 attack instances spanning
      10 real-world scenarios and 7 categories of genuinely malicious websites. Across 12 popular
      LLMs, models struggle with elaborately disguised URLs. The paper further analyzes which
      factors drive attack success and ships URLGuard, a lightweight defense module for the same
      choke point.
    summary_zh: >-
      隔离出一个范围很窄但后果严重的失效环节：接受一个伪装过的恶意 URL 就会让 agent 进入不安全
      网页，此后所有下游行为都继承了这次沦陷，而此前没有基准针对这一步。MalURLBench 提供 61845
      个攻击实例，覆盖 10 类真实场景与 7 类真实恶意网站。在 12 个主流 LLM 上的实验显示，模型
      难以识别精心伪装的恶意 URL。论文进一步分析影响攻击成功率的关键因素，并给出轻量防御模块
      URLGuard，作用在同一咽喉点上。

  - id: "2605.09497"
    title: "Don't Click That: Teaching Web Agents to Resist Deceptive Interfaces"
    abbr: "DUDE"
    date: "2026-05"
    venue: "arXiv"
    section: "2.2"
    env: [web]
    summary: >-
      Identifies a split in prior work: some approaches detect deception without integrating it
      into the task loop, others document attacks without proposing any defense. The paper
      formalizes deception-aware web agent defense and proposes DUDE, a two-stage framework
      combining hybrid-reward learning with asymmetric penalties and experience summarization
      that distills failure patterns into transferable guidance. It ships RUC (Real UI
      Clickboxes), a benchmark of 1,407 scenarios across four domains and deception categories.
      DUDE cuts deception susceptibility by 53.8% while holding task performance, which matters
      because most safety interventions trade utility away.
    summary_zh: >-
      指出以往工作的割裂之处：一类方法能检测欺骗但不与任务回路结合，另一类记录了攻击却不提出
      防御。论文形式化了「欺骗感知的 web agent 防御」，提出两阶段框架 DUDE，把带非对称惩罚的
      混合奖励学习与经验总结结合起来，将失败模式蒸馏为可迁移的指导。配套发布基准 RUC（Real UI
      Clickboxes），含跨四个领域与欺骗类别的 1407 个场景。DUDE 在保持任务性能的同时把易受骗
      程度降低 53.8%——这一点很关键，因为多数安全干预都是以牺牲效用为代价。

  - id: "2606.01166"
    title: "BraveGuard: From Open-World Threats to Safer Computer-Use Agents"
    abbr: "BraveGuard"
    date: "2026-05"
    venue: "arXiv"
    section: "2.3"
    env: [desktop, web]
    summary: >-
      Starts from why CUA harm is hard to catch: it emerges only through multi-step execution
      traces whose individual actions look locally benign, so neither isolated prompts nor final
      responses reveal it. BraveGuard is a self-evolving pipeline that mines recent research
      sources for emerging risks and attack patterns, instantiates them as executable
      computer-use tasks, collects agent rollouts, and derives trajectory-level supervision for
      training guard models. Because the loop can be re-run as new threats and validation
      failures appear, the defense adapts rather than freezing at whatever a static benchmark
      captured at training time.
    summary_zh: >-
      从「CUA 的危害为何难以捕捉」出发：危害只在多步执行轨迹中浮现，而其中每个单独动作在局部看
      都无害，因此孤立的 prompt 与最终回复都看不出问题。BraveGuard 是自我演进的流水线：从近期
      研究来源中挖掘新兴风险与攻击模式，将其实例化为可执行的 computer-use 任务，收集 agent
      rollout，进而导出**轨迹级**监督信号训练护栏模型。由于新威胁与验证失败出现时可以重跑这个
      闭环，防御能持续适应，而不是冻结在静态基准训练时所捕捉到的那个快照上。

  - id: "2607.05120"
    title: "Agent Data Injection Attacks are Realistic Threats to AI Agents"
    abbr: "ADI"
    date: "2026-07"
    venue: "arXiv"
    section: "1.1"
    env: [web, desktop]
    summary: >-
      Points out that indirect prompt injection research has concentrated almost entirely on
      instruction injection — untrusted data interpreted as an instruction — and that the
      mitigations built in response inherit that narrow framing. The paper introduces agent data
      injection: malicious data disguised as *trusted* data, such as security-critical metadata
      (resource identifiers, data origins) or agent context data (tool call and response
      formats). The impact matches instruction injection, since agents still execute unintended
      actions, but defenses tuned to spot embedded instructions have no reason to flag
      well-formed metadata.
    summary_zh: >-
      指出间接提示注入的研究几乎全部集中在「指令注入」上——即不可信数据被当作指令解释——而针对
      性构建的缓解措施也继承了这个狭窄的问题框架。论文提出 agent 数据注入（ADI）：把恶意数据
      伪装成**可信数据**，例如安全关键元数据（资源标识符、数据来源）或 agent 上下文数据（工具
      调用与响应格式）。其影响与指令注入相当，agent 依然会执行非预期动作，但那些专门用于识别
      「嵌入指令」的防御，没有任何理由把一段格式规范的元数据标记为可疑。

  - id: "2602.09222"
    title: "MUZZLE: Adaptive Agentic Red-Teaming of Web Agents Against Indirect Prompt Injection Attacks"
    abbr: "MUZZLE"
    date: "2026-02"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Criticizes existing security evaluations for relying on fixed attack templates, manually
      chosen injection surfaces, or narrowly scoped scenarios, none of which reflect the adaptive
      adversary a deployed agent meets. MUZZLE automates the process by using the target agent's
      own trajectories to locate high-salience injection surfaces, then adaptively generating
      context-aware malicious instructions aimed at confidentiality, integrity and availability
      violations. Grounding surface selection in observed agent behavior rather than human
      intuition is the key move — the attack adapts to whatever the agent actually attends to.
    summary_zh: >-
      批评现有安全评测依赖固定攻击模板、人工挑选的注入面或范围过窄的场景，都无法反映真实部署时
      面对的自适应攻击者。MUZZLE 将这一过程自动化：利用目标 agent 自身的执行轨迹定位高显著性的
      注入面，再自适应地生成上下文感知的恶意指令，针对机密性、完整性、可用性三类违背分别施压。
      关键之处在于把注入面的选择建立在观测到的 agent 行为上而非人类直觉上——攻击会随 agent
      真正关注的内容而调整。

  - id: "2510.18314"
    title: "Genesis: Evolving Attack Strategies for LLM Web Agent Red-Teaming"
    abbr: "Genesis"
    date: "2025-10"
    venue: "arXiv"
    section: "3.2"
    env: [web]
    summary: >-
      Argues that red-teaming built on manually crafted strategies or offline-trained static
      models cannot capture web agents' underlying behavioral patterns and therefore fails to
      generalize across environments — success in this setting requires attack strategies that
      keep being discovered and evolved. Genesis is a three-module agentic framework: an Attacker
      generating adversarial injections via a genetic algorithm over a hybrid strategy
      representation, a Scorer evaluating target responses for feedback, and a Strategist mining
      interaction logs to compile effective strategies into a reusable library.
    summary_zh: >-
      论证依赖人工编写策略或离线训练的静态模型的红队方法，无法捕捉 web agent 的底层行为模式，
      因而难以跨环境泛化——这个场景下的成功要求攻击策略被持续发现和演化。Genesis 是三模块 agentic
      框架：Attacker 用遗传算法在混合策略表示上生成对抗注入，Scorer 评估目标 agent 的响应并提供
      反馈，Strategist 从交互日志中挖掘有效策略并编纂进可复用的策略库。

  - id: "2606.00497"
    title: "\"I Strongly Suspect This Website Is a Scam\": Benchmarking PII Leakage and Detection without Defense in Autonomous Web Agents"
    abbr: "Scammer4U"
    date: "2026-05"
    venue: "arXiv"
    section: "1.5"
    env: [web]
    summary: >-
      Studies social-engineering attacks — deceptive content already pervasive online — as a
      vector for manipulating autonomous web agents into submitting users' PII to
      attacker-controlled endpoints. Scammer4U is a pre-registered benchmark of 91
      attacker-controlled environments plus 10 benign-twin baselines, spanning 8 attack vectors
      and 16 site categories on an 8-axis factorial taxonomy that isolates each design factor's
      causal contribution. The benign-twin design carries the argument: critical-tier PII leakage
      reaches 54–93% without privacy guidance versus 0% on the twins, proving leakage is
      attack-attributable rather than incidental form-filling.
    summary_zh: >-
      把社会工程攻击（互联网上早已普遍存在的欺骗性内容）作为一类攻击向量来研究，考察它如何操纵
      自主 web agent 把用户 PII 提交到攻击者控制的端点。Scammer4U 是**预注册**基准，含 91 个
      攻击者控制环境与 10 个「良性孪生」对照，覆盖 8 类攻击向量、16 类站点，构建在能隔离各设计
      因子因果贡献的 8 轴因子分类上。良性孪生的设计承担了论证核心：无隐私提示时关键级 PII 泄露
      达 54–93%，而孪生对照为 0%，证明泄露可归因于攻击本身，而非顺手填表的偶然行为。

  - id: "2608.06862"
    title: "SynChain: Inducing Computer-Use Agent Systems to Construct Their Own Attack Chains"
    abbr: "SynChain"
    date: "2026-08"
    venue: "arXiv"
    section: "1.6"
    env: [desktop]
    summary: >-
      Identifies a gap left by defenses that treat attacks as externally triggered or temporally
      bounded: CUAs now generate, store and reuse their own artifacts such as skills and memory
      entries, so compromise can propagate internally through the agent's persistent state. The
      paper shows malicious influence can be covertly embedded in the structural redundancies of
      autonomously synthesized artifacts, surviving internal state updates and slipping past
      standard vetting. SynChain formalizes this via persistence-aware directed supervised
      fine-tuning that induces agents to produce poisoned yet benign-looking artifacts, evaluated
      on CUAChain (30 benign task chains, three attack objectives) with dormant activation.
    summary_zh: >-
      指出把攻击视为「外部触发、时间有界」的现有防御留下的缺口：CUA 如今会自行生成、存储并复用
      skill 与记忆条目这类产物，因此沦陷可以通过 agent 自身的持久化状态在**内部**传播。论文表明
      恶意影响能被隐蔽地嵌入自主合成产物的结构冗余中，从而在内部状态更新后存活、并绕过常规审查
      机制。SynChain 用「持久化感知的定向监督微调」将这一威胁形式化，诱导 agent 产出被投毒却
      外观无害的产物，并在 CUAChain（30 条良性任务链 + 三类攻击目标）上评测其潜伏激活效果。

  - id: "2604.08005"
    title: "Preference Redirection via Attention Concentration: An Attack on Computer Use Agents"
    abbr: "PRAC"
    date: "2026-04"
    venue: "arXiv"
    section: "1.2"
    env: [desktop, web]
    summary: >-
      Notes that prior CUA attack work concentrated on the language modality while the vision
      modality received far less attention, then attacks precisely there. Rather than
      manipulating the VLM's output directly, PRAC alters the model's internal preferences by
      redirecting attention toward a stealthy adversarial patch, steering a CUA's product
      selection on an online shopping platform to a chosen target. Attack construction needs
      white-box access, but the finding that matters is transfer: it generalizes to fine-tuned
      versions of the same model, so a single base model shared across many deployed agents
      becomes a shared liability.
    summary_zh: >-
      指出以往 CUA 攻击工作集中在语言模态，视觉模态受到的关注远远不足，随后就攻在这里。PRAC 不
      直接操纵 VLM 的输出，而是通过把注意力重定向到一个隐蔽的对抗补丁上，改变模型的**内部偏好**，
      从而在网购平台上把 CUA 的商品选择引导到指定目标。攻击构造需要白盒访问，但真正值得注意的
      结论是可迁移性：攻击对同一模型的微调版本依然有效——这意味着被众多部署 agent 共用的同一个
      基座模型，会变成一处共享的软肋。

  - id: "2605.28646"
    title: "MaskClaw: Edge-Side Personalized Privacy Arbitration for GUI Agents with Behavior-Driven Skill Evolution"
    abbr: "MaskClaw"
    date: "2026-05"
    venue: "arXiv"
    section: "2.1"
    env: [mobile, desktop]
    summary: >-
      Frames GUI-agent privacy as an arbitration problem rather than a detection problem: whether
      something is private depends on task, recipient, application state and user role, so static
      PII detectors miss the boundaries, while cloud-side VLM reasoning uploads the raw screen
      *before* deciding what needed protecting. MaskClaw runs at the edge, extracting local visual
      evidence, retrieving user- and task-specific policy memory, and deciding Allow / Mask / Ask
      before screenshots leave the trusted environment. Across five skill-evolution scenarios it
      converts user corrections, cancellations and edits into reusable privacy skills vetted by a
      sandbox gate, benchmarked on P-GUI-Evo.
    summary_zh: >-
      把 GUI agent 隐私问题定义为**裁决**问题而非检测问题：某项内容是否属于隐私取决于任务、接收方、
      应用状态与用户角色，因此静态 PII 检测器抓不住这些边界，而云端 VLM 推理又会在决定「什么需要
      保护」**之前**就把原始屏幕上传出去。MaskClaw 运行在边缘侧：抽取本地视觉证据、检索用户与任务
      专属的策略记忆，在截图离开可信环境前判定 Allow / Mask / Ask。在五个 skill 演进场景中，它把
      用户的纠正、取消与编辑转化为可复用的隐私 skill，并经沙箱门校验，评测基准为 P-GUI-Evo。

  - id: "2603.11862"
    title: "You Told Me to Do It: Measuring Instructional Text-induced Private Data Leakage in LLM Agents"
    abbr: "ReadSecBench"
    date: "2026-03"
    venue: "arXiv"
    section: "1.1"
    env: [desktop]
    summary: >-
      Names the structural problem the Trusted Executor Dilemma: high-privilege agents are handed
      terminal access, filesystem control and outbound network connectivity, then asked to read
      and execute project documentation — but they cannot distinguish malicious directives from
      legitimate setup guidance, so they execute adversarial documentation-embedded instructions
      at high rates. The paper insists this is a consequence of the instruction-following design
      paradigm rather than an implementation bug. Measurement is structured by a three-dimensional
      taxonomy (linguistic disguise, structural obfuscation, semantic abstraction) over
      ReadSecBench, 500 real-world README files.
    summary_zh: >-
      把这一结构性问题命名为「可信执行者困境」（Trusted Executor Dilemma）：高权限 agent 被授予
      终端访问、文件系统控制与出网能力，然后被要求阅读并执行项目文档——但它无法区分恶意指令与
      正常的安装配置说明，因此会以很高的比率执行嵌在文档里的对抗指令。论文强调这是「指令遵循」
      设计范式的必然后果，而非实现层面的 bug。测量以三维分类法（语言伪装、结构混淆、语义抽象）
      组织，基准 ReadSecBench 由 500 个真实 README 文件构成。

  - id: "2512.07725"
    title: "Privacy Practices of Browser Agents"
    abbr: "Privacy Practices of Browser Agents"
    date: "2025-12"
    venue: "arXiv"
    section: "4"
    env: [web]
    summary: >-
      One of the few papers evaluating shipped browser-agent products rather than research
      prototypes, covering eight recent popular agents. The argument for urgency is structural:
      the same automation that makes these tools powerful also makes them high-risk failure
      points, and both the tasks they perform and the information entrusted to them mean a
      vulnerability translates directly into large privacy harm. The framework spans five factors
      and 15 distinct measurements — component vulnerabilities, protection against website
      behaviors, cross-site tracking prevention, response to privacy-affecting prompts, and the
      tool's own logging behavior.
    summary_zh: >-
      少数评测**已上市浏览器 agent 产品**而非研究原型的工作之一，覆盖八款近期流行 agent。其紧迫性
      论证是结构性的：让这些工具强大的自动化能力，同时使它们成为高风险的失效点；而它们所执行的
      任务类型与被托付的信息类型，意味着任何漏洞都会直接转化为大规模隐私危害。评测框架含五大因子
      共 15 项具体测量——组件自身漏洞、对网站行为的防护、跨站追踪阻断、对影响隐私的 prompt 的
      响应方式、以及工具自身的日志记录行为。

  - id: "2510.27140"
    title: "Measuring the Security of Mobile LLM Agents under Adversarial Prompts from Untrusted Third-Party Channels"
    abbr: "Mobile Agent Security Study"
    date: "2025-10"
    venue: "arXiv"
    section: "0"
    env: [mobile]
    summary: >-
      The first systematic study of security risks in mobile LLM agents, spanning adversarial case
      studies from opportunistic manipulation via pop-up advertisements up to end-to-end workflows
      involving malware installation and cross-app data exfiltration. Coverage is broad — eight
      state-of-the-art mobile agents across three architectures, over 2,000 adversarial and paired
      benign trials. The results are systemic rather than incidental: low-barrier vectors such as
      fraudulent ads succeed with over 80% reliability, and even workflows that require
      circumventing explicit operating-system warnings, such as malware installation, still go
      through.
    summary_zh: >-
      首个针对移动 LLM agent 安全风险的系统性研究，对抗案例从弹窗广告这类机会主义操纵，一直延伸到
      涉及恶意软件安装与跨应用数据外泄的端到端攻击流程。覆盖面很广——三种架构下的八个前沿移动
      agent，超过 2000 组对抗与配对良性试验。结论是系统性的而非个例：欺诈广告这类低门槛向量成功率
      超过 80%，而即便是需要绕过操作系统显式警告的流程（如安装恶意软件），依然能够走通。

  - id: "2602.10139"
    title: "Anonymization-Enhanced Privacy Protection for Mobile GUI Agents: Available but Invisible"
    abbr: "Available but Invisible"
    date: "2026-02"
    venue: "arXiv"
    section: "2.1"
    env: [mobile]
    summary: >-
      Diagnoses why existing privacy defenses for mobile GUI agents all fall short: reducing UI
      exposure, obfuscating only task-irrelevant content, or asking for user authorization each
      leave the hard case untouched — protecting information that is itself *task-critical*. The
      proposed principle is available-but-invisible: sensitive data stays usable for execution but
      is never directly visible to the cloud-based agent. Implementation combines a PII-aware
      recognition model over UI content with anonymization, so the agent operates on
      placeholders while the real values never leave the trusted boundary.
    summary_zh: >-
      诊断出移动 GUI agent 现有隐私防御为何都不够用：减少 UI 暴露、只混淆与任务无关内容、或依赖
      用户授权，这三条路都绕开了最难的情况——如何保护**本身就是任务必需**的敏感信息。论文提出的
      原则是「可用但不可见」：敏感数据对执行仍然可用，但云端 agent 永远看不到其真实内容。实现上
      结合 PII 感知的 UI 内容识别模型与匿名化，使 agent 在占位符上操作，真实值始终不越出可信边界。

  - id: "2606.20636"
    title: "SkillHarness: Harnessing Safe Skills for Computer-Use Agents"
    abbr: "SkillHarness"
    date: "2026-06"
    venue: "arXiv"
    section: "2.6"
    env: [desktop]
    summary: >-
      Targets an assumption baked into skill-learning methods: they distill reusable skills from
      successful trajectories while implicitly assuming static, safe environments, ignoring both
      adversarial interaction such as prompt injection and environmental dynamics such as pop-ups.
      In dynamic settings that assumption produces risky learned skills and brittle execution, so
      the vulnerability gets *baked into* the agent's reusable library. SkillHarness models skill
      learning and use as a safety-constrained interaction process, introducing a skill boundary
      that replaces static skill abstractions.
    summary_zh: >-
      针对 skill 学习类方法中一个被默认接受的假设：它们从成功轨迹中蒸馏可复用 skill，却隐含假定
      环境是静态且安全的，既忽略提示注入这类对抗交互，也忽略弹窗这类环境动态。在动态环境下，这个
      假设会产出有风险的 skill 与脆弱的执行——也就是说漏洞被**固化进**了 agent 的可复用库里。
      SkillHarness 把 skill 的学习与使用建模为受安全约束的交互过程，引入「skill 边界」以取代
      静态的 skill 抽象。

  - id: "2602.08235"
    title: "When Benign Inputs Lead to Severe Harms: Eliciting Unsafe Unintended Behaviors of Computer-Use Agents"
    abbr: "AutoElicit"
    date: "2026-02"
    venue: "arXiv"
    section: "1.7"
    env: [desktop]
    summary: >-
      Observes that CUAs demonstrably produce unsafe unintended behaviors even under benign inputs,
      but exploration of this risk has stayed anecdotal — no concrete characterization, no
      automated way to surface long-tail cases. The paper supplies the first conceptual and
      methodological framework for unintended CUA behavior: defining its characteristics,
      eliciting it automatically, and analyzing how it arises from benign inputs. AutoElicit
      iteratively perturbs benign instructions using CUA execution feedback while keeping the
      perturbations realistic and benign, surfacing hundreds of harmful behaviors from frontier
      models including Claude 4.5 Haiku and Opus.
    summary_zh: >-
      观察到 CUA 即便在良性输入下也确实会产生不安全的非预期行为，但对这类风险的探索一直停留在
      个案层面——既无具体刻画，也无自动化手段挖掘长尾情形。论文提供了首个关于 CUA 非预期行为的
      概念与方法框架：定义其关键特征、自动化诱发、并分析它如何从良性输入中产生。AutoElicit 利用
      CUA 的执行反馈迭代扰动良性指令，同时保持扰动本身真实且无恶意，从 Claude 4.5 Haiku、Opus
      等前沿模型上挖掘出数百个有害行为。

  - id: "2601.07263"
    title: "When Bots Take the Bait: Exposing and Mitigating the Emerging Social Engineering Attack in Web Automation Agent"
    abbr: "AgentBait"
    date: "2026-01"
    venue: "arXiv"
    section: "1.7"
    env: [web]
    summary: >-
      Notes that prior research concentrated on model-level threats like prompt injection and
      backdoors while social engineering against web automation agents stayed unexplored, even as
      open-source frameworks such as Browser Use and Skyvern-AI widened the attack surface. The
      AgentBait paradigm exploits an intrinsic execution weakness: inducement contexts distort the
      agent's reasoning and steer it toward objectives misaligned with the intended task, without
      any injected instruction. The defense, SUPERVISOR, is a lightweight pluggable runtime module
      enforcing environment-and-intention consistency between webpage context and the intended
      goal.
    summary_zh: >-
      指出以往研究集中在提示注入、后门这类模型层威胁，而针对 web 自动化 agent 的社会工程攻击一直
      无人探索——尽管 Browser Use、Skyvern-AI 等开源框架已显著扩大了攻击面。AgentBait 攻击范式
      利用执行层面的内在弱点：诱导性上下文会扭曲 agent 的推理，把它引向与原任务不一致的目标，
      而全程不需要注入任何指令。防御侧提出 SUPERVISOR，一个轻量可插拔的运行时模块，强制网页
      上下文与预期目标之间的「环境—意图一致性」对齐。

  - id: "2607.18659"
    title: "Broken Gates: Re-evaluating Web Bot Defenses in the Age of LLM Agents"
    abbr: "Broken Gates"
    date: "2026-07"
    venue: "arXiv"
    section: "4"
    env: [web]
    summary: >-
      Inverts the usual perspective: instead of asking how to protect agents, it asks whether the
      web's existing bot management systems still hold now that browser agents navigate
      autonomously, reason about page content and follow natural-language instructions rather than
      replaying predefined scripts. The measurement covers both interactive challenge-based and
      non-interactive trust-based defenses against two attacker classes — commercial Captcha
      solvers and LLM browser agents — spanning seven solver services and six agent configurations
      (cloud-hosted, self-hosted, AI-assisted, extension) against hCaptcha, reCaptcha v2/v3 and
      Cloudflare Turnstile. Challenge-based defenses are broken.
    summary_zh: >-
      把通常的视角反转过来：不问「如何保护 agent」，而问「在浏览器 agent 能自主导航、理解页面内容、
      按自然语言指令行动（而非回放预设脚本）之后，网络现有的 bot 管理系统还挡得住吗」。测量同时
      覆盖交互式挑战型防御与非交互式信任型防御，面对两类攻击者——商业验证码破解服务与 LLM 浏览器
      agent——涵盖 7 家破解服务与 6 种 agent 配置（云托管、自托管、AI 辅助、浏览器扩展），针对
      hCaptcha、reCaptcha v2/v3、Cloudflare Turnstile。结论是：挑战型防御已经失守。

  - id: "2602.08995"
    title: "When Actions Go Off-Task: Detecting and Correcting Misaligned Actions in Computer-Use Agents"
    abbr: "DeAction"
    date: "2026-02"
    venue: "arXiv"
    section: "2.2"
    env: [desktop]
    summary: >-
      Unifies two failure sources usually studied separately: misaligned actions arising from
      external attacks such as indirect prompt injection, and from internal limitations such as
      erroneous reasoning — both deviate from user intent, both degrade safety and task
      reliability, so a detector keyed only to attacks misses half the problem. The work defines
      misaligned action detection for CUAs, identifies three common categories in real deployment,
      and builds MisActBench from realistic trajectories with human-annotated action-level
      alignment labels. DeAction is a universal guardrail detecting misalignment before execution
      and iteratively correcting it via structured feedback.
    summary_zh: >-
      把通常被分开研究的两类失效来源统一起来：源自外部攻击（如间接提示注入）的偏离动作，与源自
      内部局限（如推理错误）的偏离动作——两者都背离用户意图、都损害安全性与任务可靠性，因此只针对
      攻击设计的检测器会漏掉一半问题。工作定义了 CUA 的「偏离动作检测」任务，归纳出真实部署中的
      三类常见情形，并基于真实轨迹构建带人工标注的动作级对齐标签基准 MisActBench。DeAction 是
      通用护栏，在执行前检出偏离动作，并通过结构化反馈迭代纠正。

  - id: "2608.00202"
    title: "From Monoliths to Swarms: A Study of Attack Surface Evolution in the Transition to Multi-Agent Web Systems"
    abbr: "WebMASLab"
    date: "2026-07"
    venue: "arXiv"
    section: "0"
    env: [web]
    summary: >-
      Asks what role decomposition costs in security terms: multi-agent web systems improve task
      performance by splitting work across specialized sub-agents, but that split creates
      structural attack surfaces absent in single-agent setups, and those surfaces remain poorly
      categorized. The paper proposes a taxonomy for attack vectors specific to web-based MAS and
      builds WebMASLab to study a fully external, web-only adversary. Methodologically it is
      careful — user task, tool surface and browser substrate are held fixed so that only
      architecture varies, across three adversarial scenarios and three conditions (baseline,
      prompt-hardened, reasoning-enabled).
    summary_zh: >-
      追问「角色分解」在安全上的代价：多 agent web 系统通过把工作拆给专职子 agent 来提升任务性能，
      但这种拆分会产生单 agent 架构下不存在的结构性攻击面，而这些攻击面此前缺乏归类。论文提出
      针对 web 多 agent 系统的攻击向量分类法，并构建 WebMASLab 来研究一个完全外部、仅通过网页
      施加影响的攻击者。方法上相当严谨——固定用户任务、工具面与浏览器基座，只让架构一个变量变化，
      覆盖三种对抗场景与三种条件（基线、prompt 加固、开启推理）。

  - id: "2512.08417"
    title: "Attention is All You Need to Defend Against Indirect Prompt Injection Attacks in LLMs"
    abbr: "Rennervate"
    date: "2025-12"
    venue: "arXiv"
    section: "2.1"
    env: [web]
    summary: >-
      Takes a mechanistic route to injection defense by reading attention features rather than
      classifying text: Rennervate detects covert injection at token-level granularity, which
      enables precise sanitization that neutralizes the injection while leaving the rest of the
      LLM's functionality intact — a contrast with page-level or segment-level defenses that must
      discard clean content along with the poisoned span. The token-level detector uses a two-step
      attentive pooling mechanism aggregating attention heads and response tokens. The work also
      releases FIPI, a fine-grained IPI dataset, and reports outperforming 15 commercial and
      academic defenses.
    summary_zh: >-
      走机制路线做注入防御——读取注意力特征而非对文本做分类：Rennervate 在 **token 级**粒度检出
      隐蔽注入，从而实现精确净化，在中和注入的同时保留 LLM 其余功能完整。这与页面级或片段级防御
      形成对比，后者必须把干净内容与被污染片段一起丢弃。token 级检测器采用两步注意力池化机制，
      聚合注意力头与响应 token。工作同时发布细粒度 IPI 数据集 FIPI，并报告优于 15 种商业与学术
      防御方法。

  - id: "2603.04364"
    title: "Dual-Modality Multi-Stage Adversarial Safety Training: Robustifying Multimodal Web Agents Against Cross-Modal Attacks"
    abbr: "DMAST"
    date: "2026-03"
    venue: "arXiv"
    section: "2.6"
    env: [web]
    summary: >-
      Locates an attack surface created by architecture: multimodal web agents consume both
      screenshots and accessibility trees, so an adversary injecting into the DOM corrupts *both*
      observation channels at once with a mutually consistent deceptive narrative, defeating any
      cross-channel sanity check. Vulnerability analysis on MiniWob++ shows attacks with a visual
      component far outperform text-only injection, exposing the gap left by text-centric VLM
      safety training. DMAST formalizes agent-attacker interaction as a two-player zero-sum Markov
      game and co-trains both sides through imitation learning, oracle-guided SFT with a
      zero-acknowledgment strategy, and a final adversarial stage.
    summary_zh: >-
      定位到一处由架构本身造就的攻击面：多模态 web agent 同时消费截图与无障碍树，因此攻击者只需
      注入 DOM 就能**同时**污染两个观测通道，并且两边叙述互相一致，使任何跨通道一致性检查都失效。
      MiniWob++ 上的漏洞分析显示，带视觉成分的攻击远强于纯文本注入，暴露出以文本为中心的 VLM
      安全训练所留下的缺口。DMAST 把 agent 与攻击者的交互形式化为二人零和马尔可夫博弈，通过模仿
      学习、带「零确认」策略的 oracle 引导 SFT、以及最后的对抗阶段共训双方。

  - id: "2604.11259"
    title: "Mobile GUI Agent Privacy Personalization with Trajectory Induced Preference Optimization"
    abbr: "TIPO"
    date: "2026-04"
    venue: "arXiv"
    section: "2.4"
    env: [mobile]
    summary: >-
      Reframes privacy as a personalization problem rather than a fixed policy: most systems
      optimize task success or efficiency, ignoring that different users want different privacy
      postures. The technical observation is that personalization induces systematic structural
      heterogeneity in trajectories — a privacy-first user prefers protective actions like
      refusing permissions, logging out and minimizing exposure, producing logically different and
      variable-length trajectories from a utility-first user, which destabilizes standard
      preference optimization. TIPO addresses this with preference-intensity weighting to emphasize
      key privacy steps and padding gating to suppress alignment noise.
    summary_zh: >-
      把隐私重新框定为**个性化**问题而非一套固定策略：多数系统只优化任务成功率或效率，忽略了不同
      用户想要的隐私姿态本就不同。技术上的关键观察是个性化会引起轨迹的系统性结构异质——隐私优先的
      用户偏好拒绝权限、登出、最小化暴露这类保护性动作，产生与效用优先用户在逻辑上不同、长度也
      不等的轨迹，从而使标准偏好优化变得不稳定且信息量下降。TIPO 用偏好强度加权突出关键隐私步骤，
      并以 padding gating 抑制对齐噪声。

  - id: "2508.19461"
    title: "Reliable Weak-to-Strong Monitoring of LLM Agents"
    abbr: "CUA-SHADE-Arena"
    date: "2025-08"
    venue: "arXiv"
    section: "2.3"
    env: [desktop]
    summary: >-
      Stress-tests monitoring systems for covert agent misbehavior such as secretly sharing private
      information, via a monitor red teaming workflow varying agent and monitor situational
      awareness, applying evasion strategies including prompt injection, and running on
      SHADE-Arena for tool-calling agents plus the new CUA-SHADE-Arena extending TheAgentCompany
      to computer-use agents. The headline finding is asymmetric and counterintuitive: agent
      awareness dominates monitor awareness — an agent knowing it is monitored substantially
      degrades monitor reliability, while giving the monitor more information about the agent helps
      far less.
    summary_zh: >-
      压力测试针对 agent 隐蔽违规（如私下分享隐私信息）的监控系统：设计「监控器红队」工作流，
      变化 agent 与监控器各自的情境感知程度，施加含提示注入的规避策略，并在面向工具调用 agent 的
      SHADE-Arena 与新构建的 CUA-SHADE-Arena（把 TheAgentCompany 扩展到 computer-use agent）
      上运行。核心发现不对称且反直觉：**agent 的感知压制监控器的感知**——agent 一旦知道自己正被
      监控，监控可靠性显著下降；而反过来给监控器提供更多关于 agent 的信息，帮助要小得多。

  - id: "2506.02539"
    title: "VerificAgent: Domain-Specific Memory Verification for Scalable Oversight of Aligned Computer-Use Agents"
    abbr: "VerificAgent"
    date: "2025-06"
    venue: "arXiv"
    section: "2.4"
    env: [desktop]
    summary: >-
      Treats persistent memory as an explicit alignment surface, on the reasoning that continual
      memory augmentation lets CUAs learn from prior interactions but unvetted memories encode
      domain-inappropriate or unsafe heuristics — spurious rules that quietly drift from user
      intent and safety constraints. VerificAgent combines an expert-curated seed of domain
      knowledge, iterative trajectory-based memory growth during training, and a post-hoc human
      fact-checking pass before deployment. The framing is the contribution: having humans correct
      high-impact errors once turns verified memory into a frozen safety contract that future
      actions must satisfy, with no model fine-tuning required.
    summary_zh: >-
      把持久化记忆当作一个**显式的对齐面**来处理，理由是：持续的记忆增强让 CUA 能从过往交互中学习，
      但未经审核的记忆会编码领域不适当或不安全的启发式规则——这些伪规则会悄然偏离用户意图与安全
      约束。VerificAgent 结合三部分：专家策划的领域知识种子、训练期基于轨迹的迭代记忆增长、以及
      部署前的人工事实核查环节。真正的贡献在其框定方式：让人类**一次性**纠正高影响错误，就把
      经核验的记忆变成一份「冻结的安全契约」，后续所有动作都必须满足它，且无需微调模型。
